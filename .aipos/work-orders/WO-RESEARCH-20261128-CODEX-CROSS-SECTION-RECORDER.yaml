notes:
  - "Implementation maps the absent `scripts/offline-lab-f2b-adaptive-evalue.js` reference to the existing synthetic-only `scripts/alpha-lab/f2b-evalue-power.js`; no reference code or artifact was created or changed."
  - "The E3 reader consumes only the shared E1 registry at `research/alpha-lab/registry/events.jsonl`; it calls `scripts/alpha-lab/registry.js:readRegistry()` when available and otherwise verifies the same canonical row chain and REGISTERED/VERDICT/RETIRED semantics. It checks the canonical frozen hypothesis file hash (sorted-key JSON plus one LF) and firstEvaluableDate; no registry writer or production hypothesis is included. Terminal verdicts, retirement, and the last declared look prevent further market-data fetches."
  - "The recorder supports the registered momentum signal over a sorted 3–56 KRW universe and 1–3650-day lookback, ranks only from closes through signal date t, carries a top-third equal-weight basket for `hold` days, and records only the next completed close-to-close outcome. It charges 15 bp times the absolute weight-change sum only at rebalance, never backfills, and chains every observation."
  - "The test fixture registration is temporary synthetic test data only. No hypothesis was registered in the repository, no market-data request was made, and no result artifact was created. Workflow eligibility requires a registered row, firstEvaluableDate, 2026-12-10 UTC cutoff, and a 15-minute post-close settle window."
  - "The design reference has sections 1–6 only; the cited Section 7 is absent on the implementation base. The implementation follows the available Section 2 plus F2b script and the owner-approved E3 decisions."
  - "The e-process combines the F2b baseline fixed-lambda mixture and predictable adaptive bet 50/50, with prior-only 4-sd clipping, 20-day burn-in, and alphaSpent threshold. PASS is latched at the first crossing and remains auditable in the recomputed status."
  - "Local validation is recorded in the AIPOS handoff: focused recorder tests 11/11 and workflow regression tests 32/32, synthetic/no-network; node check and ESLint pass; workflow YAML/pins/inputs/authority map pass; AIPOS YAML/index and `pnpm run preflight` pass; `git diff --check` pass. Draft PR #3361 is open; live PR checks are the source of truth for exact-head CI and independent review remains pending. No host, app, order, release, or safety-authority changes are in scope."
