review_findings:
  addressed_from_head_f909604b:
    - "Malformed eligibility must be rejected unless eligible is boolean and cyclesEvaluated is a non-negative safe integer."
    - "Unsupported restart reconciliation values must remain unresolved and never fall through to another mutation."
    - "Application read/intent/mutation/receipt must run under the existing canonical exclusive application-owner lease; lease contention fails closed."
  addressed_locally_20261023:
    - "Reserve terminal A4 receipt capacity atomically with its durable intent in the existing SQLite ledger; unrelated writers cannot consume the promised slot."
    - "Only the transaction that created the write-ahead intent may mutate; an already-claimed intent fails closed."
    - "Fail-safe target must equal the owner-declared surface fail-safe and remain inside the immutable bounds before it reaches the setter."
    - "Receipt timestamp/runtime/source provenance was already included in the fingerprint and is regression-tested; no duplicate identity mechanism was added."
  addressed_locally_20261025:
    - "Malformed A4 intent namespace/status mismatches now fail closed instead of being ignored and leaving terminal receipt capacity unreserved."
  addressed_locally_20261025_followup:
    - "Use one exclusive lock identity per mutable surface across all cycles, so different cycle decisions cannot mutate the same surface concurrently."
    - "Resolve any pending intent on that surface before a newer decision is evaluated; persist recovery with the original intent's cycle, decision, timestamp, runtime, and source identities."
    - "A recovery REJECTED receipt releases only its matching reserved terminal slot; arbitrary or mismatched rejection records do not release capacity."
    - "Reject unknown fields on durable application intents and receipts so unbound provenance cannot enter the canonical ledger; the storage reservation reader allows only the outcome-specific optional receipt field."
  addressed_locally_20261025_outcome_provenance:
    - "Reject self-consistent APPLIED receipts whose appliedValue differs from boundedValue; also enforce REJECTED/NOOP value semantics and the surface's canonical FAILED fail-safe value."
    - "Bind applicationTimestamp, runtimeIdentity, and sourceCommit from every terminal receipt to its durable intent, including recovery rejections; require the durable intent for outcomes that claim a mutation or close a recovered intent."
    - "The canonical SQLite ledger independently rejects terminal receipt outcome/provenance forgeries before append and does not release a mismatched intent reservation."
