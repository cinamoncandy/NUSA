root_cause_chain:
  - "1. No strategy has shown an edge after costs on candle data: every rule-based candidate fails drawdown or no-edge, so no QUALIFIED_FOR_LEAGUE lineage exists and no candidate-bound period or cycle can start. This is an evidence condition, not a plumbing defect."
  - "2. The baseline itself is held by the consecutive-loss limit, so open periods collect no fills. The limit is a risk limit and is not to be loosened."
  - "3. Fixed already: closed-candle collection stalled 10-17..10-20 (PR #2828, deployed). Remaining: dataset manifests cannot be built while pre-10-17 ticker-origin 1m rows (no volume/receipts) sit in the 12-day window; they leave the window about 2026-10-30 without any action."
  - "4. The one pre-registered next experiment, ORDERBOOK+INTRADAY+ALL_KRW+ML, needs data until 2026-10-28 and prints WAITING_DATA until 2026-10-29T02:00Z. 2.2 M order-book samples and 443 k trade ticks are already being recorded with 0 write failures."
code_audit_2026_10_21: "Independent read-only audit of the FAIL_* path found no defect that makes valid strategies fail. FAIL_EXCESSIVE_DRAWDOWN means the challenger lost the head-to-head against the fixed SMA 5/20 champion and had a deeper drawdown (researchFailureMemory.ts:30-53), not an absolute limit; the challenger must beat the champion on return, drawdown, Sharpe and execution quality together (researchRuntimeCoordinator.ts:272-280). Drawdown (aiBacktestEngine.ts:173-174), fees and slippage (5 bp + 5 bp per side, applied once), look-ahead, annualisation and the train/validation/holdout split were checked and are consistent. About 20 bp per round trip on 1m bars with 2 days of validation data is consistent with an honest no-edge outcome (docs/RESEARCH_NOTE_2026-10-13_LEARNING_METHODS.md). Not checked: production ledger rows, run-cloud-research-snapshot.js, apps/desktop/src/cloud, no tests were run."
reporting_limitation: "researchMetaLearning.ts:130-141 hardcodes holdoutPass 0 and counts only PASS_* keys while the orchestrator emits VALIDATION_*/HOLDOUT_* keys, so a runtime holdout win would not count in the meta ledger and overfitRatePercent reads 100 whenever discoveryPass > 0. Moot today (no validation win, so no holdout has run) and it does not cause any failure. Fix it before the first runtime holdout; not changed here."
no_code_fix_exists_because: "A code change cannot honestly create a qualified candidate: that would mean weakening a gate, a threshold or a sample requirement, or fabricating a candidate/period, all forbidden. The loop is behaving correctly while waiting for evidence."
