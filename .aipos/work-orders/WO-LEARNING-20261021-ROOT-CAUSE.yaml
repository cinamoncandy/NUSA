host_health_notes: "disk 91% (4.5 GB free), 954 MB RAM, event-loop stalls up to 6 s, previousStop PAPER_WRITER_LEASE_LOST at the last restart; none is the cause of the missing cycle, but the disk is the nearest operational risk."
not_changed: "No risk limit, threshold, capital, gate or sample requirement. PAPER only, liveAuthority=NONE, productionMutationAllowed=false, aiAuthority=ZERO_AUTHORITY."
code_fix_2026_10_21: "researchMetaLearning.ts runtimeResearchEntries now counts the orchestrator's own win keys: VALIDATION_CHALLENGER_BETTER is one evaluated configuration and a discovery pass, HOLDOUT_CHALLENGER_BETTER is a holdout pass (never above the discoveries). Previously only PASS_* keys were counted, so a genuine win would have been invisible to the meta ledger and overfitRatePercent could not fall. No gate, threshold, holdout rule or authority changed; today's figures are unchanged because no challenger has won."
