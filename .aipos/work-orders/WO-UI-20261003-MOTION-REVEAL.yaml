id: WO-UI-20261003-MOTION-REVEAL
title: "Staggered section reveal on every ScreenFrame screen and the HOME vital tiles"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/ui-motion-polish
authority_impact: none
objective: "Owner asked for better motion. Sections used to appear all at once (or not animate at all outside HOME/Chart). Each section now rises in order with a short stagger, app-wide."
scope:
  - "apps/mobile/src/components.tsx: MotionReveal gains index (stagger) and style; easeOut cubic, 320 ms, lift 14. Delay is capped (6 steps x 55 ms) by revealStagger.ts."
  - "apps/mobile/src/screenFrame.tsx: every ScreenFrame screen staggers its top-level sections."
  - "apps/mobile/src/homeView.tsx: the four HOME vital tiles reveal in sequence (layout moved to a wrapper cell)."
  - "apps/mobile/src/designSystem.ts: fieldMotion.revealMs/revealStaggerMs/revealMaxIndex."
  - "tests/mobile-motion-reveal.test.js (3)."
exclusions:
  - "Money and counters are never animated or interpolated (existing contracts pin krw(account?.equity)); no looping idle motion added to the Intelligence Field (existing rule: it moves only on state change); no change to data, risk, execution, LIVE or credentials."
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: "Reduced-motion users get the final state immediately (unchanged branch)."
rollback: "Revert the change."
verification_commands:
  - npx tsc -p tsconfig.json
  - node scripts/lint-mobile.js
  - node --test tests/mobile-*.test.js
residual: "Not seen on a device here; CI touch-visual emulator run is the visual check. Screens that do not use ScreenFrame (HOME hero, chart, settings details) keep their existing motion. Needs a new app build to reach the phone."
