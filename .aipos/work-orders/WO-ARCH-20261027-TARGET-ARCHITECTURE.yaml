id: WO-ARCH-20261027-TARGET-ARCHITECTURE
title: Target architecture proposal - small trading core, separate research data, off-host observability, code census
status: PROPOSED_NEEDS_FORMAL_VALIDATOR_AND_OWNER_APPROVAL
priority: P1
owner: nusa-development
repository: cinamoncandy/NUSA
issue: 2770
