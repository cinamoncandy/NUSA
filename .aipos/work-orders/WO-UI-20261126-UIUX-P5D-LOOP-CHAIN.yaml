owner_decision: "2026-11-26: the owner sent four reference videos (agent dashboards with step counters and flowing node lines) and answered \"둘 다 해\" to two ideas, one of them a progress display on 학습 drawn in the sphere's language (nodes lit in loop order with a counter)."
follows: "WO-UI-20261126-UIUX-P5A-FUTURES-SPHERE (PR #3318); docs/NUSA_MOBILE_UIUX_V6_CALM_FIELD.md (design E)."
objective: "The six loop steps (관찰, 신호, 판단, 안전, 체결, 평가) were six unconnected circles. They are now one chain: a hairline joins the node centres, the part of the line up to the last confirmed step is lit, confirmed nodes are filled, a BLOCKED step keeps its attention colour, and the next unconfirmed step wears an ice ring. The 1 / 6 count, the labels and the accessibility label are unchanged. Static: no motion, no data of its own."
