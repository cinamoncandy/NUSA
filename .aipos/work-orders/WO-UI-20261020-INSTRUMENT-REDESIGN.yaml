id: WO-UI-20261020-INSTRUMENT-REDESIGN
title: "App redesign in the owner-chosen 계기판 (instrument) direction"
status: IN_REVIEW
owner_decision: "Owner, 2026-10-20 (chat): rejected the particle 흐름, AI aurora and light finance-app proposals (game-like / ordinary); chose the dark 계기판 design (artifact https://claude.ai/artifact/NHtuyNuaRcCxVLg2j8kGux) and asked for fast motion and all four screens."
history:
