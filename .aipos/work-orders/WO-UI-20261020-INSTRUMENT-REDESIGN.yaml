  - "#2823 Learning: one cell per tested strategy unit chart (stacked on #2822)."
  - "#2824 Safety AND circuit + Records log (stacked on #2823)."
not_in_app: "The design's 24-hour ruler: the server sends no stop time, so drawing it would invent one."
verification: "Each PR: root tsc, mobile tsc --noEmit, mobile tests 751/751, lint-mobile, independent non-author review with fixes. No device check."
lesson: "Run `pnpm run typecheck` equivalents (root and apps/mobile tsconfig) before every push: the root tsc does not type-check mobile .tsx (a #2822 type error was found this way before CI)."
next:
