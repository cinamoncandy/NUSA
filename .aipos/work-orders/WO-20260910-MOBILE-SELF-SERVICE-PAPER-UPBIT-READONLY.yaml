id: WO-20260910-MOBILE-SELF-SERVICE-PAPER-UPBIT-READONLY
title: "Device-bound mobile PAPER recovery and Upbit READ_ONLY session mediation"
status: IMPLEMENTED_LOCAL_VALIDATION_PARTIAL
owner: nusa
repository: cinamoncandy/NUSA
base_branch: main
objective: "Restore an existing Android secure mobile PAPER session automatically; when absent or rejected, allow only a zero-authority, owner-approved device pairing that atomically issues the existing rotating session. Reuse that session for GET-only Upbit account/order observation."
authority:
  mode: PAPER_ONLY
  liveAuthority: NONE
  productionMutationAllowed: false
  realOrderAuthority: false
  realTransferAuthority: false
  aiAuthority: ZERO_AUTHORITY
architecture_impact:
  acknowledged: true
  analysis: "Pairing remains inside the existing ApprovedUserSessionService and its mobile namespace. It creates no new identity provider, execution path, mutable Upbit adapter, credential delivery path, or authority model. The Upbit relay remains loopback-only and validates a mobile access token only by GET /v1/mobile/me Cloud introspection."
  references:
    - .aipos/architecture.md
    - docs/NUSA_USER_EXPERIENCE_PRINCIPLE.md
    - .aipos/work-orders/WO-0060A-android-approved-user-session.yaml
    - .aipos/work-orders/WO-20260907-MOBILE-PAPER-SESSION-RECONNECT.yaml
scope:
  - Android Secure Storage rotating-session restore with bounded retry
  - short-lived device-bound pairing request, ACTIVE OWNER plus users:manage approval, expiry/replay/race/flood bounds
  - direct atomic approved-pairing session issuance with no pairing-row credential storage
  - mobile Settings primary PAPER connection request/status flow and secondary legacy-token compatibility
  - authenticated PAPER session mediation for GET-only Upbit account/order observation
prohibited:
  - pairing self-authorization
  - plaintext bootstrap/access/refresh credentials in pairing rows, UI, or audit logs
  - independent Upbit credential persistence in normal mobile flow
  - Upbit POST/PUT/PATCH/DELETE, order mutation, cancellation, transfer, withdrawal, or LIVE imports
  - LIVE authority, production mutation, or AI authority change
acceptance:
  - routine secure-session restore precedes pairing and retains retryable secure state only for transient failure
  - definitive 401/403 clears secure session and pairing can only begin zero-authority
  - pairing approval requires an ACTIVE OWNER principal with users:manage and an ACTIVE target
  - pairing exchange is device-bound, expiry-bounded, atomic, and single-use
  - pairing DB and audit records contain hashes/lifecycle metadata only, never bootstrap/access/refresh credentials or verification codes
  - mobile Upbit routes use PAPER session credentials and relay validation is strict loopback GET introspection
  - relay account/order routes reject all non-GET methods
