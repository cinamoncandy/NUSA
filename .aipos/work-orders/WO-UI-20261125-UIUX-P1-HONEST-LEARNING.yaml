objective: "Two honesty fixes on the 학습 screen, no layout or navigation change. (1) In COLLECT_ONLY, a PAUSED loop is the designed state: headline \"수집 전용이라 판단은 쉬어요\" in the normal tone (not the orange attention tone) with the reason \"주문이 꺼져 있어서 판단은 0건이에요 · 연구는 데이터를 모으는 중이에요\". A halt, an error, a risk block, a halt explanation or missing data keep their existing wording and colour. (2) The result rows show \"측정 기간 <first> ~ <last>\" (KST dates of the server's own account events) or \"측정 기간을 알 수 없어요 · 0은 기록이 없다는 뜻일 수 있어요\" (account and fill events both count); the span is never guessed. The sentence \"판단은 0건\" is said only when no decision is present in the latest state, the timeline or a local fallback; otherwise \"지금은 판단하지 않아요\"."
change:
  - "apps/mobile/src/learningScreenModel.ts: options { collectOnly }, periodLabel and resultPeriodLabel; apps/mobile/src/learningView.tsx: a collectOnly prop (not forwarded to the monitor) and one muted line under the results label; apps/mobile/App.tsx: both render sites pass collectOnly = !paperProjectionPending && isCollectOnlyObservation(snapshot) (the same expression the safety line already uses); tests/mobile-learning-screen-model.test.js: 5 tests."
not_changed:
  - "Tabs, navigation, other screens, the safety line, the server, the cloud, any gate, threshold, limit, capital, host or authority. No authority is read or granted: the flag only replaces an alarming wording by an accurate one."
