id: WO-PAPER-20261005-RESEARCH-REFRESH-MEMORY
title: "Research snapshot refresh checks available memory, with a 350 MB floor"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/research-refresh-memory
authority_impact: resource_guard_threshold_only
owner_approval: "Owner approved in chat, 2026-10-05 ('승인'), in answer to the question whether to lower the refresh memory floor from 600 MB to 350 MB measured as available memory."
objective: "The owner asked why the learning data stays 'not received'. The read-only host diagnosis showed the PAPER host (954 MB) with 63 MB free but about 395 MB available. The on-demand Research snapshot refresher requires 600 MB of os.freemem() (completely unused memory), so it can never start on this host."
scope:
  - "apps/cloud/src/researchSnapshotRefresher.ts: measure available memory (Linux MemAvailable from /proc/meminfo, falling back to the stricter os.freemem() when unreadable) and lower the floor from 600 MB to RESEARCH_REFRESH_MIN_AVAILABLE_MEMORY_BYTES = 350 MB. Heap cap (256 MB), lowest CPU priority, one-at-a-time and the 6 h minimum interval are unchanged; a low-memory skip is still not recorded as an attempt."
  - "apps/cloud/src/researchSnapshotRefresher.test.ts: boundary at 350 MB, MemAvailable parsing from the diagnosed host reading, malformed input rejected; existing tests adjusted to the renamed option."
exclusions:
  - "No change to what the refresh produces. A new snapshot still goes through the unchanged replay, qualification and Governance path before any PAPER_RESEARCH_ONLY deployment. No trading, capital, min-order, risk, LIVE, credential or AI-authority change."
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: "If /proc/meminfo is missing or malformed the stricter os.freemem() is used (the previous behaviour with the lower floor still requires 350 MB truly free)."
rollback: "Revert the change, or restore the 600 MB constant."
verification_commands:
  - npx tsc -p tsconfig.json
  - node --test dist/apps/cloud/src/researchSnapshotRefresher.test.js
  - node scripts/validate-aipos-yaml.js && node scripts/validate-aipos-drift.js
residual: "That memory is why the learning data is missing is an inference from the diagnosis plus the code, not observed on the host (the diagnosis account cannot read the service log). The refresh only runs when the closed-learning bootstrap reports it is waiting for a snapshot. After the next deploy, check the host diagnosis and the app's learning line. Real memory headroom on the 1 GB host during a refresh is unmeasured; a refresh that gets killed would be recorded as FAILED and retried after 6 h. The change takes effect only after the next PAPER deploy."
