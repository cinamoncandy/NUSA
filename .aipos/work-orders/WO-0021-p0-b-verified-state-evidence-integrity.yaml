objective: "Separate claimed execution state from evidence-backed verified state and prevent VERIFIED/COMPLETED claims from outrunning durable evidence."
source_of_truth:
  architecture:
    - docs/NUSA_CORE_ARCHITECTURE_PRINCIPLE.md
