id: WO-AUTOPILOT-20261013-REPAIR-TARGET-ALLOWLIST
title: "Repair only failed code checks on main, never Autopilot's own or runtime evidence workflows"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
branch: claude/autopilot-repair-target-allowlist
pull_request: 2651
authority_impact: none
parent: WO-OPS-20261013-CLAUDE-CENTERED-REDESIGN
owner_approval: "2026-10-13 in chat (owner chose 'P1 시작' after the Claude-centered redesign revision 2)"
scope_note: "First P1 increment of the redesign (docs/CLAUDE_CENTERED_OPERATING_MODEL.md section 7 item 1). One predicate narrows which failed runs the scheduled runtime and scheduled evolution coding treat as repair targets. It only withholds work; no Worker route, config, workflow, Audit, Release, Risk or authority change."
objective: "Stop the scheduled Autopilot from re-dispatching repairs for failures that no bounded patch can fix: only failed or timed-out runs of CI and Autopilot Sandbox New-File Guard on main, from a push or a manual run, are repair targets."
evidence_of_problem:
  - "2026-10-12: Autopilot Execution Consumer failed 230 times (26 on 2026-10-11)."
  - "Worker /scheduled/status: the failed scheduled Autopilot Codex Coding run 38300571241 was re-dispatched eleven times between 19:55 and 20:48 UTC; the PAPER evidence workflow failure 38287517884 (workflow_dispatch) was also selected."
  - "Before this change scheduledRuntime.ts currentMainFailureRunId accepted any failed non-repository_dispatch run on the main head within 24 hours."
scope:
  include:
    - "apps/autopilot/src/repairableWorkflowRun.ts (new predicate)"
    - "apps/autopilot/src/scheduledRuntime.ts (currentMainFailureRunId, hasFreshWorkflowFailureSince, discoverWorkflowFailureOpportunityIds)"
    - "apps/autopilot/src/scheduledEvolutionCoding.ts (evidenceFromRuns)"
    - "apps/autopilot/src/repairableWorkflowRun.test.ts, apps/autopilot/src/scheduledRuntime.failureRouting.test.ts"
  exclude:
    - "Per-failed-run persistent attempt cap and quiet expected stops (redesign section 7 items 2 and 3), Worker token identity (item 4), the owner-activity gate (#2644) and re-enabling Codex coding: separate increments."
limitations:
  - "The webhook path already forwards only CI workflow_run events (autopilot-github-event-bridge.yml), so it is unchanged."
  - "A real CI failure on main is still re-dispatched on the scheduler cadence until the attempt cap increment lands; this change removes the non-code sources of the loop only."
  - "The Worker auto-deploys from main; the effect needs that deploy and is observable on /scheduled/status."
acceptance:
  - "A failed scheduled Autopilot Codex Coding run and a failed workflow_dispatch PAPER evidence run on the main head produce no dispatch and no failure opportunity (test reproduces the 2026-10-12 case and fails without the change)."
  - "CI and Autopilot Sandbox New-File Guard failures on main from push or workflow_dispatch remain repair targets; existing scheduled runtime tests pass unchanged."
  - "PAPER_ONLY; liveAuthority=NONE; productionMutationAllowed=false; aiAuthority=ZERO_AUTHORITY."
verification_commands:
  - "npx tsc -p tsconfig.json"
  - "node -r ./tests/register-dist.cjs --test dist/apps/autopilot/src/*.test.js"
  - "node --test tests/autopilot-*.test.js"
evidence:
  remaining: "Draft PR, non-author review, exact-head CI, deterministic Audit and Release; Worker deploy; then observe /scheduled/status."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: true
