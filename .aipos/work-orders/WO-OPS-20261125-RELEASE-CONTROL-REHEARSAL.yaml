unverified: "The workflow has never run (it can only be dispatched after merge, from main). Not rehearsed: a directory or symlink at the path, odd whitespace inside valid JSON, and the head-clears-itself scenario of case 7 (the PR head copy is not a gate input, so case 7 only shows that a HOLD on the audited base blocks on both reads); case 12 covers the Worker BLOCK direction only. Case 11 (concurrent audits, a stale nusa/release-authorized status) and the audit workflow glue are not rehearsed here; they are read in the workflow and checked in the first real S3b run. The printed lines still have to be recorded in an evidence PR before S3b."
acceptance:
