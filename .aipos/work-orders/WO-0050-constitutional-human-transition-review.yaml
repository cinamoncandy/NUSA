requirements:
  - "Packet verdict is READY_FOR_CONSTITUTIONAL_HUMAN_REVIEW, INCOMPLETE, SAFE_BLOCK, or UNKNOWN."
  - "Bind exact code revision, configuration hash, release candidate ID, deployment bundle ID, rollback bundle ID, and immutable evidence digests."
  - "Require distinct evidence slots for signed production artifact, external read-only broker preflight, actual human activation ceremony, tiny bounded LIVE session, post-LIVE validation, controlled scale-governance review, disaster-recovery/rollback, and audit/evidence chain."
  - "Every evidence slot declares status PASS, FAIL, MISSING, or UNKNOWN plus provenance class SYNTHETIC_CI or EXTERNAL_HUMAN_VERIFIED."
  - "READY requires every slot PASS and EXTERNAL_HUMAN_VERIFIED. A PASS from SYNTHETIC_CI remains INCOMPLETE for constitutional transition."
  - "Any FAIL SAFE_BLOCKs; any UNKNOWN yields UNKNOWN unless a FAIL is also present; any missing or synthetic-only required evidence yields INCOMPLETE."
  - "Packet must list blockers/unknowns/missing/synthetic-only evidence explicitly and produce a deterministic fingerprint."
  - "Packet contains digests/references only; raw credentials, private keys, signatures, account balances, order payloads, or executable authorization tokens are prohibited."
  - "Output constitutionalDecisionAuthority=false, deploymentAuthority=false, activationAuthority=false, scaleUpAuthority=false, orderAuthorization=false, executionAuthority=false, authorizesLive=false, mutationPerformed=false."
  - "CI must prove the current real-world transition remains INCOMPLETE and must never fabricate persisted actual external/human evidence."
  - "Include a concise ordered human transition runbook identifying the external actions that remain outside automated authority."
acceptance:
  - "Constitutional transition review packet regressions PASS."
  - "Synthetic-CI PASS evidence in every slot still yields INCOMPLETE."
  - "Structurally complete externally/human-verified fixture yields READY_FOR_CONSTITUTIONAL_HUMAN_REVIEW but all authority fields remain false."
  - "FAIL/UNKNOWN/MISSING precedence is deterministic and fail-closed."
  - "Identical normalized evidence yields identical packet fingerprint."
  - "Source guard proves no deployment/activation/order/scale/credential/broker mutation method exists."
  - "Existing Restricted LIVE safety gates and Full CI PASS on exact PR head."
safety:
  actual_external_broker_validation: not_performed_by_ci
  actual_human_ceremony: not_performed_by_ci
  actual_tiny_live_session: not_performed_by_ci
  actual_scale_change: prohibited
  live_trading_mutation: prohibited
  credential_execution_use: prohibited
  constitutional_decision_authority: human_only
  automatic_production_transition: prohibited
  real_money_execution: prohibited
completion_rule: "Merge + required exact-head test/CI PASS. Completion closes the automated safe preparation layer only; all real-world external/human/LIVE actions and the constitutional production decision remain outside automated authority."
