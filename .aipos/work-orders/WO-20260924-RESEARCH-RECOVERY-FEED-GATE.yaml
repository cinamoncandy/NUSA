  local_validation: "research-runtime-boundary-regression 5/5 PASS; combined runtime/research/paper-period/e2e suites 31/31 PASS; pnpm run validate PASS; secret scan 0 failures."
  external_validation: "REQUIRED: exact-head CI, Audit, Release."
