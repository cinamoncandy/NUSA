objective: "Docs only. Direction 3 (execution and cost): no new study, because the only cost study that is possible would read order-book values that must not be read before 2026-12-10; the cost table already exists. Direction 2 (different data): the unseen-data audit shows every historical daily and 60-minute series was already read, so the only blind data is data after 2026-12-05; it merges into Direction 1. Direction 1: a PROPOSED pre-registration (not registered): weekly cross-sectional 28-day trend, five picks, seven-day hold, first decision 2026-12-07, 26 weekly cohorts, one test at alpha 0.05 with a sign-flip permutation, down-week clause, stress costs, power disclosed (about 1.4 to 2.7 percent a week needed), run on a hosted runner after 2027-06-07T01:00Z. The owner confirmed the three numbers (\"해\", 2026-11-25); it registers when the file is merged before 2026-12-07T00:00Z. Independent read-only review fixes applied: 20 bp universe bar (the 10 bp bar left 29 markets), minimum 30 markets, signal uses close(D-1) and close(D-29) (no look-ahead), gap rules with a 5 percent cap (no -100 percent valuation), leave-one-out clause and autocorrelation print, honest power (about 50 percent at 0.335 sd), earliest run 2027-06-07T03:00Z (to be confirmed by the owner), no family-wise control stated."
