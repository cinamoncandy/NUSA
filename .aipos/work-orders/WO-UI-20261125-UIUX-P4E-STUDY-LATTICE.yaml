objective: "Above the registered-study list (StudyTimeline) draw a fixed-pose lattice sphere with one numbered marker per study; the next verdict's marker is ringed in ice-blue. The list rows get the same numbers. Marker choice is pure and deterministic (studyMarkers in latticeSphereModel.ts: front-facing nodes, farthest-point spread, numbered clockwise from the top). The sphere has no loop, no motion, no data of its own and no text beyond the numbers: dates and states stay in the list. Works on any study list the existing code builds (the built-in one today, the server one after the study-schedule PR)."
change:
