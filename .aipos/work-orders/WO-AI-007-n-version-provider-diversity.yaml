scope: PAPER_RESEARCH_ONLY
objective: >-
  Convert the current correlated single-provider/model multi-agent runtime into a bounded N-version
  evidence system that can distinguish valid independent consensus from disagreement, incomplete runs,
  fake independence, and unverified comparison state without adding execution, promotion, risk,
  production-mutation, or LIVE authority.
selection_rationale:
  - WO-AI-006 is verified complete and resource governance is now a strong prerequisite for bounded fan-out.
  - Pre-AI-007 environment composition supported only one provider/model failure group at a time.
  - Genuine independent provider/model evidence enables measurable disagreement, abstention, and robustness evaluation.
  - The same independence signal is a prerequisite for later scenario, explanation-faithfulness, and learning work.
constraints:
  - No AI output, consensus score, provider vote, Meta-AI result, or automation may authorize PAPER mutation, strategy promotion, risk increase, production mutation, or LIVE execution.
  - At least two independently validated provider/model groups are required before claiming cross-provider consensus.
  - Same provider/model lineage cannot be counted as independent through aliases, duplicate credentials, duplicate endpoints, role labels, or repeated configuration.
  - All comparable groups must use the same canonical evidence snapshot, role contract, prompt/schema identity, decision horizon, and outcome semantics.
  - All attempts consume the shared WO-AI-006 resource budget; fan-out and retries cannot escape call, attempt, byte, token, or wall-clock ceilings.
  - Partial failure, timeout, refusal, malformed output, resource exhaustion, schema drift, or missing lineage remains explicit and cannot be silently substituted.
  - Disagreement may reduce trusted confidence, force abstention, or mark analysis incomplete; it cannot be hidden by cherry-picking a preferred provider.
  - Provider credentials remain process-memory inputs only and never enter evidence, replay identity, logs, dashboard output, repository content, or persisted comparison state.
  - Hidden chain-of-thought is neither requested nor persisted.
  - Provider-specific adapters stay outside core contracts and remain explicitly opt-in.
  - WO-0051 remains HUMAN_ENVIRONMENT_ONLY and cannot be satisfied or bypassed by this work.
implementation:
  - define immutable AiProviderPoolPolicy and canonical provider-group/model lineage identity
  - define independence validator that rejects duplicate or correlated group identities from counting as independent evidence
  - add an explicitly opt-in Anthropic Messages adapter behind the provider-neutral ModelProvider boundary while preserving OpenAI primary/calibration behavior
  - compose bounded OpenAI plus Anthropic N-version provider groups only when both independent configurations are complete
  - execute comparable STRATEGY_PROPOSER runs against the same evidence/prompt/schema snapshot under one shared WO-AI-006 resource ledger
  - retain provider/model/prompt/schema/input/resource-policy lineage per result without secret material
  - compute deterministic structured disagreement across decision fields, raw probability, uncertainty, assumptions, and evidence references
  - expose CONSENSUS DISAGREEMENT INSUFFICIENT_INDEPENDENCE INCOMPLETE UNVERIFIED comparison states
  - make disagreement and incomplete independence force read-only abstention and zero trusted confidence without mutating strategy/risk/execution state
  - preserve consensus as evidence-only NO_UPLIFT rather than manufacturing confidence
  - isolate provider failures so one provider cannot be silently replaced or duplicated as consensus evidence
  - bind provider-pool policy and comparison identity into deterministic replay/idempotency semantics
  - expose read-only provider-group completeness independence disagreement resource health and trust-impact evidence
  - make provider API keys non-enumerable ECMAScript private fields and keep them out of replay/evidence/projection/serialization
  - add independent-evaluator and adversarial regressions for fake independence duplicated lineage partial failures identity mismatch contradictory outputs replay conflict resource exhaustion and capability-shaped output escalation
acceptance_criteria:
  - single-provider or same-lineage repeated runs can never emit cross-provider CONSENSUS
  - at least two valid independent provider/model groups are required for consensus eligibility
  - comparable runs prove identical canonical evidence prompt schema and model-input identities
  - intentionally contradictory fixtures deterministically emit DISAGREEMENT and abstention
  - valid independent agreement fixtures emit CONSENSUS with NO_UPLIFT and no mutation authority
  - partial provider failure remains INCOMPLETE rather than fabricated consensus
  - missing or conflicting lineage produces INSUFFICIENT_INDEPENDENCE or UNVERIFIED and fails closed
  - provider/model aliases or repeated provider configuration cannot inflate independence count
  - fan-out and retry consumption stay within WO-AI-006 call attempt input-byte output-token and wall-clock ceilings
  - provider timeout malformed output resource exhaustion and usage-accounting failure remain observable per group
  - comparison evidence contains no API key credential authorization header raw secret or hidden reasoning
  - replay is idempotent for exact duplicates and fails closed on policy lineage prompt schema input or result conflicts
  - grounding provenance calibration durability and resource-governance regressions remain PASS
  - adversarial before-after evaluation improves independent-conflict observability from 0/5 baseline to 5/5 deterministic disagreement/abstention detections without claiming market predictive-accuracy improvement
  - liveAuthority=NONE productionMutationAllowed=false realOrderAuthority=false realTransferAuthority=false remain proven
  - exact-head typecheck build lint focused/full tests coverage architecture/AIPOS security E2E and all Restricted LIVE/read-only workflows pass
  - implementation PR is merged only after all required checks pass
