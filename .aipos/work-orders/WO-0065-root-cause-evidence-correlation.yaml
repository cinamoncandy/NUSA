id: WO-0065
title: Deterministic Root-Cause Evidence Correlation
status: completed
branch: agent/wo-0065-root-cause-evidence-correlation
base_sha: 40d6ce10df574764330bd60427ffa6d89165efdd
objective: >-
  Extend the WO-0063/WO-0064 read-only improvement pipeline with deterministic, bounded root-cause evidence correlation so recurrent improvement candidates can be associated with relevant runtime and historical evidence without granting AI, remediation, deployment, broker, risk, or LIVE authority.
scope:
  - reuse WO-0063 improvement candidate/fingerprint contracts
  - reuse WO-0064 persistent diagnostic recurrence memory
  - audit and reuse existing repository evidence/audit abstractions where appropriate
  - deterministically correlate candidate recurrence with relevant diagnostic evidence
  - produce a read-only RootCauseEvidenceBundle or repository-conventional equivalent
  - retain explicit provenance, timestamps, correlation reasons, and confidence derived only from observable deterministic inputs
  - bound evidence fan-out, retention, and lookup cost
  - fail closed on malformed, missing, contradictory, or unverifiable evidence
non_goals:
  - LLM root-cause analysis
  - autonomous remediation
  - code generation or self-modification
  - automatic PR creation or merge
  - deployment mutation
  - strategy generation or promotion
  - broker/order mutation
  - LIVE or real-money authority
  - Risk Authority changes
constraints:
  - repository architecture, AGENTS.md, AIPOS contracts, and existing safety boundaries remain authoritative
  - no parallel runtime, EventBus, storage framework, evidence framework, or service container
  - correlation must be deterministic and reproducible for identical inputs
  - no fabricated confidence or inferred evidence unsupported by repository/runtime facts
  - correlation output is read-only advisory evidence only
  - bounded memory/storage/query behavior is mandatory
  - no protected-area changes
  - liveAuthority remains NONE
  - productionMutationAllowed remains false
  - AI authority remains ZERO_AUTHORITY
acceptance_criteria:
  - recurrent candidate can retrieve and correlate relevant prior diagnostic evidence by stable identity
  - correlation output has deterministic ordering and stable identity
  - evidence provenance and correlation reason are explicit
  - duplicate evidence is idempotent/deduplicated
  - contradictory or malformed evidence fails safely and is represented without unsafe inference
  - fan-out/retention/query work is explicitly bounded and tested
  - restart/recovery behavior remains compatible with WO-0064 persistence
  - WO-0063 observer behavior remains compatible
  - no remediation/execution/deployment authority introduced
  - focused tests pass
  - full repository regression passes when required by repository policy
  - typecheck, build, lint, architecture, truth, safety, AI zero-authority, AIPOS conformance/drift and diff checks pass
  - protected areas unchanged
verification:
  - pnpm run preflight
  - pnpm run typecheck
  - pnpm run build
  - pnpm run lint
  - pnpm run architecture:check
  - pnpm run ai:architecture
  - pnpm run safety:architecture
  - pnpm run safety:invariants
  - relevant focused tests
  - full repository test suite when required by repository policy
  - git diff --check
next_on_pass: human review and normal PR process
