id: WO-OPS-20261115-R2A-NO-ROLLBACK-TO-UNPROVEN
title: "R2a: a failed activation restores only a PROVEN, data-compatible previous release; otherwise the host ends STOPPED"
status: READY_FOR_REVIEW
created: 2026-11-15
implementation_branch: claude/r2-release-safety
owner_decision: "2026-11-15: redesign v4 phase R2 (release safety before any deploy); docs/NUSA_REDESIGN_PROPOSAL_2026-11-15.md section 5 and 7a."
objective: "Remove the automatic rollback to an unproven build (the 2026-11-15 failure restored a defective build) and the keep-the-failed-build-running branch. A release becomes proven only after a full activation (readiness and soak)."
change:
  - "deploy/oracle/nusa-release-step.sh: the proof of a proven release is a root-owned file /opt/nusa/proven/<full sha> (content = the sha) in a root-owned 0755 directory OUTSIDE the release tree (the releases are owned by the service user), created atomically (mktemp + mv) and written only after readiness, soak and both final active checks; /opt/nusa itself must be root-owned and not group/other writable or the proof is refused. safe_stop_after_failed_activation disables and stops nusa.service, the autopilot, the research timer and the research service, verifies each unit is no longer active, reports STOP NOT CONFIRMED loudly if not, and always fails the step. activate restores the previous release only when it is proven and schema compatible; every failing step (restore, readiness of the restored release, the final active checks) ends in the safe stop. rollback_and_restore now returns explicitly at each step because it runs inside a condition, where set -e does not apply. A failing atomic-deploy: if the release pointer and the previous-release record are exactly as before, the step fails and nothing is touched; if either changed, the host ends STOPPED. Every step that can call die during activation (start-up chain, soak, lease recovery, restore) runs in a subshell so a die is a failed condition that ends in the safe stop. The safe stop also verifies is-enabled (boot and timer start) and distinguishes inactive from a failed check."
  - "tests/oracle-release-o1-mechanics.test.js and tests/oracle-release-rollback-schema-guard.test.js: structural pins plus real runs of the three helpers against a temp layout and a stub systemctl."
not_changed:
  - "No host change by this work order. The helper is root-owned on the host and the release workflow requires a byte-identical copy: after merge a release attempt is refused until the owner installs the reviewed helper (this belongs to R3, with the access audit). No limit, threshold, capital or authority change."
  - "The currently running build 97109e88 is NOT marked proven (it was switched manually), so the first release after the install ends STOPPED if it fails, by design."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "bash -n on the helper; tests/oracle-release-activate-flow.test.js (new) runs the REAL activate verb body end to end with stubbed host commands: success records the proof last; readiness, soak, autopilot, a die in the start chain, a failing final active check, a partial and a clean atomic-deploy failure, a proven previous release restored or not, a not-schema-compatible one, and units that do not stop or stay enabled (NOT CONFIRMED). Mutation checks (removing the subshell, removing the disable) fail 1 and 8 of those tests. All tests/oracle-*.test.js pass locally."
  - "The release workflow already has steps that refuse to run unless the host helper is byte-identical to the reviewed one (oracle-paper-release.yml: Require reviewed root-owned helper exact match, before backup and before host mutation); not run here."
unverified: "Second Codex review (REJECT) findings (atomic-deploy partial failure, die inside restore, boot-start verification, activate-level fault injection) are addressed above. R2e must finish before any automatic restore is relied on in production. First Codex review (REJECT) findings P0-1, P0-2, P1-1, P1-2 are addressed above. P1-3 (data-copy compatibility rehearsal of the previous build: ledger reads, recovery, required writes) is NOT part of this PR; it is the separate R2e pull request and until then only the migration-id check guards a restore. No full activate run exists (it needs the host); the new pieces are pinned structurally and exercised individually. Not run on the host (no rehearsal yet); the activate path is pinned structurally and its new helper functions are run against a stub. The independent review is pending. Phase-aware readiness, restart limits in the unit, and the backup split are separate R2 pull requests."
acceptance:
  - "CI green; non-author review before the PR leaves draft."
