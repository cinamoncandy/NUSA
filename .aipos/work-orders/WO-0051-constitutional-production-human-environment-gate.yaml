requirements:
  - "Obtain an exact production artifact with independently verified signing evidence bound to the sealed release candidate."
  - "Configure operator-controlled read-only broker credentials with no execution/withdraw permissions and run the external read-only preflight only after explicit operator authorization."
  - "Conduct the real activation ceremony with the required distinct human requester and two distinct human approvers bound to exact code/config/scope/rollback evidence."
  - "Any actual tiny Restricted LIVE session requires a separate explicit constitutional human decision and remains bounded by the approved tiny envelope."
  - "After any separately authorized tiny session, require closed execution transport plus clean order/fill/position/cash reconciliation, hard-risk, HALT, audit, and post-trade evidence."
  - "Any risk increase requires a new exact proposal plus separate two-human scale-governance approval."
  - "Assemble only EXTERNAL_HUMAN_VERIFIED evidence into the constitutional transition packet; SYNTHETIC_CI evidence cannot satisfy the gate."
  - "The final production/LIVE decision remains human-only even when the packet becomes READY_FOR_CONSTITUTIONAL_HUMAN_REVIEW."
  - "Never store raw credentials, private keys, bearer tokens, raw signatures, account balances, executable authorization tokens, or full order payloads in AIPOS evidence."
acceptance:
  - "Signed production artifact evidence is genuine and independently verified."
  - "Actual external read-only preflight receipt exists and is bound to exact code/config/release/envelope identity."
  - "Actual human ceremony evidence exists with required independent human approvals."
  - "If a separately authorized tiny LIVE session occurs, its post-LIVE evidence validates cleanly before any progression."
  - "Any scale change has its own exact two-human governance evidence."
  - "Constitutional transition packet uses EXTERNAL_HUMAN_VERIFIED provenance for every required slot and becomes eligible for human review."
  - "A separate constitutional human decision explicitly authorizes any production/LIVE transition; automation never infers it."
safety:
