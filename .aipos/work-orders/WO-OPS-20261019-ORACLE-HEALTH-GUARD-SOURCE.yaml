id: WO-OPS-20261019-ORACLE-HEALTH-GUARD-SOURCE
title: "Canonicalize the deployed Oracle PAPER health guard without adding a second watchdog"
status: IN_PROGRESS
owner: nusa-server-automation
repository: cinamoncandy/NUSA
issue: 1949
base_branch: main
base_commit: 05af71c0eed3ff11aa0fd0efb4e485f4ce7bc936
implementation_branch: ops/health-guard-source-1949
authority_impact: none
objective: "Put the already-deployed bounded Oracle health watchdog and its systemd ownership contract under repository review so host recovery behavior cannot drift outside source control."
finding: "A natural PUBLIC_MARKET_FAILED incident left the PAPER process HTTP-healthy while its market workload was stale after bounded WebSocket reconnect exhaustion. The existing host-only health guard checked HTTP process health and did not detect the stale workload. The deployed repair recovered PAPER with one bounded restart and remained a no-op under healthy workload, but the executable and unit/timer were not tracked in the repository."
scope:
  - "Track and harden the deployed /usr/local/sbin/nusa-health-guard behavior as deploy/oracle/nusa-health-guard."
  - "Close the release-activation/watchdog-restart check-then-act race with one shared root-owned flock at /run/lock/nusa-paper-activation.lock."
  - "Track the existing nusa-health-guard.service and nusa-health-guard.timer ownership contract."
  - "Add structural regression coverage for workload-aware PUBLIC_MARKET_FAILED recovery, cooldown/deduplication, release suppression, upstream reachability and fail-closed behavior."
  - "Document explicit reviewed-source installation and healthy no-op acceptance."
exclusions:
  - "Acquire the shared lock in every canonical helper verb that can move the active release, install active units, or restart PAPER; do not implicitly install a new privileged helper from ordinary releases."
  - "Do not add another timer, scheduler, watchdog or control plane."
  - "Do not edit the database, writer lease, release symlink, runtime environment, Risk, Governance, qualification, OOS, cost or sample thresholds."
  - "Do not enable LIVE/REAL authority or broker mutation."
architecture_impact:
  acknowledged: true
  analysis: "The change source-controls the single existing watchdog and serializes only release activation versus watchdog recovery using one shared kernel flock. It adds no scheduler, watchdog, control plane, or host installation action. The narrow nusa-release-step activate change is necessary because the prior pgrep check was non-atomic."
  references:
    - deploy/oracle/nusa-health-guard
    - deploy/oracle/nusa-health-guard.service
    - deploy/oracle/nusa-health-guard.timer
    - deploy/oracle/nusa-release-step.sh
    - docs/operations/oracle-health-guard.md
acceptance:
  - "POSIX shell syntax passes."
  - "Recovery is eligible only for workload STALE + PUBLIC_MARKET_FAILED with a valid last market timestamp and reachable Upbit public REST."
  - "The same outage cannot trigger a repeat restart and a 15-minute cooldown bounds different failures."
  - "All canonical release mutations and watchdog PAPER recovery serialize on the same stable root-owned flock; a busy lock makes the watchdog a no-op before marker mutation or PAPER restart."
  - "The watchdog rechecks workload failure identity, marker dedupe, and cooldown after acquiring the lock; lock ownership releases automatically after process failure/exit."
  - "Healthy workload execution is a no-op and preserves the PAPER PID."
  - "Unreachable PAPER endpoint remains fail-closed with no blind restart."
  - "Installed host executable can be compared byte-for-byte with reviewed source."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: true
rollback: "Revert this source-control commit. The existing host watchdog is not changed by the PR itself; any host installation remains an explicit reviewed infrastructure operation."
verification_commands:
  - node --test tests/oracle-health-guard.test.js
  - sh -n deploy/oracle/nusa-health-guard
  - bash -n deploy/oracle/nusa-release-step.sh
  - git diff --check
  - pnpm run validate:full
  - pnpm run security:gate
validation: "Shared-lock implementation is on 16b5cad74879b5f1430889818e0e59b88160c659; paired-install docs/test correction is on f106b8d56726b8348bf2e4c2a85dfb05173d36fb. Latest local health guard/release focused suites: 5 PASS / 4 Linux-only SKIP; release helper compatibility suites: 24 PASS / 2 Linux DB SKIP; shell syntax, validate:full, security:gate, AIPOS YAML, and diff check PASS. Six workflows on f106 were in_progress/queued; this state-only synchronization triggers the final exact-head workflow set. Linux CI must execute the flock contention/owner-exit tests. No host mutation is authorized."
next: "Wait for all six exact-head workflows after the state-only sync; do not make further source/state commits unless a real failure requires repair. Then require fresh non-author Validator and canonical Audit/Release. Do not install, self-approve, or merge."
