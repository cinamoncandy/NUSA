root_cause:
  transition: writable DatabaseSync.prototype.prepare -> fabricated PRAGMA quick_check result -> shared-store trust registration
  evidence: On predecessor 53f834eeaedc8e73848814a8a5407463a970747a, pre-load DatabaseSync.prototype.prepare replacement forged quick_check=ok and admitted unchecked storage (forged prepare=1, real full check=0, scoped=4). Fresh review of 10500dd also found StatementSync.prototype.get replacement could forge a real statement result. This second exploit reproduced on 6af8f71db6917afd9dbd044487d5f2a186eb25cd against a corrupt database (forged get=1, native result read=0, scoped=4).
  classification: mutable native method and result slots were trusted without proving their canonical origin at module initialization and result read
repair:
  - Canonical SqliteDatabase full-scan registration and both existing AI-store admission checks now share the index.ts lexical scope. The WeakMap and resolver are not exported, there is no imported registration/verifier capability, and sqliteVerifiedSharedConnection.ts is deleted. Existing AI-store paths re-export the same genuine constructors; their implementations were relocated without changing their schemas, scoped checks, hash-chain replay, ownership, or standalone full scans. Startup ordering remains unchanged.
  - Keep canonical quick_check before Cloud AI initialization, Research prepareRecovery and writer-lease acquisition.
  - Capture pristine Function.prototype.toString and Reflect.apply from a fresh node:vm realm. Require captured node:sqlite DatabaseSync.prepare and StatementSync.get to match their exact native function sources; use the captured native get for every integrity result. Pre-load Reflect.apply poisoning is bypassed by the fresh-realm intrinsic; noncanonical or proxied prepare/get replacements fail closed. Add child-process regressions for pre-load JavaScript/Proxy replacement of both methods and Reflect.apply, and post-load forged get returning ok for a corrupt database. Retain post-load prepare poisoning, CommonJS module-cache replacement, corrupt-file full-scan, and startup-ordering regressions.
  - Preserve Storybook 8.6.19 security patch; no security gate waiver.
