  - genuine SQLite connections still complete canonical full-file quick_check and may issue proof
  - same-database identity binding and per-store checks remain enforced
  - forged issuer regression test fails before fix and passes after fix
  - focused startup and writer-lease regressions pass
  - every recorded validation names the exact SHA it was run against, and no record is reused for a later head
  - exact-head CI and fresh non-author validation pass before Audit/Release
