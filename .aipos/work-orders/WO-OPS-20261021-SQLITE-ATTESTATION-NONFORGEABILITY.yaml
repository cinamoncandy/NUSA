objective: 'Close #2770''s pre-listener startup failure while keeping the canonical full-file integrity scan and shared SQLite connection fail-closed.'
root_cause:
  transition: untrusted NODE_OPTIONS preload or unbounded spawned Research heap -> compromised integrity bootstrap or resource exhaustion -> missing fail-closed Research evidence; candidate unit installation also requires the compiled bootstrap artifact to exist
  evidence: Fresh review of exact head 9d9515a found the Research EnvironmentFile preload boundary; bcc9c62 fixed parent startup by scrubbing NODE_OPTIONS and moving the heap cap to Node CLI. Review of exact head 3eb81c1 then found spawned Research jobs did not inherit a parent CLI heap limit. This follow-up applies the 256 MiB CLI limit to each sequential child. The AIPOS review also caught that the 3eb81c work order still called its already-committed sync pending; this follow-up corrects the state/handoff.
  classification: "Fresh non-author review on exact head 4f44517c704786b9c7334a722f83194614bcc3ca found two current P1s: native Module._resolveFilename still calls writable Module._findPath, which can redirect only ./sqliteIntegrityBootstrap to a forged cache entry; and the durable recovery records still called the already-committed resolver repair local/pending. The repair removes production reacquisition of the boundary through relative CommonJS resolution rather than continuing to pin resolver internals one helper at a time."
repair:
  - Canonical SqliteDatabase full-scan registration and both existing AI-store admission checks now share the index.ts lexical scope. The WeakMap and resolver are not exported, there is no imported registration/verifier capability, and sqliteVerifiedSharedConnection.ts is deleted. Existing AI-store paths re-export the same genuine constructors; their implementations were relocated without changing their schemas, scoped checks, hash-chain replay, ownership, or standalone full scans. Startup ordering remains unchanged.
  - Keep canonical quick_check before Cloud AI initialization, Research prepareRecovery and writer-lease acquisition.
  - Move clean-realm/native-method capture into a dedicated SQLite integrity bootstrap and preload it before application code in the supervised PAPER runtime and canonical Oracle Research systemd unit. The supervised database-owning child strips inherited NODE_OPTIONS so arbitrary preloads cannot run before the boundary. Capture clean-realm Reflect.apply, Function.prototype.toString and Object.values; use only those captures for native method checks, integrity reads and result interpretation. Make bootstrap exports/cache binding immutable after initialization. Standalone developer execution is explicit via cloud:runtime:bare preload. Full-file scans, scoped AI-store checks, hash-chain replay and startup ordering remain unchanged.
  - Strip NODE_OPTIONS at both Oracle systemd parent boundaries with `/usr/bin/env -u NODE_OPTIONS` before launching Node; pass Research's bounded 256 MiB heap via the Node command line, not Environment=NODE_OPTIONS. Make Oracle validation fail closed if either unit stops scrubbing NODE_OPTIONS or the Research heap bound is lost.
  - Add corrupt-database child-process regressions proving late VM/SQLite prototype replacement and late Object.values replacement cannot forge an integrity pass. Add launcher and Oracle-unit contract checks for parent and child NODE_OPTIONS scrubbing and preload ordering. Retain all prior poisoning, cache replacement, full-scan and recovery-order regressions.
  - Pass the explicit 256 MiB max-old-space limit to each sequential Node child launched by the Research snapshot runner; regression asserts every spawned command carries the bound.
  - Pin the native CommonJS Module._load property in the production preload so application code cannot replace the loader and substitute a forged SQLite integrity bootstrap; a corrupt-file child-process regression verifies replacement attempts fail closed.
  - Pin the captured CommonJS Module._resolveFilename property in the production preload so application code cannot redirect the later integrity-bootstrap import to an attacker-added entry in the extensible module cache; a corrupt-file child-process regression verifies replacement attempts fail closed.
  - Publish the frozen sqliteIntegrityBoundary on a non-writable/non-configurable property of Node's canonical Module constructor and make production storage consume that slot directly. After the trusted preload, storage no longer resolves ./sqliteIntegrityBootstrap, so mutable resolver helpers including Module._findPath and Module._resolveLookupPaths cannot substitute the capability. Direct developer/test imports use the bootstrap fallback only when the slot is absent.
  - Preserve Storybook 8.6.19 security patch; no security gate waiver.
  - The documented legacy Cloud PAPER systemd parent removes NODE_OPTIONS before Node starts and preloads sqliteIntegrityBootstrap; its supervisor strips NODE_OPTIONS from the database-owning child and preloads the same trusted boundary before runtime code.
  - Candidate Oracle preflight now fails closed unless the staged release contains `dist/packages/storage/src/sqliteIntegrityBootstrap.js`, before systemd units that reference it can be installed.
prohibited:
  - bypassing_or_weakening_canonical_full_file_quick_check
  - weakening_store_scoped_checks_or_hash_chain_replay
  - changing_startup_readiness_budget_or_writer_lease_semantics
  - direct_database_mutation_or_historical_rewrite
  - live_or_real_authority_expansion
acceptance:
  - production startup prepares exactly one full-file quick_check plus four AI store-scoped quick_check statements
  - production composition passes its canonical SqliteDatabase, whose exact connection is registered only after full-file quick_check
  - raw, forged, and replaced shared-connection inputs cannot skip the canonical full-file quick_check
  - atomic rename/replacement of the original pathname cannot redirect a shared AI store
  - closing a shared AI store does not close the canonical connection
  - standalone AI stores still perform one full-file quick_check each
  - canonical full-file quick_check remains before Cloud AI and before PAPER writer-lease acquisition
  - Cloud AI schema initialization completes before Research recovery evidence preparation
  - Research recovery preparation remains before PAPER writer-lease acquisition and does not disturb an existing competing owner
  - fresh exact-head CI and five required companions pass
  - fresh non-author review has zero unresolved current P0/P1 findings
  - separate structured NUSA Validator records exact head, P0/P1/P2 counts, and explicit ACCEPTED before Audit
  - pre-bootstrap replacement of the former internal verifier cache cannot admit raw, forged or replaced connections into either genuine store
  - replacing Module._cache or Module._load after the production preload cannot substitute a forged SQLite integrity boundary
  - replacing Module.prototype.require after the production preload cannot substitute a forged SQLite integrity boundary
  - replacing Module._resolveFilename after the production preload cannot route the integrity-bootstrap import to a forged module-cache entry
  - replacing Module._findPath after the production preload cannot redirect the SQLite integrity boundary because the production storage consumer reads the immutable preload capability slot and performs no relative bootstrap resolution
  - adding Module.__esModule=true and an attacker-controlled Module.default after preload cannot redirect the capability read; the storage consumer must use the raw CommonJS node:module export without __importDefault interop
  - replacing node:sqlite.DatabaseSync after the trusted preload cannot redirect a canonical or standalone storage open to another database; all opens use the captured native constructor through the immutable integrity boundary, and a corrupt requested-file child-process regression fails closed
  - the Module._load repair and corrupt-file adversarial regression pass locally (40 focused tests, build, validate:full, AIPOS provenance, and security:gate)
  - pre-load and post-load replacement of DatabaseSync.prepare or StatementSync.get cannot mint full-file trust or forge its result; JavaScript and Proxy replacements fail closed, and corrupted files remain rejected
  - production PAPER and Research entrypoints load the integrity bootstrap before application code
  - documented legacy Cloud PAPER systemd parent and supervised database-owning child both scrub NODE_OPTIONS and load the trusted integrity bootstrap before application code
  - Oracle PAPER systemd removes NODE_OPTIONS before the supervisor process starts, and child execution cannot prepend a preload before the integrity bootstrap
  - Oracle Research systemd removes NODE_OPTIONS before Node starts while preserving the 256 MiB heap limit on the command line
  - Each spawned Research Node study/probe process independently receives the 256 MiB heap limit; the parent-only setting is not treated as inherited proof
  - replacing node:vm.runInNewContext or Object.values after bootstrap cannot bypass full-file integrity rejection
  - candidate Oracle preflight rejects a missing compiled SQLite bootstrap and accepts the exact candidate artifact before any unit installation
