root_cause:
  transition: untrusted NODE_OPTIONS preload or unbounded spawned Research heap -> compromised integrity bootstrap or resource exhaustion -> missing fail-closed Research evidence
  evidence: Fresh review of exact head 9d9515a found the Research EnvironmentFile preload boundary; bcc9c62 fixed parent startup by scrubbing NODE_OPTIONS and moving the heap cap to Node CLI. Review of exact head 3eb81c1 then found spawned Research jobs did not inherit a parent CLI heap limit. This follow-up applies the 256 MiB CLI limit to each sequential child. The AIPOS review also caught that the 3eb81c work order still called its already-committed sync pending; this follow-up corrects the state/handoff.
  classification: per-process heap limit was not propagated to spawned Research Node jobs; completed AIPOS sync was mislabeled pending
repair:
  - Canonical SqliteDatabase full-scan registration and both existing AI-store admission checks now share the index.ts lexical scope. The WeakMap and resolver are not exported, there is no imported registration/verifier capability, and sqliteVerifiedSharedConnection.ts is deleted. Existing AI-store paths re-export the same genuine constructors; their implementations were relocated without changing their schemas, scoped checks, hash-chain replay, ownership, or standalone full scans. Startup ordering remains unchanged.
  - Keep canonical quick_check before Cloud AI initialization, Research prepareRecovery and writer-lease acquisition.
  - Move clean-realm/native-method capture into a dedicated SQLite integrity bootstrap and preload it before application code in the supervised PAPER runtime and canonical Oracle Research systemd unit. The supervised database-owning child strips inherited NODE_OPTIONS so arbitrary preloads cannot run before the boundary. Capture clean-realm Reflect.apply, Function.prototype.toString and Object.values; use only those captures for native method checks, integrity reads and result interpretation. Make bootstrap exports/cache binding immutable after initialization. Standalone developer execution is explicit via cloud:runtime:bare preload. Full-file scans, scoped AI-store checks, hash-chain replay and startup ordering remain unchanged.
  - Strip NODE_OPTIONS at both Oracle systemd parent boundaries with `/usr/bin/env -u NODE_OPTIONS` before launching Node; pass Research's bounded 256 MiB heap via the Node command line, not Environment=NODE_OPTIONS. Make Oracle validation fail closed if either unit stops scrubbing NODE_OPTIONS or the Research heap bound is lost.
  - Add corrupt-database child-process regressions proving late VM/SQLite prototype replacement and late Object.values replacement cannot forge an integrity pass. Add launcher and Oracle-unit contract checks for parent and child NODE_OPTIONS scrubbing and preload ordering. Retain all prior poisoning, cache replacement, full-scan and recovery-order regressions.
  - Pass the explicit 256 MiB max-old-space limit to each sequential Node child launched by the Research snapshot runner; regression asserts every spawned command carries the bound.
  - Preserve Storybook 8.6.19 security patch; no security gate waiver.
