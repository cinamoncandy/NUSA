objective: 'Close #2770''s pre-listener startup failure while keeping the canonical full-file integrity scan and shared SQLite connection fail-closed.'
root_cause:
  transition: untrusted node:vm.runInNewContext or mutable Object.values replacement -> forged SQLite integrity boundary/result -> shared-store trust registration
  evidence: Earlier adversarial reviews reproduced pre-load DatabaseSync.prototype.prepare and post-load StatementSync.get forgery. Fresh exact-head review of e70e8e25 found replacing node:vm.runInNewContext before storage import admitted corrupt storage without genuine scans, and replacing Object.values after module load accepted a corrupt full-check result. Both reproduced locally against corrupt SQLite files.
  classification: mutable runtime globals could replace the clean-realm factory before capture or forge interpretation of a real integrity result
repair:
  - Canonical SqliteDatabase full-scan registration and both existing AI-store admission checks now share the index.ts lexical scope. The WeakMap and resolver are not exported, there is no imported registration/verifier capability, and sqliteVerifiedSharedConnection.ts is deleted. Existing AI-store paths re-export the same genuine constructors; their implementations were relocated without changing their schemas, scoped checks, hash-chain replay, ownership, or standalone full scans. Startup ordering remains unchanged.
  - Keep canonical quick_check before Cloud AI initialization, Research prepareRecovery and writer-lease acquisition.
  - Move clean-realm/native-method capture into a dedicated SQLite integrity bootstrap and preload it before application code in the supervised PAPER runtime and canonical Oracle Research systemd unit. The supervised database-owning child strips inherited NODE_OPTIONS so arbitrary preloads cannot run before the boundary. Capture clean-realm Reflect.apply, Function.prototype.toString and Object.values; use only those captures for native method checks, integrity reads and result interpretation. Make bootstrap exports/cache binding immutable after initialization. Standalone developer execution is explicit via cloud:runtime:bare preload. Full-file scans, scoped AI-store checks, hash-chain replay and startup ordering remain unchanged.
  - Add corrupt-database child-process regressions proving late VM/SQLite prototype replacement and late Object.values replacement cannot forge an integrity pass. Add launcher and Oracle-unit contract checks for the preload and for stripping inherited NODE_OPTIONS from the database-owning child. Retain all prior poisoning, cache replacement, full-scan and recovery-order regressions.
  - Preserve Storybook 8.6.19 security patch; no security gate waiver.
prohibited:
  - bypassing_or_weakening_canonical_full_file_quick_check
  - weakening_store_scoped_checks_or_hash_chain_replay
  - changing_startup_readiness_budget_or_writer_lease_semantics
  - direct_database_mutation_or_historical_rewrite
  - live_or_real_authority_expansion
acceptance:
  - production startup prepares exactly one full-file quick_check plus four AI store-scoped quick_check statements
  - production composition passes its canonical SqliteDatabase, whose exact connection is registered only after full-file quick_check
  - raw, forged, and replaced shared-connection inputs cannot skip the canonical full-file quick_check
  - atomic rename/replacement of the original pathname cannot redirect a shared AI store
  - closing a shared AI store does not close the canonical connection
  - standalone AI stores still perform one full-file quick_check each
  - canonical full-file quick_check remains before Cloud AI and before PAPER writer-lease acquisition
  - Cloud AI schema initialization completes before Research recovery evidence preparation
  - Research recovery preparation remains before PAPER writer-lease acquisition and does not disturb an existing competing owner
  - fresh exact-head CI and five required companions pass
  - fresh non-author review has zero unresolved current P0/P1 findings
  - separate structured NUSA Validator records exact head, P0/P1/P2 counts, and explicit ACCEPTED before Audit
  - pre-bootstrap replacement of the former internal verifier cache cannot admit raw, forged or replaced connections into either genuine store
  - pre-load and post-load replacement of DatabaseSync.prepare or StatementSync.get cannot mint full-file trust or forge its result; JavaScript and Proxy replacements fail closed, and corrupted files remain rejected
  - production PAPER and Research entrypoints load the integrity bootstrap before application code
  - replacing node:vm.runInNewContext or Object.values after bootstrap cannot bypass full-file integrity rejection
