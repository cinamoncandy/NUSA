  analysis: "Adds deterministic outcome-linked confidence calibration below the existing grounded real-provider challenger while preserving zero-authority PAPER/safety boundaries."
  references:
    - docs/NUSA_CORE_ARCHITECTURE_PRINCIPLE.md
