id: WO-RESEARCH-20261021-ORDERBOOK-RETENTION
title: "Order-book retention is 14 days: the pre-registered studies lose their training data before their verdict (owner decision needed)"
status: IN_PROGRESS
priority: P0
authority_impact: none
repository: cinamoncandy/NUSA
base_branch: main
branch: claude/orderbook-retention
found: "2026-10-21 by independent review of the pre-registered studies S2-S4. researchOrderBookCollector.ts prunes books older than ORDERBOOK_COLLECTOR_RETENTION_MS = 14 days every hour."
consequence:
  - "Existing study WO-RESEARCH-20261014-ORDERBOOK-STUDY (train 10-15..10-23, prints from 2026-10-29T02:00Z; the first Research run after that is about 2026-10-30T00:19Z): by then books older than about 10-16T00:19Z are gone, so the 10-15 training day is missing. The study requires hourly rows for at least 90% of its 192 training hours (173); 168 or fewer remain, so every market is ineligible and the study cannot produce a verdict. Its holdout 10-25..10-28 survives, but eligibility needs training."
  - "S2-S4 (docs/research-ledger/PREREGISTERED_STUDIES_2026-10-21.md): training 10-15.., holdout 11-05..12-05, verdict from 2026-12-05T02:00Z; with 14 days kept only 11-21 onward exists, so they would end in INSUFFICIENT_DATA."
  - "Deletion is irreversible and hourly: for the existing study the data must stop being deleted before about 2026-10-29T00:00Z."
change_in_this_pr: "(1) Retention becomes configurable: NUSA_RESEARCH_ORDERBOOK_RETENTION_DAYS (whole days 14..90, default 14 when unset or invalid); nothing changes until the owner sets it in /etc/nusa/cloud-runtime.env and restarts. (2) Option B is built in: migration 032 adds research_orderbook_study_rows and pruneOrderBookSamplesBefore now copies, in the same transaction and before deleting, the rows the studies read (minutes 58, 59 and 0 of every hour, minutes 1-10 only on the 4-hourly UTC marks 00/04/08/12/16/20, and minutes 43-45 of every hour: about 204 of 1,440 rows per market per day, 14 percent) so only the other rows are dropped. If the copy fails nothing is deleted. Nothing has been pruned yet (the collector started 2026-10-14T01:22Z; the first rows turn 14 days old on 2026-10-28), so deploying before then loses nothing. Each call archives and deletes at most one day per market (the oldest first), so a backlog is worked off over several hourly calls, and the archive is itself bounded (rows older than the live retention plus 61 days, 75 days in all, are deleted per market by primary key). Estimated cost, labelled an estimate: roughly 14 percent of the rows are kept (about 5 MB per day, WITHOUT ROWID table) instead of 100 percent for the same span; the studies read the live table and the archive together."
readers: "scripts/run-orderbook-study.js now reads the live table and the archive as one source through scripts/lib/orderBookSource.js (a data-access addendum to WO-RESEARCH-20261014-ORDERBOOK-STUDY: no rule changed). A test proves the study returns the same numbers on a database whose old rows were pruned into the archive and a different result when they are pruned without it. The S2-S4 runner reads the same way. scripts/run-raim-study.js and run-data-integrity-probe.js are not changed (the probe reports on the last 24 hours and 7 days)."
rollback_hazard: "Migration 032 is forward-only: an older build refuses to open a database that has an unknown migration, so rolling the binary back after this deploy makes the service fail to start. Deploy forward, and take the daily backup first."
remaining_gaps: "Not archived: minutes 11-42 and 46-57, any marking window longer than 10 minutes after an hour mark, and the WebSocket-recorded markets (count-pruned, never archived). Study readers: scripts/run-raim-study.js reads only the live table (its window 10-25..10-29 needs about 90 percent minute coverage that the archive does not hold, so it cannot use it) and would silently lose data after about 2026-11-08. The orderbook study's datasetFingerprint hashes every row it reads, so it now depends on when the prune ran; it identifies the data read, not a fixed dataset. A prune that fails every hour is counted in the collector's failures but raises no separate alert."
disk_risk: "NOT verified, and the reason this is the owner's call. The host disk is 91% full with about 4.5 GB free. The table holds about 2.5 M rows for 7 days (about 0.36 M rows per day; at roughly 100 bytes per row about 40 MB per day, an estimate). 21 days would add about 0.3 GB, 60 days about 1.9 GB more. The state database is also copied into daily and weekly backups (up to 11 copies per the host backup step, unverified), which multiplies any growth, and /var/lib/nusa and /var/backups/nusa are unreadable to the runner so the real sizes are unknown."
owner_options:
  - "A: free or add disk, then set NUSA_RESEARCH_ORDERBOOK_RETENTION_DAYS=21 before 2026-10-28 (saves the existing study) or 60 (also covers S2-S4 to 12-05). Check sudo du -sh /var/lib/nusa /var/backups/nusa and df first."
  - "B: a reviewed extractor that copies only the rows the studies read into a small side table before pruning (about a quarter of the rows). More code and a deploy; safer for disk."
  - "C: accept that the existing study will not produce a verdict and pre-register S2-S4 on data that will exist (shorter span)."
recommendation: "Deploy the archive-on-prune change (this PR) before 2026-10-28T01:22Z: it needs no disk decision and saves the existing study and S2-S4 data for roughly a quarter of the space. Check disk headroom anyway (the archive adds about 5 MB per day, and every backup copy of the state DB grows with it). Setting retention days is optional and is the larger disk risk. Do nothing destructive."
