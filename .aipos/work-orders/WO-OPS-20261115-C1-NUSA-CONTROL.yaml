id: WO-OPS-20261115-C1-NUSA-CONTROL
title: "C1: nusa-control controller (one host state file, table-driven stop/collect/reconcile/init), not installed"
status: READY_FOR_REVIEW
created: 2026-11-15
implementation_branch: claude/c1-nusa-control
owner_decision: "2026-11-15: the owner approved design v5 (docs/NUSA_CORE_DESIGN_V5_2026-11-15.md); C1 is the first code phase."
objective: "Move the host control decisions out of bash into one small, dependency-free, fully tested program with one state file."
change:
  - "deploy/control/nusa-control.js: verbs status, stop, collect, init, reconcile, verify; release and grant-orders refuse (NOT_AVAILABLE). State file /var/lib/nusa-control/state.json: strict schema, compare-and-swap version, temp + fsync + rename + directory fsync, temp files quarantined at boot. Intent is written before every action and cleared after; the boot reconcile ends STOPPED on a missing or invalid file, a pending intent or a moved release pointer. collect requires the recorded active build to be the running one and proven or adopted at install, writes NUSA_RUN_MODE=COLLECT_ONLY, and accepts only when /health reports COLLECT_ONLY within the ceiling; any failure ends with every owned unit stopped and disabled. PAPER_ORDERS cannot be represented (schema refuses it, the mode writer refuses it)."
  - "deploy/control/nusa-control.sh: thin sudo entry point holding one exclusive flock for every verb."
  - "tests/nusa-control.test.js: every row of the C1 state table plus a seeded property test (150 random runs of 12 steps with injected systemd faults, pointer moves, corrupted state and random health answers)."
not_changed:
  - "Nothing is installed or run on the host; no unit, sudoers, workflow, limit or authority change. The runtime does not read NUSA_RUN_MODE yet (C1b), and the release path is still the R2a helper until C4."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "node --test tests/nusa-control.test.js: 13 pass. Mutation checks: removing the stop in the collect failure path fails 3 tests; disabling the reconcile mismatch check fails 1."
  - "validate-repository-portability and validate-platform-independent-tests pass."
unverified: "Fifth Codex review (REJECT, 1 P0 and 3 P1) addressed: a collect intent now carries its owner (pid, process start time, boot id) and counts as in flight only while that same process is alive in the same boot and the intent is younger than the start ceiling plus a margin, so a stale intent can never permit a start (it resolves to STOPPED); the gate unit has no RemainAfterExit, so every start of a runtime unit evaluates it; reconcile and verify no longer wait for the controller lock (the gate runs inside collect, which holds it, so waiting would deadlock): with the lock busy they run read-only, never write or stop, reconcile permits only a verifiably in-flight collect and verify reports CONTROLLER_COMMAND_RUNNING; a live collect is not interrupted by the periodic verify, a stale one is stopped; gate denial only disables enabled-but-inactive units and stops only units that run (no stop on an inactive unit with a queued start). 33 tests; mutation checks on the boot id, the process identity, the freshness bound and the in-flight verify rule fail tests. Server items (C3): real systemd start-job behaviour with the gate, timer activation, Restart=on-failure of nusa.service without collect (up to 5 minutes before the periodic verify; bounded by the runtime fail-closed default of R1 and the C1b start limits). Fourth Codex review (REJECT, 1 P0 and 2 P1) addressed: the start gate now FAILS (non-zero exit, so Requires= makes systemd fail the runtime start jobs) in every state except a settled COLLECT_ONLY record or a collect in flight; a STOPPED host therefore never starts by itself, and the gate stops and verifies any owned unit that is active or still enabled before it denies; collect classifies answers with the same function as verify (any identified wrong answer, including a wrong mode such as STARTING, ends the start at once); the verify timer no longer depends on PartOf/BindsTo/WantedBy=nusa.service behaviour: it is an independent timer (3 min after boot, then every 5 min), and the first verification of every start is collect itself (its own sender-bound verification loop). 29 tests; mutation checks on the gate rule, the collect classifier and the collect-in-flight permission each fail tests. NOT verified (C3 on the host): the real systemd job graph, the interaction of a gate-side stop with a queued start job (the gate stops units only when something is active or enabled, which is not the normal boot path), the actual enable result of the units, and restart loops resetting the activation age. Third Codex review (REJECT, 2 P0 and 3 P1) addressed: the server-side socket is matched by the exact local and remote address AND port pair (IPv4 and IPv6, mapped addresses folded) and must be unique, resolved while the connection is open and before the request is sent; the boot gate no longer relies on a RequiredBy= install trick: drop-ins (deploy/control/dropins, installed only with the controller in C3) give nusa.service, nusa-research.timer and nusa-research.service Requires= and After= on the gate, and a modelled dependency graph test checks that every runtime unit requires and is ordered after the gate, that the gate requires nothing, and that there is no ordering cycle; the verify timer is bound to nusa.service (BindsTo, PartOf, OnActiveSec=2min so the first verify runs 2 minutes after every start, then every 5 minutes); verify tolerates only no answer within the ceiling and stops at once on any identified answer with another mode or build; the lock file is checked on the open descriptor. 28 tests; mutation checks on the address pair, the unique inode and the wrong-answer rule fail tests. NOT verified: the real systemd graph (systemd-analyze verify against the real unit set is part of C3), whether stopping nusa.service from inside the gate while its start job is queued behaves as modelled, and unit restart loops resetting the activation age (bounded by the unit start limits of C1b). Second Codex review (REJECT, 1 P0 and 4 P1) addressed: the /health answer is bound to its sender (the controller opens the connection, finds the server side of that very connection in /proc/net/tcp and tcp6 while it is open, and requires the holding process to be in the nusa.service cgroup); verify STOPPED also requires the boot units disabled; verify tolerates no answer only while the unit is younger than the start ceiling (systemd monotonic timestamp) and stops at once on a wrong answer; a refused collect stops owned units that run under a record it cannot vouch for; every ancestor of the state and mode directories must be root-owned and not group/other writable (no TOCTOU without root); the sudo entry point checks the lock directory and file before flock; init re-stops after a failed create; boot gate unit (Before= and RequiredBy= the runtime units) and a 5 min verify timer added. 24 tests; mutation checks on the sender cgroup check, the STOPPED enabled check, the refused-collect stop and the start-ceiling tolerance each fail a test. First Codex review (REJECT, 2 P0 and 5 P1) addressed: reconcile only PERMITS a start (START_PERMITTED_COLLECT_ONLY) and a new verify verb checks the running unit, the listener identity, the build and the mode, stopping on any mismatch or error; a /health answer counts only if every process listening on the health port is in the nusa.service cgroup (read from /proc) and reports the recorded build; compare-and-swap refuses to write over a missing, corrupt or unsafe file (only init creates the first file, O_EXCL); stop stops the units first and records the state afterwards, reporting STOPPED_STATE_NOT_RECORDED if the record fails; the state directory must be a real 0700 directory of the expected owner, files are opened O_NOFOLLOW, temp files are random and O_EXCL, mode file and its directory are checked, file and directory fsync; init stops the units before recording STOPPED; every exception inside collect, reconcile and verify ends in the verified stop; deadlines use a monotonic clock. Tests: 17 including file-safety attacks and a 200-run property test; mutation checks on the cgroup check, the CAS refusal and the symlinked directory each fail a test. Not run on the host, systemd exit codes are modelled (is-active 0/3/4, is-enabled 0/1/4), not observed. No non-author review yet. The boot ordering unit (reconcile before nusa.service) and the sudo rule are C3."
acceptance:
  - "CI green; non-author review before the PR leaves draft."
