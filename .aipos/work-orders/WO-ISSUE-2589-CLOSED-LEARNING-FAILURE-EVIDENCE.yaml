id: WO-ISSUE-2589-CLOSED-LEARNING-FAILURE-EVIDENCE
title: "Persist prepared closed-learning cycle failure evidence across restart and replay"
status: DELEGATED_INCREMENT_COMMITTED_WORKFLOW_VALIDATED
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
issue: 2589
parent_issue: 1605
authority_impact: none
objective: "Preserve deterministic root-cause evidence when a realized PAPER period has been prepared for closed learning but no durable cycle record is produced."
first_broken_transition: "closed PAPER Performance Evidence N -> closed-learning cycle/Feedback N"
scope:
  include:
    - "Append an immutable failure receipt to the existing hash-chained evolution learning ledger after a prepared cycle fails in CYCLE or FINALIZE."
    - "Bind the receipt to closed period, evidence id/fingerprint, Research source SHA, runtime source SHA, fixed stage/code and timestamp; deterministic identity deduplicates replay."
    - "Bound and canonicalize receipt identity fields before append or replay so oversized, padded, or control-bearing identities fail closed."
    - "Strictly replay failure receipts and project the latest failure independently from the latest successful durable cycle on read-only loop health."
  exclude:
    - "Research N+1 selection, candidate parameters, thresholds, PAPER execution/risk behavior, LIVE authority, and inferred historical failure reasons."
acceptance:
  - "Failure after period close creates one bounded identity-only receipt; same-input replay creates no duplicate."
  - "Restart restores latest failure evidence; later no-op or successful cycle does not erase or rewrite it."
  - "Malformed or tampered failure receipt fails closed and is not projected."
  - "No prices, balances, exception text, synthetic performance, credentials, or authority expansion are persisted."
verification_commands:
  - "pnpm run build"
  - "pnpm run typecheck"
  - "pnpm run validate:full"
  - "pnpm run work-orders:index:check"
  - "node -r ./tests/register-dist.cjs --test dist/apps/cloud/src/closedLearningRolloverScheduler.test.js tests/closed-learning-loop-status.test.js tests/cloud-runtime-liveness-health.test.js"
evidence:
  delegated_validation: "The published increment is committed and workflow-validated by the delegated publish job using the commands above plus tests/*.test.js and isolated co-located tests."
  remaining: "Exact-head CI, independent Audit and Release; then protected-main merge, exact-main PAPER deployment/runtime proof that durable failure evidence survives restart/recovery or a successful reproduced cycle is recorded, and replay proof that no duplicate failure or cycle record is produced."
safety:
