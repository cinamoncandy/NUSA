id: WO-PAPER-20261005-PERSISTENCE-FAILURE-DETAIL
title: "Show why a PAPER account save failed (cause detail) instead of a fixed message"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/persistence-failure-detail
authority_impact: diagnostics_only
objective: "PAPER has stayed HALTED with 'paper account persistence failed', cycles 0, also after the 2026-10-05 10:25 UTC restart (owner screenshot 6:07 UTC+7), so it is a persistent failure, not a transient one. Twelve save sites catch and discard the underlying error, and the host diagnosis account cannot read the service log or state directory, so the cause is invisible to everyone. Make the cause visible to the owner."
scope:
  - "apps/cloud/src/paperTradingExecutionLoop.ts: describePersistenceFailure (error code plus message, limited to letters, digits, space, underscore, dot and hyphen, at most 90 characters, 'UNKNOWN' otherwise) and PaperTradingExecutionLoop.persistenceFailureDetail(); the 12 save catch sites record it. The result reason string is unchanged ('paper account persistence failed'), so every existing contract and test holds."
  - "apps/cloud/src/runtime.ts: the heartbeat lastError for a persistence failure becomes 'paper account persistence failed: <cause>'; other failures are unchanged."
  - "apps/mobile/src/haltReasonModel.ts: the halt explanation says in Korean that the account state could not be saved and adds a hint (write lease lost, read-only store, no space, locked, no permission, ledger mismatch) only when the cause text matches a known pattern; an unknown cause is not guessed; the raw text stays in the advanced diagnostic line."
  - "tests/paper-persistence-failure-detail.test.js (3) and a new case in tests/mobile-halt-reason.test.js."
  - "apps/cloud/src/moduleQualificationV1.ts and paperTradingExecutionLoop.requalification.test.ts: the PAPER_ADAPTER source blob pin is re-bound to the changed source (same procedure as the earlier per-capital account change); qualification stays TARGET_ONLY and no criterion is claimed verified."
exclusions:
  - "No change to when PAPER halts, to whether it resumes, to the ledger, risk, execution, LIVE, credentials or AI authority. The halt is not cleared or hidden; the owner decides about resuming only after the cause is known."
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: "Diagnostics only. The cause text is sanitised so no path, payload or secret-looking punctuation can reach the heartbeat."
rollback: "Revert the change."
verification_commands:
  - npx tsc -p tsconfig.json
  - node --test tests/paper-persistence-failure-detail.test.js tests/personal-paper-manual-order-runtime.test.js tests/personal-paper-order-http.test.js tests/personal-paper-order-http-boundary.test.js tests/mobile-halt-reason.test.js
  - node scripts/lint-mobile.js
residual: "The cause itself is still unknown; this only makes it visible after the next PAPER deploy and the next failed save (the runtime retries every tick, so it appears within seconds). The server reports it only after the runtime has been redeployed with this change."
