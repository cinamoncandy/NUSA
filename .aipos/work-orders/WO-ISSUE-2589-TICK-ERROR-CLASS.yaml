authority_impact: none
objective: "Production TICK_ERROR left only a generic reason (host diagnosis 38662550145: lastBlockedReason=TICK_ERROR at 00:36:16Z, cause unknown, journal unreadable by the diagnostic runner). Publish a fixed-code class of the thrown error so the next occurrence can be root-caused without exposing messages, paths or data."
first_broken_transition: "closed-learning tick throws -> cause is discarded (only 'TICK_ERROR' is kept)"
scope:
  - tickErrorClass(error): error.code or error.name as an upper-case fixed code, else UNKNOWN_ERROR
  - runtime health closedLearningLoop.lastErrorClass (this process only; not persisted; cleared by a later non-error block; never throws; only ERR_*/errno-style codes or the error name)
prohibited:
  - exception_message_stack_path_or_data_in_health
  - threshold_risk_or_authority_change
acceptance:
  - message text never appears in the snapshot; an unclassified later error clears the class
  - existing TICK_ERROR persistence and receipts unchanged
