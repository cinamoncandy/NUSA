id: WO-AUTOPILOT-20260929-CODEX-DEDICATED-ACCOUNT
title: "Autopilot develops through one dedicated ChatGPT Codex account"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/nusa-repository-j93sd8-codex-no-local-build
authority_impact: none
owner_decision: "2026-09-29 owner: autopilot must actually develop, using ChatGPT (Codex) usage from one specific account (the one logged in on the evening of 2026-09-28), not the account the owner uses for interactive Codex work and not Cloudflare Workers AI."
objective: "The last 120 scheduled autopilot cycles were all WAITING_RATE_LIMIT / waiting-provider-capacity: the Workers AI free quota is exhausted daily and shared with Audit, so the autopilot produced no code."
scope:
  - "selectCodexBacklogTask (apps/autopilot/src/evolveGithubIssueBacklog.ts): same owner-backlog eligibility as the Workers AI path (open, owner-authored, not blocked, priority title, safety contract, valid metadata, no linked open PR) but also RESEARCH/GENERAL issues; UNKNOWN excluded; one issue at a time."
  - "scripts/autopilot-codex-select.js: read-only selection plus a Codex prompt carrying the AGENTS/AIPOS/CORE contract (no commit/push/PR, no LIVE/credential/workflow/deploy paths)."
  - ".github/workflows/autopilot-codex-coding.yml: every 2 hours and on dispatch; skips while an autopilot/codex PR is open; runs Codex only on the runner labelled nusa-codex-autopilot (the dedicated account); a ChatGPT usage limit is a wait with no fallback account; the patch is applied to current main on GitHub-hosted hardware, the protected-path boundary is enforced, build/typecheck/validate/work-order index/tests must pass, and only then the workflow pushes autopilot/codex/issue-N-<run> and opens a PR (Refs #N)."
exclusions:
  - "Codex gets no commit, push, PR, merge or deploy authority. PRs merge only through CI, Audit and the deterministic Release. No LIVE, credential or production authority."
owner_setup_required:
  - "Add the label nusa-codex-autopilot to exactly one self-hosted runner (Settings -> Actions -> Runners) and keep it logged in to the dedicated ChatGPT account (codex login --device-auth)."
  - "Runners must be online (all were offline on 2026-09-29)."
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
verification_commands:
  - pnpm run build
  - pnpm run typecheck
  - pnpm run validate
  - node scripts/aipos-work-order-index.js --check
  - node --test tests/*.test.js
  - node scripts/run-tests-isolated.js
evidence:
  - "tests/autopilot-codex-coding.test.js: RESEARCH/GENERAL selection by priority; unsafe/outsider/blocked/linked/LIVE issues rejected; prompt contract; runner pinned to nusa-codex-autopilot; Codex job has no push/PR/token; usage-limit wait; validation gates ordered before PR creation; single open autopilot PR."
recovery_log:
  - "2026-09-29 #2388 merged. Owner logged the dedicated ChatGPT account in on nusa-codex-dev-2 and labelled only that runner nusa-codex-autopilot."
  - "Run 36559951066: dedicated account hit its ChatGPT usage limit; the step failed red because Actions bash -e ended it before the usage-limit check. Fixed by #2389 (set +e)."
  - "Run 36561557413 (after owner credit top-up): Codex produced a #2118 patch, but its output quoted the workflow's usage-limit text, so the loose grep discarded the patch. Fixed by #2390 (wait only on rc!=0 and the run's own ERROR line)."
  - "Run 36563498694: Codex produced a #2118 patch that applied and passed the path boundary, but tests/autopilot-dispatch-retry.test.js runs git reset --hard HEAD on GitHub runners and dropped the staged patch mid-suite, so publish found nothing to commit. Fix (this branch): commit the patch before validation, validate that commit, and publish only the recorded validated HEAD on a clean tree."
  - "Remaining: exact-head CI, Audit and Release merge of the commit-first fix, then one dispatch of autopilot-codex-coding that must open an autopilot/codex PR."
  - "2026-09-29 incident: Codex run 36571141266 on nusa-codex-dev-2 overlapped Oracle PAPER release 36568651653 on the same 1 GB host; the host slowed to minutes per step, release and rollback readiness both failed and /health returned 502 from ~12:58 until the 9f433315 redeploy (~13:55 UTC). Codex run cancelled."
  - "Owner decision (option 2): keep Codex on the shared host but PAPER wins. scripts/autopilot-codex-host-guard.sh: start needs MemAvailable >= 450 MiB and no queued/running Oracle PAPER release (API failure defers); during the run Codex is stopped and its patch discarded when MemAvailable < 200 MiB or a PAPER release starts; Codex runs under nice 19 / ionice idle."
  - "Overnight 2026-09-29: the guard deferred every run (MemAvailable 357 MiB at 15:30, 399 MiB at 18:41 UTC) while PAPER stayed healthy. Owner decision 2026-09-30: lower the start threshold to 350 MiB; the 200 MiB in-run floor, PAPER-release deferral and nice/ionice limits are unchanged."
  - "Security remediation ported into the same PR (it blocks security:gate for every PR, including current main): pnpm overrides undici@7.29.0->7.29.1 (GHSA 1240041, 1240050; via electron>@electron/get), undici@6.28.0->6.28.1 (1240042; via electron-builder>node-gyp) and joi@17.13.6->17.13.7 (1240057; via the react-native CLI). Scope: build/dev-tool transitive dependencies only, no runtime, PAPER or credential path. Evidence: pnpm install --frozen-lockfile, security:gate PASS (FAIL on main before), tests/security-gate.test.js asserts each pin and the absence of the vulnerable version. Next action: none beyond merge; future advisories follow the same override-plus-assertion pattern."
  - "Run 36635249238 (350 MiB threshold): the guard admitted Codex, which produced a #2118 patch, but Codex then ran pnpm run typecheck on the shared host; memory fell below the 200 MiB floor and the guard stopped the run and discarded the patch (PAPER stayed healthy). Fix: the Codex prompt now forbids install/build/typecheck/tests on the runner; the publish job already runs every gate on GitHub-hosted hardware."
  - "Review of the no-local-build change: (1) the prompt now states an explicit delegated-validation exception to the AGENTS verification rule for this lane, and heavy tools (pnpm, npm, npx, yarn, tsc, vitest, jest, node --test) are technically blocked on the Codex runner via a PATH shim, so compliance does not depend on the prompt; (2) the publish job now also runs node scripts/run-tests-isolated.js before gh pr create, covering co-located dist tests that tests/*.test.js omits."
