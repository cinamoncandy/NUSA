requirements:
  - "Implement provider-specific broker account/read-only access behind a provider-agnostic boundary; do not add provider-specific identity to Stable Core contracts."
  - "Credential secrets may be encrypted at rest through OS-backed secure storage, but raw secrets must never enter logs, evidence, renderer state, AI context, or audit payloads."
  - "Credential use is restricted to explicitly read-only broker operations; execution/order/cancel/withdraw permissions are prohibited."
  - "Do not expose order submit, amend, cancel, withdrawal, cash mutation, or position mutation methods."
  - "Preserve WO-0035 prohibited-permission surface guard and fail closed if execution capability appears."
  - "Read-only broker calls must use bounded timeout, deterministic error mapping, auditable metadata without secret material, and fail-closed credential handling."
  - "Add account/read-only reconciliation semantics that can detect unavailable or inconsistent broker data without mutating portfolio state."
  - "Add focused regressions for encrypted credential persistence, secret redaction, read-only method surface, authority separation, and fail-closed behavior."
  - "Emit machine-readable evidence proving no execution methods/permissions and no secret leakage."
acceptance:
  - "Read-only broker/credential integration regressions PASS."
  - "Capability Surface Guard PASS with zero prohibited LIVE permissions."
  - "No execution/order/cancel/withdraw method becomes reachable."
  - "No credential secret appears in logs, evidence, renderer state, or AI-visible state."
  - "Existing Restricted LIVE readiness/rehearsal/governance/safety/AIPOS/architecture/security gates PASS."
  - "Full required GitHub CI PASS on the exact PR head."
safety:
  live_trading_mutation: prohibited
  live_execution_transport: disconnected
  credential_execution_use: prohibited
  order_mutation: prohibited
  withdrawals: prohibited
  real_money_execution: prohibited
  automatic_live_activation: prohibited
completion_rule: "Merge + required test/CI PASS. Completion proves read-only broker and secure credential integration only and cannot authorize or perform LIVE execution."
