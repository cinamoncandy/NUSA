objective: "Integrate a production-shaped broker account/read-only service and secure credential boundary while preserving the constitutional prohibition on execution transport, order mutation, credential execution use, and real-money trading."
source_of_truth:
  architecture:
    - docs/NUSA_CORE_ARCHITECTURE_PRINCIPLE.md
