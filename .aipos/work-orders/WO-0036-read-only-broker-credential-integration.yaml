architecture_impact:
  acknowledged: true
  analysis: "WO-0036 absorbs only the useful read-only concepts from the stale A5b branch into current main. Provider-specific implementation stays outside Stable Core, credentials remain unavailable to AI and evidence, execution permissions remain absent, and the WO-0035 capability surface guard stays authoritative."
  references:
    - docs/NUSA_CORE_ARCHITECTURE_PRINCIPLE.md
