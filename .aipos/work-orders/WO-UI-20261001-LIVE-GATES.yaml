objective: "Owner asked for a full design renewal and UX improvement. First slice: the LIVE tab showed raw enum grids (HEAD, LEASE, CREDENTIAL, ...). It now leads with one sentence, a progress bar and ten gates in plain Korean; the raw records move behind a details toggle."
scope:
  - "New import-free model apps/mobile/src/liveGateModel.ts maps the read-only readiness snapshot to ten gates (PASS / BLOCKED / UNKNOWN), a pass count and a headline. Missing evidence is UNKNOWN, never PASS. All gates passing still reads as awaiting owner approval; the app cannot enable LIVE."
  - "liveReadinessMonitorView.tsx: hero sentence + progress, gate list, the read-only authority sentence, and a '세부 기록 보기' toggle that keeps every previous record card (status, safety, blockers, freshness, incidents, timeline, authority)."
exclusions:
  - "No change to the readiness contract, server, risk, execution, credential or LIVE authority. Presentation only."
