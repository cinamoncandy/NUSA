    - "liveGateModel.ts reads only the read-only snapshot; it has no imports and no side effects."
    - "Gates fail closed: missing evidence is UNKNOWN; runtime safety passes only when its source is FRESH; canonical evaluator blockers keep a gate BLOCKED; all gates passing still states the owner must enable LIVE outside the app."
