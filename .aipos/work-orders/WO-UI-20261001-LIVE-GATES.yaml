id: WO-UI-20261001-LIVE-GATES
title: "Redesign the LIVE tab as a plain-language gate checklist"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/nusa-repository-j93sd8-live-redesign
