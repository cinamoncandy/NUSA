  consequence: "At the pre-registered level 0.02 the family-wise false-positive rate is below 0.05 up to hourly signed-IC autocorrelation 0.8 and about 0.09 at 0.9, as the pre-registration states; the independent reviewer of V2 obtained similar figures with their own code."
