  setup: "scripts/simulate-signal-screen-size.js: the real signFlipP and holm, T = 720, equal weights, mean-zero Gaussian AR(1) hourly signed IC (sd 0.5), 1500 repetitions, 1000 resamples, a pass needs a positive mean."
