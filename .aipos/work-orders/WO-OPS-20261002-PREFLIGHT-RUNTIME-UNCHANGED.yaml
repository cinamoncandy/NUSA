objective: "WO-OPS-20261002-CLOUDFLARE-RUNTIME-DELTA-DEPLOY (#2454) made the canonical deploy skip Worker rollout when exact main has no runtime-input delta. The trusted credential preflight still required an executed exact-main deploy and live deploymentRevision == exact main, so the docs-only main 686b6a3 reopened P0 #1461 and serialized every Release (Audit PASS, Release NO_ACTION blocked_by=P0#1461 for #2456/#2457/#2458)."
