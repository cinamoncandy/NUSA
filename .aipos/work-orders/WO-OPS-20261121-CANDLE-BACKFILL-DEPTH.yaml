id: WO-OPS-20261121-CANDLE-BACKFILL-DEPTH
title: "Research: optional NUSA_RESEARCH_BACKFILL_DAYS deepens only the historical candle backfill (1..45 days)"
status: READY_FOR_REVIEW
created: 2026-11-21
objective: "The four newly collected markets have about 13.5 days of 1-minute candles because the backfill reaches only train + validation + holdout + 1 day. Add a separate optional setting that deepens only the backfill so the history-mining tool and the learning loop have enough candles, without touching experiment windows, manifests, identity or any hash."
change:
  - "apps/cloud/src/researchExperimentComposition.ts: optional backfillDays setting (NUSA_RESEARCH_BACKFILL_DAYS, plain integer 1..45, invalid = IGNORED with a logged warning and the default depth (research stays on), unset = no field) and researchBackfillSpanMs = max(researchTargetSpanMs, days x 1 day), passed only to backfillMarket."
  - "tests/research-backfill-depth.test.js (own file: the composition test file already uses most of the 120 s per-file limit on the Windows runner): parse, identity unchanged, deeper backfill only, page bound, row cap."
  - "docs/RESEARCH_EXPERIMENTS_OPERATIONS.md: owner paste line, expected effect, trim note."
review_fixes:
  - "Independent review applied: ceiling 45 (not 60) so the 100,000-row store cap leaves about 24 days of live growth; a bad value is ignored with a log line instead of switching research off; strict plain-integer parsing (no '045', '1e1', '0x10', signs, full-width digits); with the setting only a rate limit or an error retries the backfill (an INCOMPLETE hole was re-walked three times with about 5 minutes of synchronous hashing each per market and never healed); docs state that every restart re-walks and recommend 45. Mutation checks: the retry rule, the ceiling and the strict regex each fail a test."
not_changed:
  - "researchTargetSpanMs, manifests, gap-fill window, rolling holdout, experiment identity, hashes and fingerprints; candle store cap; backfill and gap-fill code; any gate, threshold, risk limit, capital or experiment qualification."
  - "Unset behaviour is byte for byte the current behaviour."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  realOrderAuthority: false
  aiAuthority: ZERO_AUTHORITY
authority_impact: none
release_plan:
  - "Must not merge before the 2026-11-23 release. Ships in the first release after the 2026-11-24..2026-11-28 freeze."
  - "The NUSA_RESEARCH_BACKFILL_DAYS=45 line in /etc/nusa/cloud-runtime.env is an owner host step after that release; nothing changes until it is written and the service restarted."
acceptance:
  - "AIPOS validators pass; relevant research tests pass; independent non-author /grill-me review; exact-head CI."
