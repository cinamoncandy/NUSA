objective: "Reduce non-inference requests during a canonical Workers AI provider wait and reduce the neuron cost of optional Jev SHADOW classification without bypassing quota, enabling a paid provider, or changing coding model authority."
canonical_owners:
  - "Autopilot scheduler / provider wait: apps/autopilot"
  - "Jev SHADOW provider selection: AI Platform"
scope:
  include:
    - "Read the canonical persisted workers-ai wait before issue/PR searches and workflow history reads."
    - "During a valid wait, verify fresh protected-main SHA and return WAITING_RATE_LIMIT without coding dispatch or model invocation."
    - "Use a lower-neuron model as the default for the optional zero-authority Jev SHADOW classifier only; preserve strict validation and deterministic fallback."
    - "The default Jev model identity must exist in the canonical neuron-rate table so usage telemetry can estimate cost instead of returning an unknown-rate null."
    - "Record actual request-count regression proof and distinguish published per-token pricing estimate from runtime-measured usage."
  exclude:
    - "No provider quota bypass, paid-plan activation, credential change, new provider, or alternate token."
    - "No change to the Autopilot code-generation model, attempt budget, active Jev routing, or SHADOW enablement configuration."
    - "No second queue, scheduler, provider router, evidence store, or runtime authority."
acceptance:
  - "While nextRetryAt is in the future, scheduled runtime performs one fresh main-branch read, zero backlog searches, zero workflow-history reads, and zero coding/model dispatches."
  - "Provider-wait state read failure remains fail-closed and triggers no GitHub requests."
  - "Jev SHADOW uses the configured model when set and a supported lower-neuron default with a canonical rate otherwise; strict output validation and provider-stop no-call behavior remain intact."
  - "Exact-head CI, architecture, security, safety, Audit and Release gates remain unchanged."
  - "Runtime savings are not claimed until receipt/token telemetry proves them."
