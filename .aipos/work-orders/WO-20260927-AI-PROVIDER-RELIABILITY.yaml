id: WO-20260927-AI-PROVIDER-RELIABILITY
title: "Provider-neutral AI reliability taxonomy and circuit recovery"
status: READY_FOR_REVIEW
owner: nusa-ai-platform
repository: cinamoncandy/NUSA
issue: 1997
base_branch: main
base_commit: e1a9f3ccb2cbc463344a18d322821ac80c82ded7
implementation_branch: feat/1997-provider-reliability
authority_impact: none
objective: "Complete the provider-neutral reliability gap in the canonical AI Platform without creating a second router: classify provider failures deterministically, maintain bounded provider circuit health/recovery, and project health into the existing model registry."
scope:
  include:
    - "Provider-neutral taxonomy: TIMEOUT, AUTH_CONFIG, RATE_LIMITED, UNAVAILABLE, MALFORMED_OUTPUT, CONTEXT_OVERFLOW, BUDGET_EXHAUSTED, UNKNOWN."
    - "Deterministic retryability/manual-reset/circuit relevance without exposing raw provider messages in outputs."
    - "CLOSED/OPEN/HALF_OPEN/BLOCKED provider circuit state with bounded failure threshold, cooldown, retry-after and recovery."
    - "Provider health projection into existing AiModelRegistryEntry.availability."
    - "ZERO_AUTHORITY / NONE / no production mutation invariants."
  exclude:
    - "A second model router, scheduler, provider client, queue, governor, or orchestrator."
    - "Autopilot provider concurrency/backpressure integration owned by #2185/#903."
    - "Secrets, credential mutation, Audit/Release/merge authority, LIVE/trading authority."
acceptance:
  - "Taxonomy distinguishes timeout/auth/429/5xx/malformed/context/budget/unknown."
  - "Only bounded transient failures are retryable."
  - "Auth/config and budget-without-reset fail closed and require explicit reset."
  - "Rate-limit can open immediately using bounded retry-after."
  - "Repeated timeout/unavailable opens at threshold; recovery is OPEN -> HALF_OPEN -> CLOSED after bounded successes."
  - "Failure during HALF_OPEN reopens."
  - "Request-local malformed/context/unknown failures do not poison provider health."
  - "Provider circuit health deterministically maps into canonical model registry availability."
  - "No raw message/credential is copied into classification or circuit telemetry."
verification_commands:
  - "pnpm run build"
  - "node --test dist/apps/cloud/src/ai/providerReliability.test.js"
  - "git diff --check"
evidence:
  implementation_status: READY_FOR_REVIEW
