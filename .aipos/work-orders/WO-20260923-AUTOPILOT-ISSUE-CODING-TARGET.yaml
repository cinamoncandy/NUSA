id: WO-20260923-AUTOPILOT-ISSUE-CODING-TARGET
title: "Carry an OWNER issue's explicit coding target to the first proposal attempt"
status: MERGED
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
base_commit: 2f5400eba35cc603b17ade7eb9c30043a5a1bcf0
implementation_branch: claude/nusa-repository-j93sd8-issue-target
objective: "Let an OWNER issue name the one apps/autopilot/src file its next increment belongs in, so WO-20260923-AUTOPILOT-INITIAL-PROPOSAL-CONTEXT can give coding attempt 1 a real excerpt of that file instead of none."
parent_work_order: WO-20260923-AUTOPILOT-INITIAL-PROPOSAL-CONTEXT
authority_impact: none
finding: "After #2231 the first attempt only receives context when the execution reason names a file, and backlog-derived reasons never did: the issue backlog built its problem text from the title alone."
scope:
  include:
    - "Optional single `codingTarget: apps/autopilot/src/<file>.ts` line in an OWNER issue body"
    - "Appending ` Target file: <path>.` to the selected backlog problem when present"
  exclude:
    - "Any change to issue eligibility, priority, capability routing or safety-contract checks when the line is absent"
    - "Any change to the coding runner scope or the sandbox apply-check"
    - "LIVE, production mutation, credentials, new queue/scheduler/agent"
acceptance:
  - "Absent codingTarget leaves the selected problem byte-identical."
  - "A valid codingTarget is appended to the problem and reaches attempt 1 as an excerpt of that file."
  - "Repeated, test, declaration, index/worker, forbidden-domain, traversal or out-of-scope targets make the issue ineligible."
  - "PAPER_ONLY, liveAuthority=NONE, productionMutationAllowed=false, aiAuthority=ZERO_AUTHORITY remain unchanged."
verification_commands:
  - "npx tsx --test apps/autopilot/src/evolveGithubIssueBacklog.test.ts"
  - "node --test tests/autopilot-initial-proposal-context.test.js tests/autopilot-dispatch-retry.test.js"
  - "pnpm run typecheck"
  - "pnpm run lint"
  - "pnpm run safety:invariants"
  - "pnpm run ai:architecture"
evidence:
  implementation_status: MERGED_PR_2232_af6a9f90
  mutation_verification:
    - "drop the target from the problem -> unit 1 failure and end-to-end 1 failure"
    - "accept a forbidden-domain target -> 1 failure"
    - "accept a repeated target line -> 1 failure"
    - "accept apps/autopilot/src/index.ts -> 1 failure"
  external_validation: "COMPLETED: exact-head protected CI passed on 51a35325; independent Audit and Release gate passed; merged by nusa-release-authority[bot] as PR #2232 merge af6a9f90cd090d4322cdd82566227320847fd613; merged blobs verified byte-identical to the validated head."
  operational_note: "Takes effect only for issues whose body carries the line; OWNER may add it to #2118 or other Autopilot issues."
