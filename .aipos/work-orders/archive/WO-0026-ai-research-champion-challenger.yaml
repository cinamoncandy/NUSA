requirements:
  - "Define machine-readable Champion and Challenger identities scoped to a capability contract/version."
  - "Track implementation lineage across model/provider/data/tool/implementation dimensions so nominally different candidates are not assumed independent."
  - "Require sealed benchmark/holdout identity and prevent candidates or Meta-AI proposer roles from modifying evaluation data after registration."
  - "Separate proposer, evaluator, and promotion authority. A candidate or Meta-AI proposer must never be the final Evaluation Authority or Promotion Authority for itself."
  - "Require reproducible evaluation evidence with code/config/data/benchmark versions, metrics, failure semantics, and decision provenance."
  - "Support KEEP_CHAMPION, PROMOTE_CHALLENGER, REJECT_CHALLENGER, and INCONCLUSIVE recommendations without directly mutating production state."
  - "Fail closed when benchmark evidence is missing, lineage is ambiguous, evaluator independence is violated, or promotion authority is self-referential."
  - "Add deterministic local/CI validation and focused regression tests."
  - "Preserve P0-A through P0-F gates and LIVE mutation prohibition."
