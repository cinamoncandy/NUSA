authority_impact: paper_runtime_recovery
objective: "After startCloudRuntime completes its synchronous composition, renew only a still-valid lease owned by this process before closed-learning scheduling begins, preserving the 30-second lease contract and fail-closed ownership semantics."
root_cause: "Production evidence showed the writer lease could be acquired before a long synchronous startup composition, leaving little or no lease time for the first event-loop heartbeat. The existing timer cannot run during synchronous work."
scope:
  - "Reuse SqliteCloudPaperAccountRepository.verifyWriterLease at the post-startCloudRuntime handoff."
  - "If verification fails after listener construction, stop the partially started runtime and propagate the original error."
  - "Add deterministic integration regressions for a valid lease after 25 seconds of synchronous composition, an expired lease after 30.001 seconds, and owner mismatch."
exclusions:
  - "Do not change lease TTL, heartbeat interval, takeover predicate, startup timeout, Risk, or readiness budget."
  - "Do not revive expired/missing/corrupt leases or take over a different owner."
  - "Do not change historical ledger/database state outside isolated test fixtures."
architecture_impact:
  acknowledged: true
  analysis: "Reuses the existing PAPER writer lease and production runtime composition; adds no scheduler, writer, control plane, store, or authority."
  references:
    - apps/cloud/src/closedLearningProductionRuntime.ts
    - apps/cloud/src/paperTradingExecutionLoop.ts
    - tests/research-startup-recovery.test.js
    - tests/paper-startup-lease-budget-2770.test.js
acceptance:
  - "A still-valid current-owner lease renews immediately after startCloudRuntime returns and before closed-learning timers are scheduled."
  - "An expired lease, missing lease, or owner mismatch remains fail-closed; no takeover or TTL extension occurs."
  - "A partial runtime created before a failed handoff is stopped."
  - "PAPER writer lease liveness and startup budget regressions remain green without changing the 30-second TTL or existing heartbeat."
  - "Exact-head CI and required companions pass; fresh non-author review, formal validation, Audit, Release, and protected merge remain required."
