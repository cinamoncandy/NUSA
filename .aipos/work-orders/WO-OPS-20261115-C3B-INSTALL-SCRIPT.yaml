id: WO-OPS-20261115-C3B-INSTALL-SCRIPT
title: "C3b: one-time install script for the host controller, with a read-only preflight and a rollback"
status: READY_FOR_REVIEW
created: 2026-11-15
implementation_branch: claude/c3b-install-plan
owner_decision: "2026-11-15: the owner chose the reduced path: drop the separate audit workflow (PR 3146, closed after three review rounds) and go to one reviewed install with a read-only preflight."
objective: "Replace many hand-typed root commands with one script the owner runs three times at most (preflight, apply, rollback), where the preflight doubles as the access and precondition check."
change:
  - "deploy/control/install.sh: preflight (read-only, PASS/FAIL per precondition, nothing changed): release staged and active, no symlink in the control tree, source files present, ONE manifest sha256 over every deploy/control file except install.sh equal to the hash printed in the reviewed pull request, /opt /opt/nusa /etc /etc/nusa /etc/systemd/system /var/lib real, root-owned, not group/other-writable, orders OFF from every environment source (exactly one NUSA_PAPER_ORDER_PATH=OFF line in the runtime env file, nothing in systemd's effective unit environment, no Environment= assignment in nusa.service or its drop-ins; the file is only read), no NUSA_RUN_MODE yet, nusa.service active, /health shows this commit and runMode COLLECT_ONLY (parsed as JSON), no state file, controller not installed. --apply refuses unless every check passes, then copies the release control tree ONCE into a root-only private directory, re-verifies the manifest hash on that copy and installs only from it, then: mode file, state directory 0700, controller files 0755, units and drop-ins, an install manifest of every installed file hash, daemon-reload, enable the gate and the verify timer, controller init, collect. A failing step prints the rollback command. --rollback refuses (changing nothing) unless the install manifest exists, every managed file still matches it and orders are OFF from every source; it removes the units, drop-ins and mode file, re-checks orders after daemon-reload, then re-enables and restarts nusa.service and the research timer. NUSA_INSTALL_ROOT is refused unless NUSA_INSTALL_TEST_MODE is also set; on the host PATH is fixed."
  - "tests/nusa-control-install.test.js: 10 tests against a temporary tree with stub systemctl, curl, install and controller: read-only preflight, thirteen failing preconditions (manifest mismatch, extra file, symlink, orders missing/duplicated/in a drop-in/in the unit environment, and more) each refusing apply with nothing changed, test-root flag required, the exact step order and file modes plus the install manifest, a release tree changed after the check (before and after the private copy) cannot change what is installed, failure hints, rollback and its three refusals, no write to the runtime env file, no network except local /health. Mutation checks on the private-copy hash check, installing from the copy, the rollback manifest and orders checks, and the test-root flag each fail tests."
not_changed:
  - "Nothing runs on the host by this change. No sudoers rule is installed (the phone button is a later phase); the order switch and the runtime env file are never written; PAPER_ORDERS cannot be selected."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "node --test tests/nusa-control-install.test.js: 7 pass; platform-independence and portability validators pass."
unverified: "Never run on the host. The real systemd behaviour of the gate (the collect restarts nusa.service while holding the controller lock, and the gate runs read-only inside it) is exercised for the first time by --apply; if it fails the units end STOPPED and the rollback restores the old start. Needs a non-author review before the owner runs it."
acceptance:
  - "Non-author review; the owner runs the preflight first and sends its output before any --apply."
