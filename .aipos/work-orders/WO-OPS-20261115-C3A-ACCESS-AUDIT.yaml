id: WO-OPS-20261115-C3A-ACCESS-AUDIT
title: "C3a: read-only access audit workflow (who and what can start, stop or change the PAPER runtime)"
status: READY_FOR_REVIEW
created: 2026-11-15
implementation_branch: claude/c3-access-audit
owner_decision: "2026-11-15: the owner approved proceeding from the code phases to the host check (C3) as soon as C1 and C1b are merged; the audit is the first, read-only step and precedes any install."
objective: "Give the owner and the reviewers one reproducible, read-only picture of accounts, sudo, SSH metadata, timers, cron, runners, polkit, unit drop-ins and file ownership on the PAPER host, so the controller install (C3b) rests on evidence instead of assumptions."
change:
  - "(REWRITTEN AGAIN after the second Codex review, REJECT: raw command output and free-form values were still printed.) The audit is now an embedded Node script that runs a fixed list of read-only commands, PARSES their output and prints only typed records `kind key=value`; no command output is echoed. Each value passes a validator for its type: account names only if the string has the shape AND exists in this host's /etc/passwd or /etc/group; unit names only for the shapes this system uses (runner service names are hashed); paths only from an exact list or strict nusa-prefix patterns; executables from a fixed list; sudo arguments only if they are known command verbs; modes, integers, enums, booleans. Anything else prints as <type:hash8> (comparable, unreadable). Unit properties come from `systemctl show` of a fixed property list (no `systemctl cat`, no Environment, no Description); Environment is never requested. Per-check states OBSERVED, OBSERVED-EMPTY, DENIED, NOT_CHECKED, ERROR (absence of a file is OBSERVED-EMPTY, not DENIED), lists cut at 60 with a truncated record. (earlier text, superseded:) (rewritten after the first Codex review, REJECT for possible secret exposure) The audit is now ONE script with allowlist filters instead of redaction: safe_tokens prints only verbs, wildcards, safe absolute paths, options and unit names (everything else becomes <arg>); sudo rules and the sudo journal go through it; unit text goes through unit_allowlist (allowlisted directives only, Environment values never printed, only variable names, ExecStart without arguments); every check prints one of OBSERVED, OBSERVED-EMPTY, DENIED, NOT_CHECKED, ERROR, TRUNCATED; coverage added for enabled unit files, user units, runner installations by .runner files, ACLs, link targets and namei path permissions, the control units. Residual: a secret that is a bare lowercase word of at most 24 characters would pass safe_tokens; sudoers rules and commands do not carry secrets in that form, and this is stated here instead of hidden."
  - ".github/workflows/oracle-access-audit.yml: workflow_dispatch only, contents read, no checkout, no secrets, runs on the host runner; five steps print metadata only (owner, mode, name, count, hash) and the sudo journal's command verbs; `sudo -n -l` is the only sudo use; everything the runner account cannot read is printed as DENIED and is explicitly NOT evidence of safety."
  - "tests/oracle-access-audit-workflow.test.js: pins manual-only and read-only, no systemctl mutation, no write command, sudo only as `sudo -n -l`, no read of env or key file contents, and the coverage of every start path named in the design."
not_changed:
  - "Nothing runs on the host by this change. The workflow is dispatched only after the non-author review and the merge. No unit, sudoers, key, limit or authority change."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "node --test tests/oracle-access-audit-workflow.test.js: 7 pass: the embedded script is loaded verbatim with injected effects and fed synthetic secrets in every channel (sudo rules, sudo journal, unit properties, file and directory names, passwd, sshd, find, getfacl, timers, runners, polkit); no secret appears in the output, and mutation checks on the account membership rule, the verb allowlist and the unit-variable name rule fail 2, 2 and 1 tests. The first sandbox run found two real leaks in my own first version (runner names, drop-in file names) which are fixed. (older line:) 9 pass, including synthetic secrets (AWS-style key, JWT, base64, hex, mixed words, passwords) through every filter and every status; the audit script also ran end to end in a sandbox without systemd (all outcomes labelled, no secret printed); mutation checks on the token allowlist and the unit environment filter fail 4 and 1 tests;  validate-workflow-action-pins, -inputs and -authority-map pass; the YAML parses."
unverified: "Residual, stated: account and unit NAMES that exist on the host are printed (they are public identifiers); a drop-in or runner name outside the known sets is hashed. The embedded script ran end to end in a sandbox without systemd (all checks labelled, no secret), not yet on the host. Not run on the host. As the runner account it cannot read root-only files (sudoers.d contents, other users' crontabs, the real sshd -T), so a root-owned check remains part of C3b. No non-author review yet."
acceptance:
  - "Non-author review before the PR leaves draft; the first dispatch after the merge is read back by the owner with the findings table."
