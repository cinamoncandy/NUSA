authority_impact: persistence
authority_impact_note: "Removes a destructive delete of durable PAPER state from a presentation fail-closed path. No LIVE, execution, risk, credential or AI-authority change; the explicit repository reset method is unchanged."
objective: "Opus P0-5 ledger replay audit: after update/reconnect/restart, duplicate fill posting = 0, lost canonical fill = 0, unexplained NAV divergence = 0."
finding: "FIRST_UNSAFE_LEDGER_BOUNDARY: startCloudRuntime.clearPaperProjection() called effectivePaperRepository.clear(), which deletes cloud_paper_accounts, cloud_paper_account_history and cloud_paper_fill_ledger. It ran whenever a tick found no dashboard state (stale/missing market data closes the kill switch and clears the provider), when applyToDashboard threw, at startup when the provider was empty, and when an execution result was FAILED. An ordinary market-data gap therefore destroyed canonical PAPER truth; the in-memory loop kept going but the durable ledger lost history and every fill beyond the bounded 1,000 kept in state, and the next restart loaded no account and reset NAV to initial capital. The rest of the ledger path is sound: save() writes the snapshot and the append-only, checksummed fill ledger in one transaction; fill_id is unique and a changed duplicate is refused; processedIdempotencyKeys is never truncated; a writer lease prevents two writers."
scope:
  include:
    - "apps/cloud/src/runtime.ts: clearPaperProjection withholds the dashboard projection only"
    - "tests/cloud-runtime-ledger-preservation.test.js"
acceptance:
  - "An empty dashboard projection on a tick does not call the PAPER repository's clear()."
