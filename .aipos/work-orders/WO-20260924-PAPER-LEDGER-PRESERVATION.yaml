id: WO-20260924-PAPER-LEDGER-PRESERVATION
title: "A PAPER projection gap must never erase the canonical PAPER ledger"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/nusa-repository-j93sd8-ledger-preserve
