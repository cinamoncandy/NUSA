id: WO-OPS-20261114-INDEPENDENT-REVIEW-R2
title: Independent review automation R2 - dispatch-only workflow, read-only Codex on the existing runner, sanitized one-comment output
status: READY_FOR_REVIEW
created: 2026-11-14
implementation_branch: claude/independent-review-r2
owner_decision: "2026-11-14: the owner approved the use of the dedicated ChatGPT account and the nusa-codex-autopilot runner and the comment-only `pull-requests: write` permission ('1 2도 허용'), and accepted that an automatic verdict may count as the non-author review later (R4, not enabled here)."
objective: "Let a collaborator start an automatic non-author review of an exact PR head and get one sanitized comment, without any approval, merge or write authority and without exposing what the reviewer can read on the runner."
evidence:
  design: docs/INDEPENDENT_REVIEW_AUTOMATION_DESIGN_2026-11-14.md
  workflow: .github/workflows/independent-review.yml
  sanitizer: scripts/independent-review-sanitize.js
  prompt: scripts/independent-review-prompt.md
  tests: [tests/independent-review.test.js, tests/workflow-authority-map.test.js]
key_risk: "The repository is PUBLIC and the runner holds the owner's ChatGPT login; a prompt-injected reviewer could try to print something readable there. Review round 1 (REJECT, 1 P0, 2 P1, 2 P2, valid): a regex filter over free text cannot prove nothing is smuggled out, and -s read-only does not hide files from the reviewer. Answer: NO model-written sentence is published. The reviewer may only emit a fixed record (VERDICT, HEAD, COVERAGE, up to 12 lines 'FINDING: P0|P1|P2 CATEGORY path' with a fixed category list and a path from the PR's changed-file list taken from the GitHub API). The record is checked on the runner and AGAIN in the post job with the trusted script from main, findings are de-duplicated and sorted by that code, there are no line numbers and no free text, and the public comment is rendered from fixed sentences. Residual channel: the choice of a few (file, category, severity) tuples, a few bytes per run; the runs are manual. Residual risks NOT removed: the credentials are still readable by the reviewer process on the runner; -s read-only and an empty directory do not isolate the home directory; the cost is that the public comment carries pointers, not explanations (the manual review stays for details). A richer and safer variant needs a reviewer without tool access and without credentials on the runner, for example one API completion call from a hosted job with a key the owner supplies; that is an owner decision."
change:
  - ".github/workflows/independent-review.yml: workflow_dispatch only; select (ubuntu, read; also lists the changed files from the API), review (self-hosted Codex runner, read-only, timeout 1500 s, writes only the reduced record), post (ubuntu, pull-requests write; validates again, renders fixed text, ONE comment per PR and head sha, never a review event)."
  - "scripts/independent-review-prompt.md, scripts/independent-review-sanitize.js, tests, the authority map (select and review: no write; post: pull-requests) and its test."
not_changed:
  - "No schedule or label trigger (R3), no change to CLAUDE.md or the draft rule (R4), no approval, merge, un-draft or required-check change. Audit and Release are untouched."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "tests/independent-review.test.js 19 pass including a 4000-case fuzz that only fixed lines can come out; mutations (skip the changed-file check, skip the category check, no de-duplication and sorting, skip the head check, post the reduced file instead of the rendered text, skip the render step) each fail at least one test; authority-map validator, action pin and input validators pass."
review_round_1: "REJECT at 61b1fa819 (P0 credential-exposure boundary, P1 filter cannot stop in-grammar leaks, P1 no independent validation at post, P2 read-only is not isolation, P2 resource limits). Reworked as described in key_risk; the post job now validates again, a timeout of 1500 s was added; CPU, disk and process limits beyond the host guard memory floor are still not verified."
unverified: "End to end, nothing has run: the codex -o (output last message) flag, `-s read-only` on that runner, runner availability and the account usage limit were not checked, and the workflow has never been dispatched. The first run is a manual dispatch on a docs-only PR, watched by the owner."
acceptance:
  - A non-author review confirms the threat table, that the post job cannot approve or merge, and that the sanitizer cannot be bypassed by output the reviewer controls.
