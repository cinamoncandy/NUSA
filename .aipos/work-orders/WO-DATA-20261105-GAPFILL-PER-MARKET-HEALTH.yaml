trigger: "Issue #2815 comment 6460727724 identified that fillRecentGaps results are logged per market but /health only exposes aggregate status counts, preventing read-only diagnosis of RATE_LIMITED, ERROR, or skipped/deferred gap fills. Fresh main 185c52c22691a5a35b13fe024cb39d810719a833 still has only aggregate ResearchGapFillSummary and aggregate /health sanitation."
objective: "Expose only the most recent actual gap-fill result for each bounded Research market through the existing /health researchGapFill projection so operators can see per-market fixed status, counters, and safe error code."
scope:
  - "researchExperimentOrchestrator.ts: retain a bounded latest-result map per market, with an explicit lastAttemptAt; each actual result updates only its market, a malformed/ambiguous latest result withdraws that market's stale row, and a deferred attempt preserves prior actual observations."
  - "server.ts: independently sanitize at most 20 market entries, strict KRW market identifiers, fixed GapFillResult status codes, non-negative safe integer counters, and optional fixed uppercase error code. Exclude malformed entries and all raw text/unknown fields."
  - "tests/research-gap-fill-health.test.js: cover current per-market outcomes and malformed, duplicate, unsafe, and secret-bearing input rejection at the public /health boundary."
acceptance:
  - "The existing single gap-fill scheduler, cadence, fetch/page bounds, candle writes, source receipts, manifest eligibility, experiment inputs, retries, and persistence semantics do not change."
  - "Each market shows its latest valid actual attempt and timestamp; markets not attempted in a later partial run keep their own older timestamped result, while deferred attempts do not overwrite actual results."
  - "Unknown status, invalid market, duplicate market in one result set, invalid counters, or malformed data do not produce a trusted per-market health row."
  - "The public health response contains no raw exception/message/request or candle data."
  - "The global research validity and sealed-dataset gates are unchanged; display data is not promoted to runtime acceptance or learning evidence."
exclusions:
  - "No database or host mutation, release, restart, deployment, data rewrite, synthetic candle, manifest/provenance change, readiness/risk/security/lease change, or authority change."
  - "No modification to PR #3000 or the separate freshness-cadence PR #2975."
