objective: "Draw a thin ring with 24 ticks behind the island rows in the live 지금 island, plus one 70-degree sweep arc that turns slowly with the island's own phase. Rules: no ring for the still islands (실거래, 선물); with no data the ring is fainter and grey and has no sweep; under reduce-motion (or before the OS answers) the sweep rests at the top and does not turn; the dial invents no value, shows no number and adds no text. Pure geometry and rules live in islandCoreModel.ts (dialGeometry, dialTickSegments, dialSweepStart, dialRingOpacity) with tests."
change:
