id: WO-RISK-20261008-LOSS-LIMIT-COMPARISON-TOOL
title: "Offline consecutive-loss limit 3/4/5 comparison tool (issue 2575 item 5, tooling only)"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
branch: claude/loss-limit-comparison
authority_impact: none
owner_approval: "2026-10-08 in chat ('다 해')"
scope_note: "Read-only offline analysis function with tests. It is not imported by the runtime, changes no threshold and feeds no decision. No runtime effect, no deploy."
objective: "Provide the deterministic comparison issue 2575 item 5 asks for (net PnL, max drawdown, PnL while streak >= 3, opportunity loss, avoided loss, trade count) over a recorded sequence of completed PAPER sells."
scope:
  include:
    - "apps/cloud/src/consecutiveLossLimitComparison.ts: compareConsecutiveLossLimits(sells, limits), Asia/Seoul day via paperTradingDayKey, duplicate and malformed sells ignored, deterministic order."
    - "Tests for divergence of 3/4/5, day reset and win reset, dedupe/ordering/invalid limits."
  exclude:
    - "Any threshold or Risk change (stays 3), any runtime call site, any real result."
limitations:
  - "Counterfactual over a fixed sequence: a blocked sell is assumed never to have happened; later position path-dependence is not modelled. Fees and slippage must already be inside netPnl."
  - "Censoring: the runtime enforces limit 3, so its ledger never holds the sells blocked after the 3rd consecutive loss. Limits 4 and 5 cannot be evaluated from that ledger; the function flags them censored=true. A valid 4/5 comparison needs uncensored shadow/replay outcomes or blocked-candidate records."
  - "Conflicting duplicate order records make the function throw (identical duplicates are deduplicated); out-of-range timestamps are ignored."
  - "No real comparison was produced: completed-sell data lives in the owner-authenticated ledger and is not available to this session. Item 5 stays OPEN until the owner or a runtime export supplies the sequence."
acceptance:
  - "The function is deterministic and covered by tests; the threshold is untouched."
  - "PAPER_ONLY; liveAuthority=NONE; productionMutationAllowed=false; aiAuthority=ZERO_AUTHORITY."
verification_commands:
  - "npx tsc -p tsconfig.json"
  - "node -r ./tests/register-dist.cjs --test dist/apps/cloud/src/consecutiveLossLimitComparison.test.js"
evidence:
  local_validation:
    environment: "Node 22 sandbox (check-runtime and validate:full need Node 24 and are left to CI)"
    commands:
      - "npx tsc -p tsconfig.json -> clean"
      - "node -r ./tests/register-dist.cjs --test dist/apps/cloud/src/consecutiveLossLimitComparison.test.js -> 5 pass, 0 fail"
      - "node -r ./tests/register-dist.cjs --test tests/autopilot-control-plane-wiring.test.js -> 3 pass, 0 fail"
      - "node scripts/validate-{aipos-yaml,repository-truth,safety-architecture,ai-zero-authority,repository-portability,platform-independent-tests}.js -> all ok"
    behaviour_covered: "3/4/5 divergence, KST day reset, win reset, dedupe, ordering, invalid limits, conflicting duplicates, invalid timestamps, censoring flags"
  remaining: "Exact-head CI, independent Audit and Release; a real comparison needs the ledger's completed-sell sequence."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: true
