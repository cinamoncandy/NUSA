checksum_contract:
  algorithm: "migrationRunner computes createHash('sha256').update(`${id}\\n${sql}`).digest('hex')"
  separator_caveat: "The separator in that template literal is a LITERAL backslash followed by 'n', not a newline. It is almost certainly not what the original author intended, but it is baked into every checksum already written to every deployed database, so the formula must never be corrected."
  deployed_value: fd3ed8fe280f054d7f62bf8e1262f3cb37be2d0c2d56b0484016fc4fbf976cb4
  deployed_value_verification: "Computed independently two ways that agree: from the 026 SQL in commit a4661cc20, and by reading back what the current runtime records into schema_migrations on a freshly created database."
  mutated_value_on_main: 1e40cc934186f6bec64a60ed823b4c31d3e1dee59811e9ac85488016c7d2a5bc
owner_authorization: "2026-10-17 in chat the owner chose path A: restore migration 026 to its original bytes and add the column through a new numbered migration, implemented on a new branch with the full validation, review, Audit, Release and deploy chain. A new branch was required because PR 2743 is already merged and closed."
architecture_impact:
  acknowledged: true
  analysis: "Reverts the applied migration 026_research_closed_candles to exactly the SQL the deployed databases already executed, and adds the same volume column through a new migration 031_research_closed_candles_volume expressed as ALTER TABLE ... ADD COLUMN. No table is recreated, no row is rewritten, no schema_migrations record is edited or deleted, and no guard threshold is relaxed. The column definition is unchanged from what the merged branch intended; only its delivery mechanism changes from an in-place edit of applied history to an additive migration."
