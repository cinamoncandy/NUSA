id: WO-OPS-20261116-LINUX-HOST-CONTROL-CI
title: "CI: run the Linux-only host controller and installer tests on Linux"
status: READY_FOR_REVIEW
created: 2026-11-16
implementation_branch: claude/linux-host-control-tests
objective: "The host controller (reads /proc) and its installer (bash) are Linux-only. The main CI runs on Windows, where those tests are skipped (the review of the controller fix found 34 of 43 controller tests and 13 of 14 installer tests skipped), so a change to them was never exercised by CI. Add a Linux job that runs them and fails if any is skipped."
change:
  - ".github/workflows/linux-host-control-tests.yml (new): on pull requests and pushes to main that touch deploy/control, deploy/oracle, the two test files or the workflow itself, run `node --test tests/nusa-control.test.js tests/nusa-control-install.test.js` on ubuntu-latest (Node 24, pinned actions, contents: read, persist-credentials: false). The job fails on any failed test AND on any skipped test, and requires at least one pass."
not_changed:
  - "No build, deploy, release, secret, host action or permission beyond contents: read. No test is changed. The existing CI is untouched."
