id: WO-OPS-20261117-C4-MAINTENANCE-WINDOW
title: "C4: a bounded maintenance window so a release backup is not mistaken for a dead runtime (design first)"
status: READY_FOR_REVIEW
created: 2026-11-17
implementation_branch: claude/maintenance-window-design
owner_decision: "2026-11-17: the owner delegated all decisions and asked for speed after the controller release failed during the host backup. CORE proposes the design; the owner's earlier rules stand: no host step without the owner's terminal paste, and the sudo hand-over is re-applied by the owner once."
objective: "Stop the periodic verify from stopping a healthy collector while a release's long backup step makes /health unanswered, without relaxing any wrong-answer check."
