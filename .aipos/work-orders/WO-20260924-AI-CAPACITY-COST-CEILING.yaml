objective: "Owner directive: stop Cloudflare Workers AI daily free-allocation exhaustion from idling all of Autopilot, without assuming Workers Paid is available, and without turning quota relief into an unlimited-call structure. Generalize (never delete) the #2238 quota-stop into NORMAL/CONSERVE/HARD_STOP AI budget states; classify calls by necessity tier (DETERMINISTIC/CHEAP_JUDGMENT/SIMPLE/COMPLEX/HIGH_UNCERTAINTY/AUTHORITY_REQUIRED); inventory and shadow-benchmark model routing by evidence, not assumption; record completion economics (AI cost/calls/retries per Verified Autonomous Completion); prevent duplicate AI calls on the same task; keep provider-failure classes distinct (daily quota vs rate limit vs future cost-ceiling)."
scope:
