id: WO-20260924-AI-CAPACITY-COST-CEILING
title: "Autopilot AI capacity/cost ceiling removal (owner spec 2026-09-24)"
status: IN_PROGRESS
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: feat/ai-capacity-jev-bounded-admission
parent_work_order: WO-ISSUE-2238-WORKERS-AI-DAILY-QUOTA
authority_impact: none
authority_impact_note: "The current slice adds only a bounded negative coding-admission gate: Jev may abstain from expensive coding inference after verified failure evidence, but cannot authorize code, protected transitions, Audit, Release, merge, secrets, LIVE activity, or any canonical truth. Activation remains disabled pending #2329 SHADOW acceptance/calibration."
objective: "Reduce Autopilot AI capacity/cost waste without expanding authority: retain NORMAL/CONSERVE/HARD_STOP provider truth, then use Jev only as a ZERO_AUTHORITY bounded negative admission gate for verified non-code CI failures so expensive coding inference is skipped when it is demonstrably non-actionable. Preserve deterministic coding, CI, Audit, Release, and merge authority."
scope:
  include:
    - "apps/autopilot/src/aiBudgetState.ts: classifyAiBudgetState(wait, now) -> NORMAL/CONSERVE/HARD_STOP, pure, additive, fails closed on any unrecognized stop reason"
    - "apps/autopilot/src/worker.ts: independent Audit's WAITING_PROVIDER_CAPACITY response carries an additional diagnostic aiBudgetState field; no existing gate changed"
    - "tests/ai-budget-state.test.js"
  exclude_this_slice:
    - "Workers Paid enablement: billing/plan authority remains outside repository and AI authority."
    - "Positive routing authority, automatic model-tier promotion, protected transitions, Audit verdict, Release authorization, merge, secrets, LIVE execution, or portfolio/risk authority."
    - "Expansion beyond verified failure/recovery coding admission until #2329 SHADOW/calibration is accepted."
acceptance:
  - "Provider capacity truth remains fail-closed and unchanged: NORMAL/CONSERVE/HARD_STOP still represents provider availability."
  - "Bounded Jev admission is eligible for canonical gha:<run>:<sha>:(failure|cancelled|timed_out) evidence and does not classify ordinary feature work."
  - "Jev cannot abstain unless GitHub-verified failed job/step metadata exists for the exact run/head; raw logs are never sent."
  - "High-confidence non-code decisions may return JEV_ROUTING_ABSTAINED; CODE/TEST/UNKNOWN, low-confidence, malformed/unavailable Jev, or missing evidence preserve the existing coding path."
  - "Proposal repair attempts do not repeat the same Jev admission call."
  - "Production /coding/propose and the GitHub dispatcher treat JEV_ROUTING_ABSTAINED as successful NO_ACTION with no patch validation/publish/recovery loop."
  - "Activation remains disabled in wrangler until #2329 SHADOW acceptance/calibration."
  - "PAPER_ONLY, liveAuthority=NONE, productionMutationAllowed=false, aiAuthority=ZERO_AUTHORITY remain unchanged."
verification_commands:
  - "node --test tests/ai-budget-state.test.js"
  - "node --test tests/autopilot-dispatch-retry.test.js tests/ai-cloud-runtime.test.js (plus the full autopilot/worker/coding-runner/audit-runner/provider/execution-coordinator suite)"
