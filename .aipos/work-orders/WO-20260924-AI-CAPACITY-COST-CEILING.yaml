    - "Workers Paid enablement: a billing/plan decision outside repository scope and outside AI authority; not performed by this work order. If the owner enables Workers Paid, the existing #2238 daily-reset wait remains correct for the free tier and this classifier already generalizes past it (item 14 of the owner spec: paid capacity removes the free-tier hard stop, not NUSA's own cost/retry/safety controls)."
    - "Model routing tiers (DETERMINISTIC/CHEAP_JUDGMENT/SIMPLE/COMPLEX/HIGH_UNCERTAINTY), call-site inventory instrumentation, shadow benchmarking, failure classification before escalation, retry-evidence requirement, duplicate-inference suppression, and per-completion cost/economics telemetry: all remain from the owner's full spec, tracked here as remaining scope, to be delivered as further small reviewable slices rather than one large change."
acceptance:
