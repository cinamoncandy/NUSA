current_slice:
  name: "Jev-first bounded coding admission"
  status: READY_FOR_REVIEW
  objective: "Use the existing Jev provider as a zero-authority, high-confidence negative admission gate before expensive coding inference on failure/recovery tasks. Jev may only abstain from an expensive coding call for non-code root causes; it cannot authorize code, select a protected transition, merge, release, audit, mutate secrets, or expand LIVE authority."
  scope:
    - "Reuse Jev provider transport with an explicit BOUNDED_ROUTING mode; keep SHADOW behavior unchanged for existing consumers."
    - "Call Jev only for an initial failure/recovery coding admission after exact GitHub run/head verification and bounded failed job/step evidence extraction; raw logs are forbidden."
    - "ABSTAIN only when confidence >= 0.90, safeToAutofix=NO, and rootCause is INFRA/AUTH/RUNNER/FLAKY."
    - "CODE/TEST/UNKNOWN, low-confidence, malformed, unavailable, disabled, unconfigured, or evidence-missing Jev paths preserve the existing coding path; proposal repair retries reuse the initial proceed decision without another Jev call."
    - "The bounded decision never generates a patch and never grants AI authority; deterministic validation/CI/Audit/Release remain authoritative."
  acceptance:
    - "A high-confidence non-code Jev decision backed by verified failed job/step metadata prevents the expensive coding inference call and returns JEV_ROUTING_ABSTAINED."
    - "A high-confidence CODE/TEST decision preserves the existing coding path."
    - "Low confidence, provider failure, missing configuration, and non-eligible feature work preserve the existing coding path."
    - "Existing SHADOW Jev consumers still send mode=SHADOW; bounded admission sends mode=BOUNDED_ROUTING; /coding/propose and dispatcher surface abstention as successful NO_ACTION."
    - "PAPER_ONLY, liveAuthority=NONE, productionMutationAllowed=false, aiAuthority=ZERO_AUTHORITY remain unchanged."
  next_after_this_slice: "Measure observed abstentions/call reduction before expanding bounded routing to model-tier selection. Independent Audit remains a separate authority and is not replaced by Jev."
