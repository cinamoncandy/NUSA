root_cause:
  - "WO-0059 proved the canonical Cloud PAPER writer, but did not prove Android product delivery."
  - "WO-0060A provides the approved scoped mobile session and Android secure-storage prerequisite."
  - "A physical Android release still needs one genuine build-provided stable public HTTPS origin; repository variable NUSA_MOBILE_API_BASE_URL is currently absent/empty, so canonical RC packaging correctly fails closed."
