  - "Require the canonical release origin GET /health to return HTTP 200 and ok=true before release assembly"
  - "Keep Cloud runtime loopback-only and publish it only through the trusted HTTPS bridge pattern"
  - "Keep access credentials in process memory and rotating refresh credentials in Android Keystore-backed secure storage"
  - "Use the same canonical PAPER reads and POST /api/paper-orders boundary already established"
  - "Preserve idempotent PAPER retry semantics, live Upbit PUBLIC quotation feed, explicit abandoned PAPER writer-lease recovery, and truthful connected/offline/error states"
