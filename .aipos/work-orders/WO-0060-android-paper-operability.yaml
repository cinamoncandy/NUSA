root_cause:
  - "WO-0059 proved the canonical Cloud PAPER writer, but did not prove Android product delivery."
  - "WO-0060A now provides the approved scoped mobile session and Android secure-storage prerequisite."
  - "Current main still treats the Cloud/PAPER endpoint as a user-entered setting, so a physical Android install is not yet zero-config for its stable Cloud origin."
  - "The Cloud runtime intentionally remains loopback-only; physical Android reachability must use the trusted named HTTPS bridge rather than binding the runtime publicly."
  - "The original PR #569 predates WO-0060A and contains a duplicate mobile-auth implementation, so it is evidence/input only and must not be merged as-is."
scope:
  - "Consume WO-0060A approved-user mobile sessions as the sole mobile authorization boundary"
  - "Replace production Android dependence on a user-entered PAPER endpoint with one build-provided stable HTTPS origin"
  - "Reject loopback, embedded credentials, path/query/hash state, and temporary trycloudflare.com origins for release packaging"
  - "Keep Cloud runtime loopback-only and publish it only through the existing trusted HTTPS bridge pattern"
  - "Keep access credentials in process memory and rotating refresh credentials in Android Keystore-backed secure storage"
  - "Use the same canonical PAPER reads and POST /api/paper-orders boundary already present on main"
  - "Preserve idempotent PAPER retry semantics and truthful connected/offline/error states"
  - "Produce an exact-head Android RC APK with source SHA and checksum provenance"
  - "Require genuine physical Android evidence for endpoint-free startup, authenticated session, PAPER state visibility, PAPER submit/result/history/portfolio/relaunch behavior and truthful failure states"
architecture_impact:
  acknowledged: true
  analysis: "This successor closes only the Android client-delivery gap. Cloud remains the sole canonical PAPER writer. WO-0060A is reused rather than duplicated. A public HTTPS origin is non-secret deployment configuration embedded at build time, while tunnel credentials remain outside the repository and APK. LIVE and real-money authority remain absent."
