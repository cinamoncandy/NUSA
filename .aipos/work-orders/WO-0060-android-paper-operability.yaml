  - "The original PR #569 predates WO-0060A and contains a duplicate mobile-auth implementation, so it is evidence/input only and must not be merged as-is."
  - "Android debug APKs intended for installation must contain an embedded JS bundle; a Metro-dependent shell is not acceptable physical-device evidence."
