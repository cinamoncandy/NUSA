  - "Produce an exact-head Android RC APK with source SHA, canonical origin, and checksum provenance"
  - "Require genuine physical Android evidence for endpoint-free startup, authenticated session, PAPER state visibility, PAPER submit/result/history/portfolio/relaunch behavior, current visible UI, and truthful failure states"
