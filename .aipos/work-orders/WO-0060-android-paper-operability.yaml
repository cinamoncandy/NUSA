completion_rule: "Do not mark WO-0060 complete merely because Cloud PAPER works or CI passes. Completion requires a current-main Android RC that reaches the approved HTTPS Cloud origin using an approved mobile session and genuine physical-device evidence showing canonical PAPER state, PAPER submit/result/history/portfolio/relaunch behavior, while preserving PAPER_ONLY and zero LIVE authority."
