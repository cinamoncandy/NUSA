requirements:
  - "Define a Capability Deployment Bundle containing capability contract/implementation, strategy/data/feature identities where applicable, model/prompt/tool/policy/config references, artifact hash, and rollback target."
  - "Bind promotion-time artifact hash to the exact runtime artifact hash and fail closed on mismatch or missing hash."
  - "Require rollback to restore a complete previously verified bundle, never a partial component set."
  - "Require compatibility metadata and explicit rollback readiness before promotion recommendation."
  - "Keep promotion recommendation separate from production mutation authority."
  - "Reject unknown, stale, incomplete, or self-referential rollback targets."
  - "Add deterministic validation, focused regressions, and CI enforcement while preserving all existing gates."
