id: WO-0027
title: "Data & Strategy Identity"
status: IN_PROGRESS
owner: nusa
repository: cinamoncandy/NUSA
base_branch: main
base_commit: 2c2319a82f7b3da4be533c2a35934bd85896e415
implementation_branch: agent/data-strategy-identity
objective: "Define canonical, reproducible identities for governed datasets, feature sets, and strategies so research/evaluation/execution cannot confuse same-named but materially different inputs or strategies."
source_of_truth:
  architecture:
    - docs/NUSA_CORE_ARCHITECTURE_PRINCIPLE.md
    - docs/NUSA_AI_ARCHITECTURE_V1.md
    - docs/NUSA_INVESTMENT_KNOWLEDGE_PRINCIPLE.md
    - .aipos/architecture.md
architecture_impact:
  acknowledged: true
  analysis: "WO-0027 implements existing trusted-data provenance, point-in-time correctness, versioning/reproducibility, and canonical strategy identity requirements. It does not grant deployment, production promotion, LIVE mutation, or safety-policy authority."
  references:
    - docs/NUSA_CORE_ARCHITECTURE_PRINCIPLE.md
    - docs/NUSA_AI_ARCHITECTURE_V1.md
    - docs/NUSA_INVESTMENT_KNOWLEDGE_PRINCIPLE.md
    - .aipos/architecture.md
requirements:
  - "Define canonical dataset identity from source/provenance, schema/version, temporal contract, content hash, and immutable snapshot identity."
  - "Define feature-set identity from feature definitions/versions, source dataset identities, availability-time semantics, and canonical hash."
  - "Define strategy identity from definition/genome, parameters, feature/data references, model/tool/capability references, objective/policy version, and canonical hash."
  - "Reject duplicate IDs with divergent canonical content and reject same content under contradictory hashes."
  - "Require event-time, received-time, and model-available-time semantics for point-in-time governed data."
  - "Fail closed when future information can become visible before model-available-time or provenance/content hashes are missing."
  - "Provide deterministic canonicalization/hash functions and machine-readable registry validation."
  - "Add focused regressions and CI enforcement while preserving all existing P0/research gates."
acceptance:
  - "Data & Strategy Identity validator PASS."
  - "Focused identity regression tests PASS."
  - "Canonical identity is deterministic independent of object key ordering."
  - "Point-in-time violations, hash mismatch, duplicate divergent identity, and missing provenance fail closed."
  - "Existing architecture, lifecycle, cross-AI, capability, Champion/Challenger, evidence, drift, and PAPER operational gates PASS."
  - "Full required GitHub CI PASS."
  - "PR merged before Deployment / Rollback begins."
safety:
  live_trading_mutation: prohibited
  production_promotion_mutation: prohibited
  unknown_temporal_state: fail_closed
completion_rule: "Merge + required test/CI PASS. Do not begin Deployment / Rollback before this work order is complete."
