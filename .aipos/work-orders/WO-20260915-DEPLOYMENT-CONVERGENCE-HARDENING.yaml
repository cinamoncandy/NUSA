id: WO-20260915-DEPLOYMENT-CONVERGENCE-HARDENING
title: "Canonical deployment convergence evidence hardening"
status: LOCAL_VALIDATED_CI_PENDING
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
base_commit: 79289f9f33f63e6b699bdbc42863c3e458f782a4
implementation_branch: codex/deployment-convergence-hardening
authority_impact: none
objective: "Remove repository-controlled false deployment failures and require exact-main, step-verified runtime evidence before publishing CONVERGED."
impact:
  profit: "No direct investment-performance claim; restores reliable deployment of verified PAPER/read-only product changes."
  safety: "Fail-closed receipts cannot treat workflow-level success, stale provenance, or missing credential preflight as deployed runtime proof."
  efficiency: "Event-driven wakeups reduce idle convergence latency while a five-minute bounded schedule remains as recovery fallback."
  convenience: "Repository-controlled evidence aging no longer requires manual reruns when valid exact-main runs exceed the first Actions page."
scope:
  - "Use workflow-specific paginated exact-main CI and Cloudflare Deploy evidence."
  - "Wake the existing canonical watchdog on prerequisite workflow completion."
  - "Require credential preflight before final convergence receipt."
  - "Require successful canonical deploy and runtime verification steps, not workflow conclusion alone."
  - "Apply one aggregate retry budget across Android trigger and stable-release failures."
exclusions:
  - "No second queue, scheduler, deployment owner, control plane, or durable journal."
  - "No credential values, account identifiers, LIVE activation, broker mutation, withdrawal, or transfer."
safety:
  operating_mode: PAPER_ONLY
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: true
verification:
  required:
    - "node --test tests/deployment-convergence-watchdog.test.js tests/deployment-rollback-governance.test.js"
    - "pnpm run validate:full"
    - "git diff --check"
  observed:
    focused_tests: "23/23 PASS including credential-preflight exact-main provenance assertions"
    validate_full: "PASS on Node 24.18.0 with architecture, AIPOS, safety, and AI zero-authority gates"
    security_gate: "PASS; raw high/critical 0; secrets 0"
    diff_check: PASS
completion_rule: "Fresh exact-head CI, independent Audit, and Release are required before canonical merge; runtime convergence requires a PASS receipt bound to the protected-main SHA."
