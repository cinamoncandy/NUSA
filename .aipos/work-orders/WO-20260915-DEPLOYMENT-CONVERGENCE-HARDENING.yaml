  interpretation: >-
    The deployed runtime was already at exact protected main. Issue #1461 reported an unhealthy
    Cloudflare baseline, but the credential steps passed and the failure was the provenance search
    failing to find a deploy run that demonstrably exists (run 34673162847, deploy and
    runtime-verification steps both success on exact main). Repository-wide first-page enumeration
    aged out valid evidence as scheduled runs accumulated against a stationary main. This is an
    engineering defect, not BLOCKED_HUMAN, and #1461 must not be closed on this observation alone:
    closure still requires a trusted-main Credential Preflight PASS.
