  - "Different A6 receipts share the cycle allotment; same-family ceiling and near-duplicate suppression cannot be bypassed by caller naming."
  - "A stale concurrent writer cannot append a verdict derived from an obsolete history snapshot."
  - "Malformed/tampered receipt fields, counters, gates, or replay order fail closed."
