  - Do not modify or republish PR 2877; it owns the separate cgroup enforcement guard.
acceptance:
  - Backup cannot execute before exact-source helper digest and installed-helper identity verification.
  - Backup job never downloads or extracts the full release bundle.
  - Release job retains full-bundle verification and the existing governed activation path.
  - Focused tests, build, preflight, full validators, security gate and diff check pass.
  - Fresh CI and non-author review are required before governed integration; runtime improvement remains unverified until deployed.
