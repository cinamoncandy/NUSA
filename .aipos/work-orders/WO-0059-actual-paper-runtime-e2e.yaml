  - "Retry the same idempotency key after restart and prove no second fill is created"
  - "Prove Desktop/read-only projections observe the same canonical PAPER state where environment access permits"
  - "Record exact source commit, runtime configuration class, timestamps, market, order/fill identifiers, and evidence hashes without recording secrets"
architecture_impact:
