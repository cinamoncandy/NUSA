requirements:
  - "Verdict is READY_FOR_HUMAN_REVIEW, SAFE_BLOCK, or UNKNOWN; no verdict grants LIVE or mutation authority."
  - "Require exact 40-hex code revision, exact 64-hex configuration hash, immutable evidence references, and deterministic preflight fingerprint."
  - "Require restore verification PASS, audit replay VALID, read-only broker status PASS, reconciliation MATCH, market-data health HEALTHY, hard-risk PASS, kill-switch INACTIVE, governance state RESTRICTED, operational state SAFE, and capability-surface PASS."
