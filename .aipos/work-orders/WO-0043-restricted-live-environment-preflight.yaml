  - "Safety-critical UNKNOWN/missing/ambiguous evidence returns UNKNOWN and remains fail closed."
  - "Read-only broker transport may be represented only as operator-initiated observational evidence; preflight itself must perform no network dial."
  - "Credential/token/signature/private-key/raw authorization material is prohibited from input/evidence/payloads."
  - "Require existing restricted-live operational-readiness profile semantics including two distinct human approvers for any later activation ceremony, rollback target, expiry, cooldown, exact scope, and zero mutation counters."
  - "Add focused deterministic regressions and source validation; CI uses only synthetic/disconnected evidence."
