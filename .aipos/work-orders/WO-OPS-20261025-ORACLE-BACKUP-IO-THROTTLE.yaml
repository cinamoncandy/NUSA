id: WO-OPS-20261025-ORACLE-BACKUP-IO-THROTTLE
title: "Bound verified Oracle state-backup I/O to protect the PAPER writer lease"
status: LOCAL_VALIDATED_PENDING_FRESH_EXACT_HEAD_CI
owner: nusa-server-automation
repository: cinamoncandy/NUSA
issue: 2770
pull_request: 2874
base_branch: main
base_commit: fa4c3ad43790d4c6b2916582ef2dee0b32b52118
implementation_branch: fix/oracle-backup-io-priority
authority_impact: none
finding: "Oracle release run 40148117124 showed that the mandatory SQLite state backup can contend with the foreground PAPER runtime on the same block device; during the measured incident the PAPER writer lease and listener became unavailable while backup I/O was active."
root_cause: "The existing verified backup performs substantial reads and writes against the persistent state database while the 1 GB Oracle host serves PAPER runtime and startup reads. The prior nice/ionice-only mitigation did not impose a bandwidth bound, and the host block scheduler is none."
scope:
  - "Keep the canonical sqlite-backup.js backup engine, VACUUM INTO, integrity verification, SHA-256 sidecar, retention, and release helper path."
  - "Keep backup topology resolution in the installed root-owned release helper so the first deployment does not require a resolver in the old active release. Require DB and backup destination to resolve to one shared ext4/xfs backing disk; fail closed for unsupported or multi-device filesystems, split disks, remote, layered, or ambiguous topology."
  - "Run only the existing backup operation with low CPU priority and an exact 1,048,576 bytes/second (1 MiB/s) read/write cap in a transient systemd scope."
  - "Bound the backup step at 160 minutes: six full-file Sunday phases at 957 MiB / 0.8 MiB/s require ~119.6 minutes; add 30% and round up to 10 minutes. Bound the whole host job at 180 minutes: add a 15-minute reserve rounded from 11m01s observed non-backup work in successful run 40035259574, then round to 10 minutes. Keep readiness at 300 seconds and activation soak at 180 seconds."
exclusions:
  - "No Oracle deployment, service restart, database mutation, writer-lease reset, backup deletion, or host-helper installation is part of this work order."
  - "Do not change writer lease TTL, heartbeat cadence, ownership predicate, readiness/soak budgets, backup integrity checks, retention policy, or PAPER/LIVE authority."
  - "Do not add another backup engine, scheduler, runtime, or control plane."
evidence:
  - "Read-only Oracle topology inspection resolved /var/lib/nusa/state.sqlite to /dev/sda1 with parent /dev/sda (TYPE=disk); cgroup v2 io controller is available."
  - "Host measurements showed about 0.8 MiB/s under the prior systemd `1M` cap (base-1000 MB/s), while foreground PAPER reads rose from about 10 MiB/s to about 14 MiB/s. The successor uses 1,048,576 bytes/s exactly; throughput under that exact cap remains unmeasured."
  - "The previous ~96-minute estimate omitted repeated full-file integrity/hash/copy phases. Six phases at 957 MiB and prior measured 0.8 MiB/s require ~119.6 minutes. The step timeout adds 30% and rounds to 160 min. The whole-job timeout adds a 15-minute reserve from the successful run's 11m01s observed non-backup legs, then rounds to 180 min. This is a bounded estimate, not runtime acceptance evidence. A fresh read-only stat measured the DB at 958,992,384 bytes (914.57 MiB), below the conservative 957 MiB envelope."
  - "Review found the first new release cannot load a resolver from the previous active release. The successor embeds topology resolution in the exact-matched root-owned helper and does not execute a new resolver from the old release tree."
acceptance:
  - "Focused behavioral tests exercise root-helper topology decisions with stubbed findmnt/lsblk responses, including first-release, unsupported filesystem, and split-disk cases. Tests verify configured byte-rate and timeout contracts; cgroup enforcement is host behavior, and throughput under the exact-byte successor cap is not yet measured."
  - "Existing verified backup integrity, checksum, and retention behavior remains in use."
  - "Node 24.19 preflight, relevant tests, exact-head CI and companion workflows pass; fresh non-author review and governed Audit/Release are required before merge."
  - "After governed merge, a canonical exact-main Oracle release measures backup and foreground runtime together; no runtime acceptance is claimed before that evidence exists."
safety:
  paper_only: true
  liveAuthority: NONE
