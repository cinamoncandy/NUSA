validation: "At predecessor 0d1877e754946af9a38fa1dd16b74ce6f204be9c, Windows coverage found Git Bash could not parse the multiline shell harness passed as a bash -c command-line argument (unterminated quote). The harness now passes the same source over stdin with bash -s. Local result: topology and release workflow tests 29/29; Node 24.19 preflight, build, validate:full, security:gate (0 advisories/0 secrets), bash -n, and diff check PASS. All predecessor receipts are historical; fresh exact-head CI and independent review remain required. Exact-byte capped throughput remains unmeasured."
follow_up:
  scope: "PR #2877 adds a fail-closed cgroup v2 io-controller precondition and an in-scope io.max read-back (applied cap for the backup device must equal 1048576 B/s before node starts) to the backup verb in deploy/oracle/nusa-release-step.sh (systemd-run accepts IO*BandwidthMax without enforcing it when the io controller is absent), corrects runbook wording, and adds regression coverage. Run 40198892768 shows 42m33s before backup and cancellation after ~149m under a 190m outer bound; timing is consistent with outer-budget pressure, but available logs do not establish the initiating cancellation actor. The wal_checkpoint warning is best-effort and is not proven to be the cancellation cause. Successor keeps the isolated backup step at 180 minutes and job at 240 minutes (60-minute pre-backup allowance), with regression coverage."
  base: "main de6cb5d56acfec429659301c9c1ed8b424e7935f (includes merged PR #2874 and exact-source helper artifact proof); synchronized into PR #2877 before the new exact-head validation."
  validation: "After merging protected main de6cb5d56acfec429659301c9c1ed8b424e7935f into the existing PR branch: Node 24.19 preflight PASS; focused oracle-backup-device + oracle-paper-release-workflow 31/31 PASS; build PASS; typecheck PASS; validate:full PASS; security:gate PASS (0 high/critical, 0 secrets); lint PASS with 45 existing warnings and 0 errors; git diff --check PASS. Fresh review identified a documentation P2: runbook wording attributed the prior cancellation to outer-budget pressure despite logs not establishing the initiating actor. The wording is corrected locally to state only observed timing and qualify outer-budget pressure as consistent, not proven. Follow-up focused tests pass 31/31 (Git for Windows bash added to PATH; initial invocation without bash on PATH failed as an environment setup issue), pnpm preflight PASS, AIPOS YAML validation PASS (521 files), and git diff --check PASS. Exact-head CI/review remain pending for the resulting head. No full pnpm test or host acceptance claimed."
  unchanged: "Backup engine semantics, 1048576 B/s cap, 180-minute backup step, 40-minute release job, 300 s readiness, 180 s soak, lease semantics, and all authority invariants. Outer backup job timeout is 240 minutes to include its separately bounded pre-backup work."
  next: "PR #2874 is merged. PR #2877 contains the evidence-based 240m outer backup-job budget while retaining the 180m step cap and separate 40m release job. Publish the evidence-qualified runbook correction as a fast-forward update, then verify fresh exact-head CI and review; keep Draft until formal Validator, Audit and separately authorized Release gates pass. Owner installs the reviewed root-owned helper before the next canonical Oracle release; #2770 closes only after governed exact-main runtime acceptance. No Oracle retry or host mutation before that transition."
