  - node --test tests/oracle-backup-device.test.js tests/oracle-paper-release-workflow.test.js
  - pnpm run preflight
  - git diff --check
validation: "At predecessor 0d1877e754946af9a38fa1dd16b74ce6f204be9c, Windows coverage found Git Bash could not parse the multiline shell harness passed as a bash -c command-line argument (unterminated quote). The harness now passes the same source over stdin with bash -s. Local result: topology and release workflow tests 29/29; Node 24.19 preflight, build, validate:full, security:gate (0 advisories/0 secrets), bash -n, and diff check PASS. All predecessor receipts are historical; fresh exact-head CI and independent review remain required. Exact-byte capped throughput remains unmeasured."
follow_up:
  scope: "PR #2877 adds a fail-closed cgroup v2 io-controller precondition and an in-scope io.max read-back (applied cap for the backup device must equal 1048576 B/s before node starts) to the backup verb in deploy/oracle/nusa-release-step.sh (systemd-run accepts IO*BandwidthMax without enforcing it when the io controller is absent), corrects runbook wording, and adds regression coverage. Run 40198892768 shows 42m33s before backup and cancellation after ~149m under a 190m outer bound; timing is consistent with outer-budget pressure, but available logs do not establish the initiating cancellation actor. The wal_checkpoint warning is best-effort and is not proven to be the cancellation cause. Successor keeps the isolated backup step at 180 minutes and job at 260 minutes with a 20-minute orchestration margin, and explicitly caps the four pre-backup steps at 5/20/25/10 minutes (60 minutes total), with regression coverage."
  base: "main de6cb5d56acfec429659301c9c1ed8b424e7935f (includes merged PR #2874 and exact-source helper artifact proof); synchronized into PR #2877 before the new exact-head validation."
  validation: "At 5e4ea72e4617235aab124be45dc101c1c0c70bcb, six exact-head workflows passed; fresh review found P2 #4374796244 because AIPOS still marked that published repair pending publication. This successor marks the repair current/published and preserves earlier checkpoints as historical. Focused tests 31/31, pnpm run preflight, pnpm run validate, and git diff --check passed. This commit changes head, so successor exact-head checks and review remain pending. No full test suite or host acceptance claimed."
  unchanged: "Backup engine semantics, 1048576 B/s cap, 180-minute backup step, 40-minute release job, 300 s readiness, 180 s soak, lease semantics, and all authority invariants. Outer backup job timeout is 260 minutes: 60-minute bounded preparation, 180-minute backup, and 20-minute orchestration/step-transition margin."
  next: "Keep PR #2877 Draft. After publication, resolve the new PR head dynamically and verify all six exact-head workflows plus fresh non-author review. Then require exact-head Formal Validator ACCEPTED before Independent Audit. Keep Draft; Release, merge, and separately authorized Oracle host acceptance remain distinct gates. #2770 closes only after governed exact-main runtime acceptance; no Oracle retry or host mutation before that transition."
