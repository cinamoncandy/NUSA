implementation_branch: ccr-00277777-hhlnx4
authority_impact: none
finding: "Oracle release run 40148117124 showed that the mandatory SQLite state backup can contend with the foreground PAPER runtime on the same block device; during the measured incident the PAPER writer lease and listener became unavailable while backup I/O was active."
root_cause: "The existing verified backup performs substantial reads and writes against the persistent state database while the 1 GB Oracle host serves PAPER runtime and startup reads. The prior nice/ionice-only mitigation did not impose a bandwidth bound, and the host block scheduler is none."
scope:
  - "Keep the canonical sqlite-backup.js backup engine, VACUUM INTO, integrity verification, SHA-256 sidecar, retention, and release helper path."
  - "Resolve both the canonical state DB and backup directory inside the reviewed root-owned release helper; allow only ext4/xfs on one direct disk (or one partition of it), require both paths to share that disk, and fail closed otherwise."
  - "Run only the existing backup operation with low CPU priority and an exact 1048576 B/s (1 MiB/s) read/write bandwidth cap in a transient systemd scope."
  - "Isolate backup from activation. Keep the backup command capped at 180 minutes: 957 MiB / 0.8 MiB/s * six Sunday full-file phases = ~119.6 minutes; add 30% observed-workload variance = ~155.5 minutes and round up to 180. Bound each pre-backup step to 5 minutes for exact-source recheck, 20 for bounded prune, 25 for exact-source helper proof download, and 10 for helper identity proof (60 minutes total). Keep the backup job at 260 minutes (60 minutes preparation + 180 minutes backup + 20 minutes orchestration/step-transition margin), the separate stage/preflight/activation job at 40 minutes, PAPER readiness at 300 seconds, and activation stability soak at 180 seconds."
exclusions:
  - "No Oracle deployment, service restart, database mutation, writer-lease reset, backup deletion, or host-helper installation is part of this work order."
  - "Do not change writer lease TTL, heartbeat cadence, ownership predicate, readiness/soak budgets, backup integrity checks, retention policy, or PAPER/LIVE authority."
  - "Do not add another backup engine, scheduler, runtime, or control plane."
evidence:
  - "Read-only Oracle topology inspection resolved /var/lib/nusa/state.sqlite to /dev/sda1 with parent /dev/sda (TYPE=disk); cgroup v2 io controller is available."
  - "Host measurements showed about 0.8 MiB/s backup throughput under a 1 MiB/s cap, while foreground PAPER reads rose from about 10 MiB/s to about 14 MiB/s."
  - "The previous ~96-minute estimate omitted repeated full-file integrity/hash/copy phases. Six phases at 957 MiB and 0.8 MiB/s require ~119.6 minutes; adding 30% observed-workload variance gives ~155.5 minutes, rounded to a backup-only 180-minute bound. This is a budgeting model, not proof of runtime throughput or enforcement. The separate mutation/activation job remains 40 minutes. A fresh read-only stat measured the live DB at 958,992,384 bytes (914.57 MiB), below the conservative 957 MiB envelope."
  - "Oracle PAPER Release run 40198892768: backup job 121186042724 started 2026-10-25T13:45:11Z; the backup step started 14:27:44Z and was cancelled at 16:56:46Z (~149 minutes), while the job completed cancelled at 16:58:33Z. The 42m33s pre-backup interval plus a 190-minute job bound is consistent with outer-budget pressure, but available logs do not establish the initiating cancellation actor. The wal_checkpoint(PASSIVE) disk-I/O warning is caught as best-effort in sqlite-backup.js and is not proven to be the cancellation cause. Release mutation was skipped; no verified backup receipt exists."
acceptance:
  - "Focused tests verify the reviewed helper decision logic and command construction: ext4/xfs allowlist, same-disk requirement, fail-closed branches, exact 1048576 B/s cgroup properties, backup-before-release ordering, the 180-minute backup-step budget, all four pre-backup step timeouts and their sum <=60 minutes, and at least 20 minutes of outer-job headroom beyond preparation plus backup. Actual kernel enforcement and throughput remain post-merge host evidence."
  - "Existing verified backup integrity, checksum, and retention behavior remains in use."
  - "Node 24.19 preflight, relevant tests, exact-head CI and companion workflows pass; fresh non-author review and governed Audit/Release are required before merge."
  - "After governed merge, a canonical exact-main Oracle release measures backup and foreground runtime together; no runtime acceptance is claimed before that evidence exists."
