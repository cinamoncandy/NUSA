id: WO-ISSUE-903-EVENT-REPLAY-HARDENING
title: "Issue #903 deterministic development-event replay hardening"
status: VERIFYING
priority: P1
owner: codex
repository: cinamoncandy/NUSA
issue: 903
base_branch: main
base_commit: db9067754e12c2e462579f5b39b0ebc99a182d19
implementation_branch: codex/903-github-event-bridge
objective: "Complete the repository-controlled GitHub event ingress into the existing read-only Autopilot planning and execution spine while preserving deterministic replay and fail-closed runtime evidence."
scope:
  - validate bounded canonical event ids, work ids, event types, revisions, timestamps, and reasons
  - canonicalize processed-event identity ordering
  - provide pure deterministic replay for persisted event histories
  - reject chronology regressions and contradictory/invalid transitions fail-closed
  - deliver main, pull-request, and canonical CI completion events to the existing signed Worker webhook
  - keep missing webhook configuration explicitly INTERFACE_READY rather than claiming autonomous activation
prohibited:
  - live_activation
  - broker_or_order_mutation
  - production_mutation
  - queue_claim_or_merge_side_effects_from_replay
  - weakening_exact_head_or_safety_gates
architecture_impact:
  acknowledged: true
  analysis: "Extends the existing read-only development event boundary with deterministic validation and replay; no second queue, scheduler, merge engine, or mutation path."
  references:
    - apps/desktop/src/cloud/nusaDevelopmentEventOrchestrator.ts
    - apps/desktop/src/cloud/nusaDevelopmentControlPlane.ts
    - apps/desktop/src/cloud/nusaDevelopmentEventOrchestrator.test.ts
    - .github/workflows/autopilot-github-event-bridge.yml
    - scripts/dispatch-github-event-to-autopilot.mjs

event_ingress:
  status: IMPLEMENTED_INTERFACE_READY
  implementation_commit: 53263fb1caffe48632b3a5e4abc43997475ad1b7
  workflow: .github/workflows/autopilot-github-event-bridge.yml
  delivery_script: scripts/dispatch-github-event-to-autopilot.mjs
  target: https://nusa-autopilot.desporin12.workers.dev/github/webhook
  event_sources:
    - push_main
    - pull_request_target
    - workflow_run_canonical_ci_completed_main
  authentication: repository_secret_to_existing_worker_hmac
  missing_secret: INTERFACE_READY_NO_REQUEST
  retry: BOUNDED_TRANSIENT_ONLY
  runtime_activation: PENDING_ARTIFACT_BACKED_EVENT_DELIVERY
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  mutationAllowed: false
acceptance_criteria:
  - malformed identity, revision, timestamp, type, or reason inputs are rejected
  - duplicate delivery remains idempotent without revision increments
  - replay of a valid history is deterministic and pure
  - chronology regressions and invalid transitions fail closed
  - processed event ids serialize in canonical order regardless of delivery order
  - existing control-plane transition behavior remains unchanged
  - GitHub event bridge uses the existing signed webhook and does not create a second queue or executor
  - bridge response authority is checked for liveAuthority NONE, productionMutationAllowed false, and AI ZERO_AUTHORITY
  - focused tests, typecheck, build, lint, architecture, safety, security, AIPOS, and diff checks pass
verification:
  - node --test dist/apps/desktop/src/cloud/nusaDevelopmentEventOrchestrator.test.js
  - pnpm run preflight
  - pnpm run typecheck
  - pnpm run build
  - pnpm run lint
  - pnpm run architecture:check
  - pnpm run ai:architecture
  - pnpm run safety:architecture
  - pnpm run safety:invariants
  - pnpm run security:gate
  - pnpm run aipos:drift
  - pnpm run aipos:conformance
  - pnpm run aipos:provenance
  - git diff --check
  - node --test tests/autopilot-github-event-bridge.test.js
next_on_pass: "Publish through a normal exact-head PR; keep runtime activation and throughput claims fail-closed until artifact-backed event delivery is observed."

