acceptance_criteria:
  - malformed identity, revision, timestamp, type, or reason inputs are rejected
  - duplicate delivery remains idempotent without revision increments
  - replay of a valid history is deterministic and pure
  - chronology regressions and invalid transitions fail closed
  - processed event ids serialize in canonical order regardless of delivery order
  - existing control-plane transition behavior remains unchanged
  - GitHub event bridge uses the existing signed webhook and does not create a second queue or executor
  - bridge response authority is checked for liveAuthority NONE, productionMutationAllowed false, and AI ZERO_AUTHORITY
  - focused tests, typecheck, build, lint, architecture, safety, security, AIPOS, and diff checks pass
