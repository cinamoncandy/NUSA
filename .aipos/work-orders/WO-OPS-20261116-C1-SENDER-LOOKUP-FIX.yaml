id: WO-OPS-20261116-C1-SENDER-LOOKUP-FIX
title: "Controller fix after the first real-host collect failed with SENDER_UNKNOWN, and a re-install path after a rollback"
status: READY_FOR_REVIEW
created: 2026-11-16
implementation_branch: claude/c1-sender-lookup-fix
owner_decision: "2026-11-16: the owner approved the install (--apply) and then the rollback. The install ran, the controller's collect started nusa.service in COLLECT_ONLY, the runtime answered /health, but the controller reported SENDER_UNKNOWN for 20 minutes, safe-stopped everything and the owner approved the rollback. The old start was restored and collection resumed (new build 0bad12e26, COLLECT_ONLY, orders OFF)."
objective: "Make the controller identify the /health sender on the real host, and let the installer run again after that rollback, without loosening any check."
evidence: "Host evidence (owner's terminal and the read-only host diagnose): nusa.service started 23:53:28 UTC, answered /health with 200 every 5 s, was stopped by the controller at 00:13:32 UTC (start ceiling), status showed runtime {ok:false, reason:SENDER_UNKNOWN}, desired STOPPED, attempt null, intent null. Cause (read from the code, NOT proven on the host): the controller looks the server-side socket up in /proc/net/tcp right after connect(); a connection the kernel has completed but the server has not accept()ed yet shows inode 0 and has no owner process, so a runtime that is busy starting is not found."
change:
  - "deploy/control/nusa-control.js: serverSideInodes skips inode 0 rows; hostIdentifiedHealth waits (polls every 20 ms, identification budget 3 s) until exactly one accepted server-side socket exists and only then sends the request, so the owner is still identified BEFORE the request. No owner within the budget, or more than one, is still SENDER_UNKNOWN (fail closed). The failure now carries diag (attempts, waited ms, inodes, holders) so the next failure explains itself. Nothing about the cgroup, build or mode checks changes."
  - "deploy/control/install.sh: new explicit --after-rollback flag (preflight and apply). It accepts exactly the leftovers of a rollback of this script: state STOPPED with no attempt, intent or grant; manifest equals its anchor; the two controller files are the recorded ones; no unit, drop-in or mode file installed. It moves the old state, manifest and anchor aside (state.json.rolled-back-<UTC>, never deleted) and then installs as usual; the new install can be rolled back again. Anything else is refused with nothing changed."
  - "tests/nusa-control.test.js (43): an unaccepted connection (inode 0) is not an owner; REGRESSION with a real child process that blocks its event loop for 800 ms after listen (reproduces the real-host failure; the old code fails it) is identified; a server that accepts later than the budget is an unknown sender; the diagnostics field exists. Mutation checks: no polling, inode 0 counted, unbounded wait each fail tests."
  - "tests/nusa-control-install.test.js (14): the re-install after a rollback works and is itself rollbackable; 14 kinds of damage are refused with nothing changed; the flag on a fresh host is refused. Mutation checks on each state field check, the anchor check, the controller hash check, the unit-absence check and each of the three set-aside moves each fail tests."
not_changed:
  - "No risk limit, threshold, capital, order switch or authority. PAPER_ORDERS is still unrepresentable. No release or host action by this change; a new release is needed before the fixed controller can be installed (the installer copies from the staged release)."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  realOrderAuthority: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "node --test tests/nusa-control.test.js tests/nusa-control-install.test.js pass; AIPOS, platform-independence and portability validators pass."
unverified: "The cause is a reading of the code and the kernel behaviour, not a host measurement; the fix is proven only on a real child process in the sandbox. If collect fails again the diag field in the status output will show why. Never run on the host after the fix."
acceptance:
  - "Non-author review; exact-head CI; a new release only with the owner's approval; the owner runs the preflight with --after-rollback and sends its output before any --apply."
