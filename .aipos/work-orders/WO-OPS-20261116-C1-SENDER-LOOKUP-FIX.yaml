id: WO-OPS-20261116-C1-SENDER-LOOKUP-FIX
title: "Controller fix after the first real-host collect failed with SENDER_UNKNOWN, and a re-install path after a rollback"
status: READY_FOR_REVIEW
created: 2026-11-16
implementation_branch: claude/c1-sender-lookup-fix
owner_decision: "2026-11-16: the owner approved the install (--apply) and then the rollback. The install ran, the controller's collect started nusa.service in COLLECT_ONLY, the runtime answered /health, but the controller reported SENDER_UNKNOWN for 20 minutes, safe-stopped everything and the owner approved the rollback. The old start was restored and collection resumed (new build 0bad12e26, COLLECT_ONLY, orders OFF)."
objective: "Make the controller identify the /health sender on the real host, and let the installer run again after that rollback, without loosening any check."
evidence: "Host evidence (owner's terminal and the read-only host diagnose): nusa.service started 23:53:28 UTC, answered /health with 200 every 5 s, was stopped by the controller at 00:13:32 UTC (start ceiling), status showed runtime {ok:false, reason:SENDER_UNKNOWN}, desired STOPPED, attempt null, intent null. Cause (read from the code, NOT proven on the host): the controller looks the server-side socket up in /proc/net/tcp right after connect(); a connection the kernel has completed but the server has not accept()ed yet shows inode 0 and has no owner process, so a runtime that is busy starting is not found."
change:
  - "deploy/control/nusa-control.js: serverSideInodes skips inode 0 rows; hostIdentifiedHealth waits (polls every 20 ms, identification budget 3 s) until exactly one accepted server-side socket exists and only then sends the request, so the owner is still identified BEFORE the request. No owner within the budget, or more than one, is still SENDER_UNKNOWN (fail closed). The failure carries diag (attempts, waited ms, inodes, holders, /proc read errors told apart from 'no such socket', whether a request was sent) through every failure path (unknown sender, connection or response error) into the final collect START_CEILING detail, so the next failure explains itself; a response that is not a valid health answer (status, unparsable body, wrong build or mode, foreign sender) keeps the record too, with the response status, body-parsed flag and the size in BYTES on the wire (not characters). Nothing about the cgroup, build or mode checks changes."
  - "deploy/control/install.sh: new explicit --after-rollback flag (preflight and apply). It accepts exactly the leftovers of a rollback of this script: state STOPPED with no attempt, intent or grant; manifest equals its anchor; the two controller files are the recorded ones; no unit, drop-in or mode file installed. The state is validated with the controller's own validateState (schema, version, active, adopted, proven, no unknown field, no attempt, no grant), STOPPED, no intent. The install order changed for every install: the controller files and the manifest with its anchor are prepared as *.new from the verified private copy and swapped in TOGETHER by renames (swap_in_install_set), so the manifest always matches the controller files in place (also when the leftovers carry an OLDER controller than the new release) and a rollback works at every later failure point (the rollback checks the managed files that exist and ignores those not installed yet). With --after-rollback the old state, and every old file that is replaced, are moved aside as *.rolled-back-<UTC>-<pid> (never deleted, collision-proof, a silently skipped move counts as a failure) and every step is undone if one fails. If a RESTORE inside that undo fails too, the installer never says 'put back': it prints RECOVERY_REQUIRED with what should be where, exits 3, keeps every moved (*.rolled-back-*) and prepared (*.new) file: undo never DELETES anything, a file that was already renamed into place is renamed back to its *.new name, so the bytes needed for a manual recovery survive and tells the owner not to run --apply or --rollback and to send the output. The new install can be rolled back again. Anything else is refused with nothing changed."
  - "tests/nusa-control.test.js (47): an unaccepted connection (inode 0) is not an owner; REGRESSION with a real child process that blocks its event loop for 800 ms after listen (reproduces the real-host failure; the old code fails it) is identified; a peer not identified within the budget never receives the request (the child server sees none) and is an unknown sender; a /proc read error is told apart from 'no such socket'; the diagnostics reach the final collect failure for an unknown sender and for a connection error. Response diagnostics (status 500, bad JSON, wrong build, wrong mode) reach the collect failure, and the real client records status, body-parsed and size. Mutations (always sending, dropping the diag in either path, shortening the ceiling detail, not counting table errors, no polling, inode 0 counted) each fail tests."
  - "tests/nusa-control-install.test.js (18): the re-install after a rollback works and is itself rollbackable; 14 kinds of damage and 10 kinds of invalid state (schema, version, active, adopted, proven, unknown field, desired, missing fields, an array) are refused with nothing changed; a failing or silently skipped move at each of the five steps puts everything back and the command can be run again; a failing install at every call after the manifest was written can be rolled back; a sweep over pairs of failing moves (each of the 9 forward moves of --after-rollback, pinned by checking that failing a 10th changes nothing and failing the 9th does fail, combined with every later restore up to 9 undo moves; every forward move from the 2nd to the 9th must be covered by at least one failing restore) always ends in RECOVERY_REQUIRED with the moved and prepared files kept (checked BYTE FOR BYTE: the old state, manifest, anchor and controller files, the new controller files, the new manifest and the new anchor all still exist under some name), or in a clean put-back that is verified byte for byte; a re-install with a NEWER controller than the leftovers is swept over every mv and install failure point: each failure either leaves the old leftovers exactly as they were (and the command can be run again) or can be rolled back (this test fails on the previous commit's installer); the flag on a fresh host is refused. Mutations (undo, the skipped-move check, writing the manifest late, a strict rollback, no validateState, no collision check, a leftover temp file, undo not restoring, the aside check, the controller files left out of the swap set, the placed check, ignoring a failed restore, not keeping the .new files on recovery, never reporting RECOVERY_REQUIRED, recording a skipped move) each fail tests; counting characters instead of bytes fails a test; removing the undo's .new cleanup is not distinguishable because the EXIT trap removes the .new files too."
not_changed:
  - "No risk limit, threshold, capital, order switch or authority. PAPER_ORDERS is still unrepresentable. No release or host action by this change; a new release is needed before the fixed controller can be installed (the installer copies from the staged release)."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  realOrderAuthority: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "node --test tests/nusa-control.test.js tests/nusa-control-install.test.js pass; AIPOS, platform-independence and portability validators pass."
unverified: "These tests are Linux-only (they skip on the Windows CI fast gate): they ran on Linux in the sandbox (controller 47 and installer 18 pass, 0 skipped) but the repository CI has no Linux job for deploy/control yet; a separate workflow PR proposes one. The cause is a reading of the code and the kernel behaviour, not a host measurement; the fix is proven only on a real child process in the sandbox. If collect fails again the diag field in the status output will show why. Never run on the host after the fix."
acceptance:
  - "Non-author review; exact-head CI; a new release only with the owner's approval; the owner runs the preflight with --after-rollback and sends its output before any --apply."
