id: WO-LEARNING-20261007-RETIRE-MIXED-BINDING-PERIOD
title: "Retire an unscorable open period whose fills mix candidate bindings, then continue in a fresh period"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
branch: claude/retire-mixed-binding-period
authority_impact: closed-learning-period-lifecycle
owner_approval: "2026-10-07 in chat (option 1: retire the mixed period unscored and start a fresh one)"
objective: "Stop the closed-learning rollover from staying BLOCKED forever on an open period that can never be attributed to a single strategy version."
first_broken_transition: "period close -> CANDIDATE_BINDING_MIXED (observed on /health after the wall-clock rollover reached the reconciler on runtime 82a8920): rollover BLOCKED, cyclesEvaluated=0"
scope:
  include:
    - "PaperRealizedPeriodProducer.inspectOpenPeriodForMixedBinding: read-only, deterministic retirement receipt (reason, retired period id, window, bindings with fill counts, fill ids, whole-ledger fingerprint and fill count, validPerformanceEvidence=false, evidence fingerprint) derived only from the canonical fill ledger; null unless >=2 bindings are in the window."
    - "PaperRealizedPeriodProducer.retireOpenPeriodForMixedBinding: re-derives the receipt and refuses (NOT_MIXED) unless the ledger proves the mix; removes the open period and emits PERIOD_REJECTED(CANDIDATE_BINDING_MIXED) carrying the receipt fingerprint; nothing is closed or scored."
    - "Early detection: the rollover inspects the open period every tick after the canonical-boundary check and retires a proven mix immediately (fills are immutable so it can never become scorable), not only at the trading-day close; the close-time CANDIDATE_BINDING_MIXED failure remains a fallback."
    - "ClosedLearningRolloverScheduler: only when the close fails with code CANDIDATE_BINDING_MIXED and the port exists, retire and return MIXED_BINDING_PERIOD_RETIRED; every other failure stays BLOCKED."
    - "Replacement in the same step: after retirement the scheduler opens closed-learning-mixed-binding-replaced:<index>:<boundary> from the retired plan's own advisory, candidate provenance and market at the canonical account boundary (as the account-replaced path does), so it never depends on realized history (which may be empty or belong to a superseded candidate); the result carries replacementPeriodId and replacementCandidateId."
    - "Runtime and production wiring of the new ports."
  exclude:
    - "The reconciler guard itself (a window may only realize a single binding), evidence requirements, Risk, thresholds, capital, LIVE. No return, fill, cost or PnL is synthesized; the fills stay in the canonical ledger."
acceptance:
  - "Mixed-binding close failure retires the period unscored: no cycle, no evidence identity, no successor in the same tick."
  - "Other close failures and a missing retirement port stay BLOCKED and retire nothing."
  - "A period that is not open cannot be retired."
  - "PAPER_ONLY; liveAuthority=NONE; productionMutationAllowed=false; aiAuthority=ZERO_AUTHORITY."
verification_commands:
  - "npx tsc -p tsconfig.json"
  - "node -r ./tests/register-dist.cjs --test dist/apps/cloud/src/closedLearningRolloverScheduler.test.js dist/apps/cloud/src/paperRealizedPeriodProducer.test.js dist/apps/cloud/src/paperCanonicalOutcomeReconciliation.test.js"
evidence:
  local_validation: "tsc clean; rollover scheduler 28 pass, period producer 14 pass (single binding evaluable; mixed -> deterministic receipt, ledger untouched, no Performance, no double retirement; restart derives the identical receipt; duplicate/stale fills do not distort it), outcome reconciliation 13 pass (Node 22 sandbox)."
  not_done: "The real fills' binding identities live in the server database, which this agent cannot read (all fill endpoints are authenticated), so the exact mix on the current period is confirmed only by the reconciler's CANDIDATE_BINDING_MIXED /health reason until the receipt is emitted after deploy. The receipt is a lifecycle event/fingerprint, not yet a durable table. Root-cause prevention of the mix (a working order of a previous binding filling inside a new window) is not changed here; it is now detected on the next tick instead of at the day close."
  remaining: "Exact-head CI, independent Audit and Release; after merge deploy the exact main SHA and verify the loop leaves BLOCKED, retires the period and opens a fresh owner-baseline period with no synthetic fill/PnL. The retired period's 3 fills are excluded from learning evidence by owner decision."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  fail_closed: true
