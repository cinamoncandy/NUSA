id: WO-OPS-20261019-ORACLE-STABILITY-ROLLBACK
title: "Prevent false Oracle stability rollback and converge Autopilot identity on rollback"
status: VERIFYING
priority: P0
owner: nusa-server-automation
repository: cinamoncandy/NUSA
issue: 2770
base_branch: main
base_commit: 91db289a392f08aaf367cc15bec16f852d2b4edb
implementation_branch: fix/oracle-stability-rollback-2770
authority_impact: none
objective: "Keep the existing 180-second fail-closed Oracle post-activation soak while tolerating bounded startup event-loop stalls after initial readiness, and make rollback converge the existing Autopilot service to the rollback release when that release supports it."
incident:
  release_run: 39242644208
  source_sha: 91db289a392f08aaf367cc15bec16f852d2b4edb
  observed_at_utc: "2026-10-19T11:24:39Z"
  evidence: "Initial authenticated PAPER readiness PASS after 210 attempts, Autopilot readiness PASS, then the first soak readiness probe failed after 3 attempts with phase SUPERVISOR_ACTIVE_LISTENER_BOUND and `readiness request timed out`. Journal showed /ready 200 immediately before/after the failed client window. Canonical rollback restored 83bedc35, but nusa-autopilot.service retained cwd under rejected 91db289a until an explicit bounded restart converged it."
root_cause:
  transition: "initial PAPER+Autopilot readiness -> post-activation stability proof -> rollback convergence"
  cause: "The soak gave authenticated /ready only a 5-second total retry window while retaining a 2-second per-request timeout. The small Oracle host can remain listener-bound but event-loop-stalled longer than that during startup. Rollback then passed legacy_ok=true unconditionally, so a rollback release that already has the canonical Autopilot unit did not restart Autopilot and could leave candidate code resident after current moved back."
  bounded_fix: "Keep 2-second individual probes and the 180-second soak, but give soak /ready a 30-second retry window. Derive rollback legacy mode from whether the rollback release actually contains the canonical Autopilot unit, restarting it for modern releases and preserving legacy compatibility otherwise."
scope:
  - deploy/oracle/nusa-release-step.sh
  - tests/oracle-paper-release-workflow.test.js
  - .aipos/work-orders/WO-OPS-20261019-ORACLE-STABILITY-ROLLBACK.yaml
prohibited:
  - removing_or_short_circuiting_post_activation_stability_soak
  - weakening_authenticated_readiness_or_mobile_route_contract
  - changing_writer_lease_ttl_ownership_or_takeover
  - direct_database_mutation_or_historical_rewrite
  - adding_duplicate_runtime_scheduler_watchdog_or_control_plane
  - live_or_real_authority_expansion
acceptance:
  - initial and post-activation readiness remain authenticated and fail-closed
  - post-activation /ready retry window is exactly 30 seconds and remains inside the 180-second stability soak
  - individual readiness request timeout remains 2 seconds
  - modern rollback release with nusa-autopilot.service restarts Autopilot from the rollback release
  - legacy rollback release without that unit preserves existing disable/remove compatibility
  - exact-head CI and fresh non-author validation pass before Audit/Release
  - after governed merge and reviewed root-helper installation, exact-main Oracle release completes the full 180-second soak without identity drift
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
rollback: "Revert the helper/test commit and reinstall only a reviewed helper. Do not directly edit runtime state or database evidence."
validation: "Natural Oracle PAPER release run 39242644208 reproduced the failure and rollback. Focused helper validation is required before commit; exact-head CI and independent review remain required."
next: "Run focused helper tests, exact-head CI, fresh non-author review, then deterministic Audit/Release. Because nusa-release-step is root-owned outside releases, install the exact merged reviewed helper explicitly before dispatching the next Oracle release."
