follow_up_acceptance:
  - initial and post-activation shared owner-route proof windows are exactly 30 seconds and remain bounded
  - each required owner route still must return HTTP 405; wrong status and timeout fail closed
  - authenticated readiness, per-request timeout, 180-second soak, release identity and rollback semantics remain unchanged
  - patched vite and launch-editor versions clear current high advisories without security-gate exceptions
  - exact-head CI and fresh non-author validation pass before Audit/Release
  - exact-main deployment keeps protected main SHA, PAPER ledger identity, writer ownership, and Autopilot identity continuous
follow_up_validation: "Release 39471191806 failed at the initial mobile_owner_route stage after 15 seconds; exact-source CI, backup, stage, preflight, and exact-main recheck passed. Candidate reached /ready and owner-route checks, then canonical rollback restored 1b4a2429. The prior release passed rollback readiness and Autopilot readiness. Route-proof patch on 0dddbad6 completed focused tests 42/42 and exact-head CI/companions PASS; fresh Codex review identified and this branch corrected an AIPOS next-action mismatch. Exact-head CI on 39514441549 then exposed current high advisories in existing vite 7.3.6 and launch-editor 2.14.1 dependencies; this successor pins patched 7.3.7 and 2.14.2. Local security gate, typecheck, validate:full, AIPOS validators, and focused tests 42/42 PASS. Fresh Codex review of 453ca5a found a P2 because this runbook still documented a 15-second route window; this successor documents initial and soak request/retry settings separately and adds a runbook contract regression. Fresh exact-head CI and review are required."
