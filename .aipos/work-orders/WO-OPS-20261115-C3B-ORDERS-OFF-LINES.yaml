id: WO-OPS-20261115-C3B-ORDERS-OFF-LINES
title: "C3b fix: the install preflight accepts a repeated OFF line in the runtime env file (every mention must be exactly OFF)"
status: READY_FOR_REVIEW
created: 2026-11-15
implementation_branch: claude/c3b-orders-off-lines
objective: "The first run of the preflight on the host (output sent by the owner) failed only the orders-OFF check: /etc/nusa/cloud-runtime.env has the line NUSA_PAPER_ORDER_PATH=OFF twice (both OFF, so orders are off) and the check demanded exactly one line. Replace 'exactly one line' with 'at least one mention, and every mention of the switch in the file, in any spelling, is exactly NUSA_PAPER_ORDER_PATH=OFF'. This is stricter on spellings (indented, export, quoted, commented mentions now fail) and exact on values; it does not loosen any limit."
change:
  - "deploy/control/install.sh orders_off_everywhere(): count every line mentioning NUSA_PAPER_ORDER_PATH and the lines that are exactly NUSA_PAPER_ORDER_PATH=OFF; require at least one and equality. The systemd and drop-in checks are unchanged."
  - "tests/nusa-control-install.test.js (12 tests): the host shape (OFF twice plus other lines) passes preflight, apply and rollback; ON first then OFF, an indented ON, an export ON and a quoted ON after an OFF line all fail. grep -c exit statuses 2 (after printing a matching number) are failures, tested separately for the mentions count and the exact count. Mutation checks (anchored-only count, equality dropped, zero mentions allowed, either grep status ignored) each fail tests."
not_changed:
  - "The manifest sha256 of deploy/control excluding install.sh is unchanged (f0468aba5c3127b28a7ffc322f044dec034ffc442bf71d681dd609cfa7a1422d), so the staged release 0bad12e26 stays the install source. Only install.sh itself changes; it is run from a hash-checked copy outside the release tree. The host env file is never written. No order switch, secret or authority changes."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "node --test tests/nusa-control-install.test.js: 12 pass; AIPOS, platform-independence and portability validators pass."
acceptance:
  - "Non-author review; the owner re-runs the preflight with the reviewed install.sh and sends its output before any --apply."
