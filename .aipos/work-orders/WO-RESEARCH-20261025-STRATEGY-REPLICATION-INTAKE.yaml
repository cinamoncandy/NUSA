id: WO-RESEARCH-20261025-STRATEGY-REPLICATION-INTAKE
title: Strategy Replication-First and Crypto News Research Intake
status: LOCAL_VALIDATED_PENDING_SUCCESSOR_EXACT_HEAD_CI
priority: P1
risk: MEDIUM
authority_impact: none
parent_issue: 2735
branch: feat/research-intelligence-precommit-bridge
base_commit: 4bb02f4655044122a95e3dbb94bba65844c0f0cb
owner_request: "Prioritize learning, reproducing, and validating already-published strategies before inventing new strategies from scratch."
first_broken_transition: scout_strategy_record_to_deterministic_precommitted_replication_candidate
objective: >-
  Reuse NUSA's existing Reference/Research Intelligence, Hypothesis, Precommit, PIT/OOS,
  and Strategy Governance paths to turn public or otherwise owner-authorized external
  strategy evidence into deterministic, provenance-bound replication candidates. External
  reported performance is untrusted metadata; only NUSA's own temporally-correct validation
  may qualify a strategy for governed PAPER consideration.
architecture_references:
  - docs/NUSA_INVESTMENT_KNOWLEDGE_PRINCIPLE.md
  - docs/NUSA_REFERENCE_INTELLIGENCE_PRINCIPLE.md
  - .aipos/architecture.md
  - .aipos/current-mission.yaml
canonical_parent:
  issue: 2735
  note: "Extend the existing external-evidence candidate intake; do not create a second Research Factory, strategy engine, governance engine, scheduler, or canonical state store."
knowledge_contract:
  consumes:
    - FOUNDATIONAL_INVESTMENT_KNOWLEDGE
    - MARKET_KNOWLEDGE
    - external_reference_evidence
  produces:
    - provenance_bound_research_candidate
    - challengeable_learned_knowledge
  rule: "Learning != Authority. External claims are never NUSA performance proof."
scope:
  - Reuse existing SCOUT/Research Intelligence records and external evidence contracts; do not build a new crawler in this work order.
  - Normalize a reproducible external strategy into an explicit versioned StrategySpec or equivalent existing canonical type.
  - Preserve source identity, source locator, publication/update time when available, strategy family, market/instruments, timeframe, data requirements, signal, entry, exit, sizing, risk, rebalance, fee/slippage assumptions, reported metrics, limitations, and evidence fingerprint.
  - Keep observed/source facts separate from inferred interpretation and keep ORIGINAL_STRATEGY separate from POSSIBLE_VARIANT or later NUSA improvements.
  - Mark unknown or absent fields UNKNOWN; never infer missing executable rules merely to make a strategy testable.
  - Fail closed when provenance, deterministic identity, or critical executable rules are missing or contradictory.
  - Derive deterministic canonical strategy identity and deduplicate exact duplicates while retaining family/variant relationships.
  - Bridge accepted StrategySpec into the existing canonical Hypothesis/ResearchPrecommit path before evaluation.
  - Bind precommit identity to source/evidence fingerprint, normalized spec hash, dataset/manifest identity, evaluation plan, cost assumptions, and relevant code/version identity where the existing contract supports them.
  - Reproduce the original strategy first. Improvements, parameter searches, combinations, or AI-generated variants must be separate descendants and must never overwrite the original replication result.
  - Use existing PIT/OOS/walk-forward, stress/adversarial, cost/slippage, Strategy Governance, and PAPER gates instead of creating parallel evaluators or promotion paths.
  - Persist or expose a deterministic replication receipt/result bound to a canonically verified strategy precommit, dataset, evaluator version/source SHA, and timestamp; it distinguishes REPRODUCED, NOT_REPRODUCED, INSUFFICIENT_EVIDENCE, and INVALID_INPUT and preserves adverse evidence without rewriting it.
  - Record replication failures, alpha decay, regime dependence, crowding, transaction-cost destruction, overfitting, look-ahead, survivorship, and data-snooping findings as useful negative evidence.
  - Permit only NUSA-validated candidates to advance toward governed PAPER challenger consideration; no automatic promotion or activation is introduced.
  - Normalize SCOUT crypto news into immutable, fingerprint-verified point-in-time observations with separate observed facts, publisher claims, and advisory inferences; social/rumor or chronology-unknown sources remain unverified.
  - Deduplicate exact reposts using canonical content fingerprint or explicit syndication cluster, while treating uncertain same-publisher/time matches as POSSIBLE_DUPLICATE rather than independent corroboration.
  - Convert news into a canonical ResearchHypothesis and existing ResearchPrecommit only when a verified PIT observation and explicit testable hypothesis/evaluation/cost/capacity assumptions are supplied; never infer a trade or emit an order.
out_of_scope:
  - New external crawling or scraping infrastructure.
  - Reverse engineering or copying proprietary code, binaries, assets, secrets, credentials, or protected expressions.
  - Treating external CAGR, Sharpe, win rate, drawdown, benchmark claims, stars, popularity, or paper conclusions as NUSA validation.
  - Synthetic OHLCV, synthetic volume, history rewriting, fabricated receipts, or filling missing provenance by guesswork.
  - Bypassing issue 2815 candle-provenance correctness or the canonical explicit OHLCV/UPBIT_PUBLIC_CANDLES manifest requirements for real performance claims.
  - Automatic PAPER activation, LIVE trading, real-money mutation, risk relaxation, Deployment Gate bypass, or Risk Governor bypass.
  - Replacing the existing Hypothesis/Precommit/Research/Strategy Governance architecture.
acceptance:
  - A valid reproducible public/authorized strategy record deterministically maps to one normalized strategy identity and one precommitted Research candidate before any evaluation result is known.
  - Missing critical strategy rules, missing/ambiguous provenance, evidence fingerprint mismatch, or contradictory source identity fails closed without guessed defaults; strategy fingerprints are verified against captured source snapshots.
  - The original published strategy is immutable as the replication baseline; variants and improvements receive separate identities and lineage.
  - The same normalized source/spec produces deterministic identity and precommit material; material source/spec changes change the bound identity.
  - Duplicate intake does not create duplicate canonical strategies or duplicate evaluation authority.
  - External reported performance is stored only as attributed claim/evidence metadata and can never satisfy PIT/OOS, governance, or PAPER promotion gates.
  - Candidate evaluation uses existing temporally-correct PIT/OOS or walk-forward controls and includes economically relevant fees/slippage assumptions.
  - Candidate cannot create orders, mutate production state, bypass Strategy Governance/Risk/Deployment gates, or gain authority from external evidence.
  - A news snapshot whose SHA-256 does not match, whose publication time is missing/future, or whose source type is social/rumor cannot become PIT-eligible or produce a precommit.
  - A valid news observation keeps facts, publisher claims, and Scout inferences distinct; only an explicit, complete hypothesis is bridged to the existing ResearchHypothesis and ResearchPrecommit contracts.
  - Duplicate syndicated content does not increase independent corroboration, and uncertain duplicate candidates remain labeled POSSIBLE_DUPLICATE.
  - Replication success and failure are both retained as attributable, challengeable evidence; adverse results are not discarded or rewritten.
  - Actual performance claims remain blocked when canonical dataset/provenance prerequisites are unmet, including unresolved #2815 or explicit OHLCV manifest requirements where applicable.
  - Tests cover valid deterministic intake, missing required rules, ambiguous/missing provenance, fingerprint/spec tamper, duplicate intake, original-vs-variant separation, deterministic output, and high external reported returns that still cannot produce a NUSA pass.
  - Tests cover immutable news snapshot fingerprint, Research Intelligence discovery chronology/PIT, precommit-after-evidence ordering, social/rumor fail-closed behavior, fact/claim/inference separation, duplicate/syndication classification, explicit hypothesis-to-precommit continuity, and rejection of non-PIT observations.
  - Runtime-untrusted source/event/confidence taxonomy values and malformed evidence arrays fail closed rather than reaching PIT or hypothesis classification.
  - Optional StrategySpec metadata is runtime-validated and canonicalized before identity/precommit admission; news transmission channels are trimmed, deduplicated, and sorted before observation identity assignment.
  - Research Intelligence runtime taxonomy values are checked against canonical allowlists by the record factory, including when an untrusted news binding reconstructs a deserialized record; caller-forged source/evidence trust labels cannot become PIT-eligible.
  - Crypto news PIT binding is exposed only on the canonical SQLite Research Intelligence repository, accepts a source record ID rather than a caller-provided record/reader, resolves the row and semantic-provenance overlay internally, and fails closed for an unpersisted caller-created trust claim or unknown ID.
  - A NUSA variant must carry a canonical verified ORIGINAL_STRATEGY parent whose identity matches variantOf; the parent spec is bound into the immutable precommit and revalidated before receipt creation/verification.
  - Strategy/news provenance timestamps are strict calendar-valid, timezone-bearing ISO strings; placeholder fee/slippage assumptions are insufficient for precommit admission.
  - Explicit PIT/OOS evaluation-window boundaries use the same strict timezone-bearing, calendar-valid timestamp contract; impossible dates, date-only strings, and timezone-ambiguous values fail closed.
  - Replication receipt evidence must be a non-empty canonical JSON object; undefined, sparse arrays, accessors, cycles, and non-JSON values fail closed before receipt fingerprinting.
  - Existing PAPER_ONLY and zero-authority safety invariants remain unchanged.
verification_commands:
  - pnpm run build
  - pnpm run typecheck
  - pnpm run validate:full
  - pnpm run security:gate
  - pnpm run lint
  - pnpm test
dependencies:
  parent_issue: 2735
  performance_data_integrity:
    - 2815
    - canonical explicit OHLCV manifest/provenance
  note: "The intake/normalization bridge may be implemented and fixture-tested before real-market dataset gates close, but no real strategy performance success may be claimed from fixture or incomplete provenance."
governance:
  pr_mode: DRAFT_AFTER_LOCAL_VALIDATION
  fresh_non_author_validator_required: true
  audit_release_required_for_merge: true
  self_approval: prohibited
  self_merge: prohibited
  no_ci_as_iterative_debugger: true
safety:
  mode: PAPER_ONLY
  liveAuthority: NONE
  productionMutationAllowed: false
  realOrderAuthority: false
  realTransferAuthority: false
  aiAuthority: ZERO_AUTHORITY
  automaticPromotion: prohibited
  learningEqualsAuthority: false
completion_rule: >-
  Implementation, focused tests, repository validation, exact-head CI, fresh non-author
  validation, and canonical governance must all be truthful. This work order does not prove
  that any collected external strategy is profitable, does not close the closed-learning loop,
  and does not authorize PAPER activation or LIVE trading by itself.
next: >-
  Fresh exact-head review on PR #2878 head c007a0d2fae8c8769322df010263bc93cc3f82f1 found P1: an injected generic reader remained caller-forgeable. The successor removes the trust-promoting binder and precommit API from contracts and exposes them only as methods on the canonical SQLite Research Intelligence repository; the repository accepts a source record ID, resolves the persisted row and semantic-provenance overlay internally, reconstructs the record through the canonical factory, and rejects caller-supplied unpersisted objects or readers. Regression coverage verifies an extra fake-reader argument cannot satisfy lookup. Node 24.19 typecheck passed; focused and full local gates for this successor are pending. Confirm the existing PR #2878 remote identity before publishing one substantive non-force successor; all c007 exact-head receipts become historical. Fresh exact-head CI/review and separate Formal Validator remain pending. Production Scout composition, durable result consumption, and natural end-to-end Research/PAPER evidence remain unverified. Do not advance Draft/governance/release or Oracle runtime for this Research change.
