id: WO-RESEARCH-20261007-RSI-FAMILY
title: "Add an RSI mean-reversion strategy family to the continuous Research experiments"
status: READY_FOR_REVIEW
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
implementation_branch: claude/research-strategy-breadth
authority_impact: none
owner_approval: "2026-10-07 in chat: owner asked to upgrade NUSA as a whole; the agent proposed widening the Research candidate set first (only SMA crossover variants were being tested and every one failed after costs) and the owner replied '1번해'"
objective: "Research tested only four SMA crossover variants, and on 1m/15m/60m every one failed to beat the champion after costs. Widen the hypothesis space with a second, different edge hypothesis (RSI oversold mean reversion) that the existing DSL and backtest engine already support, run under the same walk-forward, holdout, cost and governance gates."
scope:
  - "apps/cloud/src/backtestResearchEvaluator.ts: buildRsiResearchStrategy (RSI_THRESHOLD entry, take-profit, stop-loss and time-limit exits; validated through the existing validateStrategy)."
  - "apps/cloud/src/researchExperimentComposition.ts: a pre-committed RSI grid [14,30], [14,25], [7,20] with a 48-bar time limit, built as extra variants on every bar length (1m/15m/60m) next to the unchanged SMA grid, against the same SMA 5/20 champion proxy."
  - "apps/cloud/src/researchExperimentOrchestrator.ts: an optional per-variant experimentFamilyPrefix, so RSI evidence is recorded under its own experiment family (rsi-research[-Nm]) while every SMA identity stays byte-identical."
  - "tests: the RSI builder and evaluation, the composition running all seven variants with RSI under its own family and SMA identities unchanged."
exclusions:
  - "No change to the DSL, the backtest engine, the cost model, the walk-forward windows, the holdout rules, the candidate gate, Governance, PAPER execution, risk, capital or thresholds. Research never promotes: a passing candidate still only logs that the gate is eligible."
  - "Donchian breakout and Bollinger bands need new DSL rules in the backtest engine; that is a separate, larger change and is not done here."
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
  research_integrity: "The RSI grid and time limit were fixed before any RSI result existed; no parameter is tuned on validation or holdout evidence. Each RSI config has its own config hash, so holdout single-use rules apply to it independently."
rollback: "Revert the change; RSI sessions and evidence remain in the ledger as history and stop growing."
verification_commands:
  - node_modules/.bin/tsc -p tsconfig.json
  - node --test tests/backtest-research-evaluator.test.js tests/research-experiment-composition.test.js tests/research-experiment-orchestrator.test.js tests/cloud-runtime-liveness-health.test.js tests/research-candle-backfill.test.js
residual: "Research work per tick grows from 4 to 7 variants per bar length (still within the 8-variant cap). Whether RSI shows an edge is an empirical question the gates answer; a NO_EDGE result is a valid outcome and no threshold is lowered."
