name: Windows Production Signing

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact immutable commit SHA to package and sign
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-and-verify:
    runs-on: windows-2025
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
      - name: Verify exact source commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ inputs.source_commit }}") { throw "SOURCE_COMMIT_MISMATCH" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify signing credentials are present
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            Write-Error "SIGNING_CREDENTIALS_UNAVAILABLE"
            exit 1
          }
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run release:check
      - name: Generate safety manifest
        run: pnpm run release:manifest
      - name: Validate safe manifest before packaging
        run: node scripts/verify-release-manifest.js release "${{ inputs.source_commit }}" --manifest-only
      - name: Build signed NSIS artifact
        run: pnpm run package:win:production
      - name: Generate artifact checksums and provenance
        run: pnpm run release:artifacts
      - name: Validate source and safety binding
        run: node scripts/verify-release-manifest.js release "${{ inputs.source_commit }}"
      - name: Verify Authenticode independently
        shell: pwsh
        run: .\scripts\verify-windows-authenticode.ps1 -ArtifactDirectory release -ExpectedCommit "${{ inputs.source_commit }}" -WorkflowRunId "$env:GITHUB_RUN_ID"
      - name: Verify signed release gate
        run: pnpm run security:artifacts
      - name: Upload secret-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: nusa-windows-signed-evidence-${{ inputs.source_commit }}
          path: |
            release/*.exe
            release/build-manifest.json
            release/*-checksums.txt
            release/*-SBOM.json
            release/*-verification.json
            release/signing-verification.json
          if-no-files-found: error
