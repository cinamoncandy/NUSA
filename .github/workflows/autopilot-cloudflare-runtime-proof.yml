name: Autopilot Cloudflare Runtime Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-autopilot-cloudflare-runtime.mjs'
      - '.github/workflows/autopilot-cloudflare-runtime-proof.yml'
  push:
    branches: [main]
    paths:
      - 'apps/autopilot/**'
      - 'scripts/verify-autopilot-cloudflare-runtime.mjs'
      - '.github/workflows/autopilot-cloudflare-runtime-proof.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NUSA_AUTOPILOT_URL: https://nusa.desporin12.workers.dev
      NUSA_AUTOPILOT_MAX_RECEIPT_AGE_MS: '180000'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify deployed Worker and fresh scheduled receipt
        run: node scripts/verify-autopilot-cloudflare-runtime.mjs
