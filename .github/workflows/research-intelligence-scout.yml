name: Research Intelligence Scout (advisory)

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-intelligence-scout
  cancel-in-progress: false

jobs:
  discover:
    name: discover-public-research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Discover and structure public research
        run: node scripts/research-intelligence-scout.js --output artifacts/research-intelligence/latest.json
      - name: Upload advisory research receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-intelligence-scout-receipt
          path: artifacts/research-intelligence/latest.json
          if-no-files-found: error
          retention-days: 14
