name: Android Stable Release Trigger

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-stable-release-dispatch-controller
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main release trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for exact-main CI and converge Android stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          printf '%s' "$MAIN_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'

          CI_CONCLUSION=""
          for attempt in $(seq 1 60); do
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [ "$CURRENT_MAIN" != "$MAIN_SHA" ]; then
              echo "Main advanced from $MAIN_SHA to $CURRENT_MAIN; newer trigger will own promotion."
              exit 0
            fi

            CI_SUCCESS=false
            for page in $(seq 1 10); do
              PAGE_RESULT="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$MAIN_SHA&status=completed&per_page=100&page=$page" \
                  --jq '[.workflow_runs | length, ([.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_sha == "'"$MAIN_SHA"'" and .status == "completed" and .conclusion == "success")] | length)] | @tsv'
              )"
              PAGE_COUNT="$(printf '%s' "$PAGE_RESULT" | cut -f1)"
              PAGE_SUCCESS_COUNT="$(printf '%s' "$PAGE_RESULT" | cut -f2)"
              if [ "$PAGE_SUCCESS_COUNT" -gt 0 ]; then
                CI_SUCCESS=true
                break
              fi
              if [ "$PAGE_COUNT" -lt 100 ]; then
                break
              fi
              if [ "$page" -eq 10 ]; then
                echo "::error::Canonical CI evidence exceeded the bounded 1000-run scan for exact main $MAIN_SHA; failing closed."
                exit 1
              fi
            done
            if [ "$CI_SUCCESS" = "true" ]; then
              CI_CONCLUSION="success"
              break
            fi
            sleep 10
          done

          if [ "$CI_CONCLUSION" != "success" ]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [ "$CURRENT_MAIN" != "$MAIN_SHA" ]; then
              echo "Main advanced from $MAIN_SHA to $CURRENT_MAIN; newer trigger will own promotion."
              exit 0
            fi
            echo "::error::Exact-main CI did not complete successfully within the bounded wait; fail closed."
            exit 1
          fi

          # A workflow_run Android release may already be active for this SHA. It is allowed to
          # conclude as a no-op when no checked-in mobile files changed, but the released APK embeds
          # NUSA_BUILD_SHA, so an exact-main stable artifact still requires a workflow_dispatch build.
          # Wait through any active run, then re-check the release target instead of treating
          # "active once" as convergence.
          dispatched=false
          for attempt in $(seq 1 90); do
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [ "$CURRENT_MAIN" != "$MAIN_SHA" ]; then
              echo "Main advanced from $MAIN_SHA to $CURRENT_MAIN; newer trigger will own promotion."
              exit 0
            fi

            RELEASE_TARGET="$(gh release view nusa-android --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
            if [ "$RELEASE_TARGET" = "$MAIN_SHA" ]; then
              echo "Android stable converged to exact main $MAIN_SHA."
              exit 0
            fi

            RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/342016298/runs?branch=main&per_page=50")"
            ACTIVE_ID="$(printf '%s' "$RUNS_JSON" | jq -r --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "pending"))][0].id // empty')"
            if [ -n "$ACTIVE_ID" ]; then
              echo "Waiting for Android Stable Release run $ACTIVE_ID on exact main before re-checking the stable target (attempt $attempt/90)."
              sleep 10
              continue
            fi

            MANUAL_COMPLETED="$(printf '%s' "$RUNS_JSON" | jq -c --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .status == "completed")] | sort_by(.updated_at) | reverse | .[0] // empty')"
            if [ -n "$MANUAL_COMPLETED" ] && [ "$dispatched" = "true" ]; then
              MANUAL_ID="$(jq -r '.id' <<<"$MANUAL_COMPLETED")"
              MANUAL_CONCLUSION="$(jq -r '.conclusion // empty' <<<"$MANUAL_COMPLETED")"
              echo "::error::Android manual exact-main release run $MANUAL_ID concluded $MANUAL_CONCLUSION but stable target remains ${RELEASE_TARGET:-missing}; refusing an unbounded redispatch loop."
              exit 1
            fi

            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            test "$CURRENT_MAIN" = "$MAIN_SHA" || {
              echo "Main changed before dispatch; refusing stale promotion."
              exit 0
            }

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/android-stable-release.yml/dispatches" \
              -f ref=main \
              -F "inputs[source_sha]=$MAIN_SHA"
            dispatched=true
            echo "Dispatched exact-main Android stable build for CI-verified main $MAIN_SHA; waiting for release target convergence."
            sleep 10
          done

          echo "::error::Android stable did not converge to exact main $MAIN_SHA within the bounded wait."
          exit 1
