name: Autopilot Already-Merged Audit Convergence

on:
  repository_dispatch:
    types: [nusa_autopilot_audit]

permissions: {}

concurrency:
  group: already-merged-audit-convergence-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event.client_payload.kind == 'AUDIT_REQUEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      EXPECTED_HEAD: ${{ github.event.client_payload.head_sha }}
      WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
    steps:
      - name: Validate already-merged deterministic Audit request
        id: verify
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const p = event.client_payload || {};
          const fail = (message) => { console.error(message); process.exit(1); };
          if (p.kind !== 'AUDIT_REQUEST') fail('unexpected Audit request kind');
          if (p.repository !== process.env.GITHUB_REPOSITORY) fail('repository mismatch');
          if (!Number.isSafeInteger(p.pr_number) || p.pr_number <= 0) fail('invalid PR number');
          if (!/^[0-9a-f]{40}$/i.test(p.head_sha || '')) fail('invalid exact head SHA');
          if (!Number.isSafeInteger(p.workflow_run_id) || p.workflow_run_id <= 0) fail('invalid CI run id');
          if (p.live_authority !== 'NONE') fail('liveAuthority must remain NONE');
          if (p.production_mutation_allowed !== false) fail('productionMutationAllowed must remain false');
          if (p.ai_authority !== 'ZERO_AUTHORITY') fail('aiAuthority must remain ZERO_AUTHORITY');
          NODE

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          state="$(jq -r '.state' <<<"$pr")"
          merged_at="$(jq -r '.merged_at // empty' <<<"$pr")"
          head="$(jq -r '.head.sha // empty' <<<"$pr")"
          base="$(jq -r '.base.sha // empty' <<<"$pr")"
          base_ref="$(jq -r '.base.ref // empty' <<<"$pr")"
          base_repo="$(jq -r '.base.repo.full_name // empty' <<<"$pr")"
          merge_commit="$(jq -r '.merge_commit_sha // empty' <<<"$pr")"

          if [ "$state" != "closed" ] || [ -z "$merged_at" ] || [ "$head" != "$EXPECTED_HEAD" ] || [ "$base_ref" != "main" ] || [ "$base_repo" != "$GITHUB_REPOSITORY" ]; then
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
            echo "NO_ACTION request is not an exact already-merged PR: state=$state merged_at=${merged_at:-none} expected=$EXPECTED_HEAD head=$head"
            exit 0
          fi

          if [ "$merge_commit" != "$main" ]; then
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
            echo "NO_ACTION merged PR is not current protected main: merge=$merge_commit main=$main"
            exit 0
          fi

          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$main")"
          jq -e --arg head "$EXPECTED_HEAD" --arg base "$base" '
            ([.parents[].sha] | index($head) != null) and
            ([.parents[].sha] | index($base) != null)
          ' <<<"$commit" >/dev/null

          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID")"
          jq -e --arg head "$EXPECTED_HEAD" --arg repo "$GITHUB_REPOSITORY" '
            .name == "CI" and
            .path == ".github/workflows/ci.yml" and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $head and
            .repository.full_name == $repo
          ' <<<"$ci" >/dev/null

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD&event=pull_request&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | [.name, .head_sha] | @tsv' \
            > "$RUNNER_TEMP/nusa-required-exact-head.tsv"

          required_workflows=(
            "CI"
            "Actual PAPER Public-Market Runtime Evidence"
            "Read-only Broker Credential Integration"
            "Restricted LIVE Capability Surface Guard"
            "Restricted LIVE Transport Credential Readiness"
            "Restricted LIVE Activation Rehearsal"
          )
          for required in "${required_workflows[@]}"; do
            awk -F '\t' -v name="$required" -v head="$EXPECTED_HEAD" '$1 == name && $2 == head { found=1 } END { exit found ? 0 : 1 }' \
              "$RUNNER_TEMP/nusa-required-exact-head.tsv" || {
                echo "required exact-head workflow missing or not successful: $required" >&2
                exit 1
              }
          done

          final_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$final_main" = "$main"
          echo 'applicable=true' >> "$GITHUB_OUTPUT"
          echo "main_sha=$main" >> "$GITHUB_OUTPUT"
          echo "Already-merged deterministic Audit provenance PASS: pr=$PR_NUMBER head=$EXPECTED_HEAD base=$base main=$main ci=$WORKFLOW_RUN_ID"
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'

      - name: Require successful exact-main CI
        id: ci
        if: ${{ steps.verify.outputs.applicable == 'true' }}
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        run: |
          set -euo pipefail
          dispatched=false
          for poll in $(seq 1 40); do
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [ "$current_main" != "$MAIN_SHA" ]; then
              echo "Main advanced from $MAIN_SHA to $current_main; newer reconciliation owns convergence."
              echo 'converge=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100")"
            success_id="$(jq -r --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and .conclusion == "success")][0].id // empty' <<<"$runs")"
            if [ -n "$success_id" ]; then
              echo "Exact-main CI SUCCESS for $MAIN_SHA via run $success_id."
              echo 'converge=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            active_count="$(jq -r --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and (.status == "queued" or .status == "pending" or .status == "in_progress"))] | length' <<<"$runs")"
            if [ "$active_count" -gt 0 ]; then
              echo "Waiting for exact-main CI on $MAIN_SHA (poll $poll/40)..."
              sleep 15
              continue
            fi

            failed_count="$(jq -r --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | length' <<<"$runs")"
            if [ "$failed_count" -gt 0 ]; then
              echo "::error::Exact-main CI has no successful attempt for $MAIN_SHA; refusing downstream convergence."
              exit 1
            fi

            if [ "$dispatched" = "false" ]; then
              echo "No exact-main CI run exists yet; dispatching canonical CI for $MAIN_SHA."
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref=main
              dispatched=true
            fi
            sleep 15
          done

          echo "::error::Exact-main CI for $MAIN_SHA did not become successful before timeout."
          exit 1

      - name: Dispatch exact-main convergence
        if: ${{ steps.verify.outputs.applicable == 'true' && steps.ci.outputs.converge == 'true' }}
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$MAIN_SHA" ]; then
            echo "Main advanced from $MAIN_SHA to $current_main; newer reconciliation owns convergence."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/wo-0059-actual-paper-runtime.yml/dispatches" -f ref=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-promote.yml/dispatches" -f ref=main -f "inputs[head_sha]=$MAIN_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-stable-release-trigger.yml/dispatches" -f ref=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/windows-desktop-stable-release.yml/dispatches" -f ref=main

          echo "Reconciled exact-main PAPER/runtime/stable convergence for $MAIN_SHA."
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'
