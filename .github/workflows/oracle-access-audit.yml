name: Oracle Access Audit

# READ-ONLY audit of WHO and WHAT can start, stop or change the PAPER runtime on the host (design v5 C3, step 1). Dispatch by
# hand only. It lists accounts, the runner account's own sudo rules, key and permission METADATA (owner, mode, name; never file
# contents), timers, cron entries (names only), polkit rule files (names only), unit definitions, drop-ins and the effective
# unit environment SOURCES (paths, not values). It never writes, restarts, enables, disables, reads any env, key or token
# file, takes no secrets, checks out no repository code and calls no external service. PAPER only, LIVE NONE.
#
# Limits, stated plainly: this runs as the runner account, so it cannot read root-only files (/etc/sudoers.d contents, other
# users' crontabs, the real sshd configuration). Whatever it cannot read is printed as DENIED and must be checked by the owner
# or by a root-owned audit step in C3; an unreadable item is NOT evidence that it is safe.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-access-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only access audit
    runs-on: [self-hosted, Linux, nusa-paper-host]
    timeout-minutes: 5
    steps:
      - name: Accounts, groups and this runner's own sudo rules
        shell: bash
        run: |
          set +e
          echo "== runner account"; id
          echo "== login-capable accounts (name, uid, shell)"
          awk -F: '$7 !~ /(nologin|false|sync|halt|shutdown)$/ { print $1, $3, $7 }' /etc/passwd
          echo "== members of privileged groups"
          getent group sudo wheel admin adm systemd-journal 2>&1
          echo "== accounts in /home (names only)"; ls -1 /home 2>&1
          echo "== this account's sudo rules (sudo -n -l: lists rules, runs nothing)"
          sudo -n -l 2>&1 | sed -E 's/[0-9a-fA-F]{32,}/[hex]/g' | head -60
          echo "== sudoers files (names, owner, mode only)"
          ls -l /etc/sudoers.d 2>&1 | head -40
      - name: SSH and key metadata (never contents)
        shell: bash
        run: |
          set +e
          echo "== sshd drop-ins and main config (owner, mode, size only)"
          ls -l /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>&1 | head -20
          echo "== per-account .ssh directory and authorized_keys (owner, mode only; number of keys, no key text)"
          for home in /root /home/*; do
            [ -d "$home" ] || continue
            echo "-- $home"
            stat -c '%U:%G %a %n' "$home/.ssh" "$home/.ssh/authorized_keys" 2>&1 | head -4
            if [ -r "$home/.ssh/authorized_keys" ]; then printf 'keys: %s\n' "$(grep -cE '^(ssh|ecdsa|sk-)' "$home/.ssh/authorized_keys" 2>/dev/null)"; else echo "keys: DENIED (not readable by the runner account)"; fi
          done
          echo "== root login and password auth (only if readable; otherwise DENIED)"
          grep -hEi '^\s*(PermitRootLogin|PasswordAuthentication|AllowUsers|AllowGroups)\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>&1 | head -12
      - name: Scheduled and automatic starters (names only)
        shell: bash
        run: |
          set +e
          echo "== system timers"; systemctl list-timers --all --no-pager 2>&1 | head -40
          echo "== cron (names only)"; ls -l /etc/cron.d /etc/cron.daily /etc/cron.hourly /var/spool/cron/crontabs 2>&1 | head -40
          echo "== at queue"; atq 2>&1 | head -5
          echo "== user lingering"; ls -1 /var/lib/systemd/linger 2>&1 | head -10
          echo "== transient units"; systemctl list-units --all --no-pager 'run-*' 2>&1 | head -10
          echo "== runner services (every account that can start workflows on this host)"
          systemctl list-units --all --no-pager 'actions.runner*' 2>&1 | head -10
          ls -d /opt/actions-runner* 2>&1
          echo "== polkit rule files (names only)"; ls -l /etc/polkit-1/rules.d /usr/share/polkit-1/rules.d 2>&1 | head -30
      - name: Runtime units, drop-ins and the sources of their environment
        shell: bash
        run: |
          set +e
          redact() { sed -E 's/(token|secret|password|authorization|api[_-]?key|bearer)[^ ]*/\1=[redacted]/Ig; s/[0-9a-fA-F]{32,}/[hex]/g'; }
          for unit in nusa.service nusa-research.service nusa-research.timer nusa-autopilot.service nusa-health-guard.service nusa-health-guard.timer; do
            echo "== $unit (definition and drop-ins; env FILE PATHS only)"
            systemctl cat "$unit" --no-pager 2>&1 | grep -vE '^\s*#' | grep -vE '^Environment=.*(TOKEN|SECRET|PASSWORD|KEY)' | redact | head -50
            systemctl show "$unit" -p FragmentPath -p DropInPaths -p EnvironmentFiles -p UnsetEnvironment -p Restart -p StartLimitBurst -p StartLimitIntervalUSec -p User -p UnitFileState -p ActiveState 2>&1 | redact
          done
      - name: Ownership and permissions of the control surface (metadata only)
        shell: bash
        run: |
          set +e
          echo "== directories and files"
          stat -c '%U:%G %a %F %n' /opt /opt/nusa /opt/nusa/releases /opt/nusa/current /opt/nusa/bin /opt/nusa/proven /opt/nusa-control /var/lib/nusa /var/lib/nusa-control /etc/nusa /etc/nusa/run-mode.env /etc/systemd/system /run/nusa-paper-activation 2>&1
          echo "== names in /etc/nusa (no contents)"; ls -l /etc/nusa 2>&1 | head -20
          echo "== release helper (hash only)"; sha256sum /opt/nusa/bin/nusa-release-step 2>&1
          echo "== who can write the unit files and drop-in directories"
          find /etc/systemd/system -maxdepth 2 \( -name 'nusa*' \) -printf '%u:%g %m %p\n' 2>&1 | head -40
          echo "== sudo journal: units and verbs run through sudo in the last 3 days (commands only, bounded)"
          journalctl _COMM=sudo --since '-3 days' --no-pager -o cat 2>&1 | grep -E 'COMMAND=' | sed -E 's/.*USER=([^ ;]+).*COMMAND=(.*)/\1 \2/' | sed -E 's/[0-9a-fA-F]{32,}/[hex]/g' | sort | uniq -c | sort -rn | head -30
