name: Autopilot Cloudflare Promote

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: nusa-autopilot-cloudflare-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact CI-verified Worker revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify triggering CI eligibility
        id: gate
        shell: bash
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          printf 'trigger conclusion=%s branch=%s sha=%s\n' "$CI_CONCLUSION" "$CI_HEAD_BRANCH" "$CI_HEAD_SHA"
          if [ "$CI_CONCLUSION" = 'success' ] && [ "$CI_HEAD_BRANCH" = 'main' ] && [[ "$CI_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger is not an eligible successful main CI completion; promotion remains fail-closed.'
          fi

      - name: Checkout exact CI-verified commit
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Verify autopilot deployment-relevant change
        if: steps.gate.outputs.eligible == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ github.event.workflow_run.head_sha }}'
          changed="$(git diff-tree --no-commit-id --name-only -r "${head_sha}^" "${head_sha}")"
          if grep -Eq '^(apps/autopilot/)' <<<"$changed"; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'No autopilot deployment-relevant change in CI-verified commit.'
          fi

      - name: Promote exact verified revision to Cloudflare production branch
        if: steps.gate.outputs.eligible == 'true' && steps.changes.outputs.deploy == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # No-op CI completions need only HEAD and its parent. Fetch full main history
          # only when a deployment-relevant autopilot change actually needs ancestry checks.
          git fetch --unshallow --no-tags origin main
          git fetch origin cloudflare-production
          current_sha="$(git rev-parse origin/cloudflare-production)"

          if [ "$current_sha" = "$HEAD_SHA" ] || git merge-base --is-ancestor "$HEAD_SHA" "$current_sha"; then
            echo "Cloudflare production already contains ${HEAD_SHA}; no promotion needed."
            exit 0
          fi

          if git merge-base --is-ancestor "$current_sha" "$HEAD_SHA"; then
            target_sha="$HEAD_SHA"
          else
            tree_sha="$(git rev-parse "${HEAD_SHA}^{tree}")"
            export GIT_AUTHOR_NAME='nusa-cloudflare-promoter'
            export GIT_AUTHOR_EMAIL='nusa-cloudflare-promoter@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            target_sha="$(printf 'chore(deploy): reconcile Cloudflare production lineage for %s\n' "$HEAD_SHA" | git commit-tree "$tree_sha" -p "$current_sha" -p "$HEAD_SHA")"

            test "$(git rev-parse "${target_sha}^{tree}")" = "$tree_sha"
            git merge-base --is-ancestor "$current_sha" "$target_sha"
            git merge-base --is-ancestor "$HEAD_SHA" "$target_sha"
            echo "Created lineage reconciliation ${target_sha} with exact CI-verified tree ${tree_sha}."
          fi

          git push origin "${target_sha}:refs/heads/cloudflare-production"
          echo "Promoted CI-verified tree from ${HEAD_SHA} as ${target_sha}."

      - name: Record fail-closed authority invariants
        run: |
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'AI authority=ZERO_AUTHORITY'
