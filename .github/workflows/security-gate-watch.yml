name: Security Gate Watch

# Design gap found 2026-10-31: the security gate ran only on push and pull_request, so a newly published advisory (joi 1244009) stayed unseen
# until it failed every open PR at once. This read-only watch runs the same gate on main every day and, when it fails, opens or updates one
# issue so the owner is told before the next PR. It changes nothing in the repository and never waives an advisory.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-gate-watch
  cancel-in-progress: false

jobs:
  watch:
    name: security gate on main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Security gate
        id: gate
        continue-on-error: true
        run: pnpm run security:gate 2>&1 | tee gate-output.txt; exit "${PIPESTATUS[0]}"
      - name: Report a failing gate as one issue
        if: steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Security gate is failing on main"
          BODY="$(printf 'The daily security gate failed on main.\n\nRun: %s\n\nFirst lines of the gate output (no secrets are printed by the gate):\n\n```\n%s\n```\n\nEvery open PR will fail the same check until the advisory is fixed (usually a pnpm override bump in pnpm-workspace.yaml). Do not waive the advisory.' "$RUN_URL" "$(head -n 40 gate-output.txt)")"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
      - name: Fail the run when the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
