name: Autopilot Cloudflare Credential Preflight

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/autopilot/**'
      - '.github/workflows/autopilot-cloudflare-deploy.yml'
      - '.github/workflows/autopilot-cloudflare-runtime-proof.yml'
      - '.github/workflows/autopilot-cloudflare-credential-preflight.yml'
      - '.github/workflows/autopilot-execution-consumer.yml'
  workflow_run:
    workflows: [Autopilot Cloudflare Deploy, Autopilot Cloudflare Runtime Proof]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nusa-cloudflare-credential-preflight
  cancel-in-progress: false

env:
  NUSA_WORKER_HEALTH_URL: https://nusa-autopilot.desporin12.workers.dev/health

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve current protected main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if ! [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Unable to resolve exact current main SHA. Failing closed.'
            exit 1
          fi
          echo "sha=$current_main" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted current main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.main.outputs.sha }}
          fetch-depth: 1

      - name: Verify no untrusted PR code is executed
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          echo 'Preflight is executing trusted current-main code only; PR head is never checked out.'

      - name: Validate Cloudflare credential inputs
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is missing. BLOCKED_HUMAN.'
            exit 1
          fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing or malformed. BLOCKED_HUMAN.'
            exit 1
          fi

      - name: Check Cloudflare API token self-verification (informational only)
        # /user/tokens/verify requires the token to carry a "User Details: Read"-style
        # self-inspection scope that is unrelated to, and not required by, Workers/Containers
        # deployment permissions. A token scoped narrowly to Workers Scripts/Containers Edit can
        # legitimately 401 here while still being fully able to deploy -- this is a documented
        # Cloudflare API characteristic, not evidence the token is invalid. Treating a 401 here as
        # fail-closed produced a false negative that blocked Release even after a real exact-main
        # deploy had already succeeded with this same token. This step is now observational only;
        # the actual authority proof is the functional checks below (Wrangler auth, Containers
        # Read, and -- as the canonical write-authority proof -- an actual successful exact-main
        # deploy plus matching Worker deploymentRevision). A genuinely invalid/revoked token still
        # fails closed there, so removing this step's hard gate does not weaken the boundary.
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)" || true
          RESPONSE="${response:-}" node - <<'NODE'
          let payload = {};
          try {
            payload = JSON.parse(process.env.RESPONSE || '{}');
          } catch {
            console.log('Cloudflare API token self-verify returned a non-JSON response; treating this observational probe as inconclusive and deferring to the functional checks below.');
          }
          if (payload.success === true && payload.result?.status === 'active') {
            console.log('Cloudflare API token status: active (self-verify confirms).');
          } else {
            console.log('Cloudflare API token self-verify was inconclusive or unauthorized for this scoped token; deferring to the functional checks below (Wrangler auth, Containers Read, actual exact-main deploy) as the authority proof.');
          }
          NODE

      - name: Verify configured Cloudflare account is accessible
        run: |
          set -euo pipefail
          response="$(curl -sS --fail-with-body --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")" || {
              echo '::error::Configured Cloudflare account is not accessible with this token. BLOCKED_HUMAN.'
              exit 1
            }
          RESPONSE="$response" EXPECTED_ACCOUNT="$CLOUDFLARE_ACCOUNT_ID" node - <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          const expected = String(process.env.EXPECTED_ACCOUNT || '').toLowerCase();
          const observed = String(payload.result?.id || '').toLowerCase();
          if (payload.success !== true || observed !== expected) {
            console.error('Cloudflare account identity verification failed.');
            process.exit(1);
          }
          console.log('Configured Cloudflare account identity verified.');
          NODE

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Wrangler account authentication
        run: |
          set -euo pipefail
          if ! pnpm dlx wrangler@4.127.1 whoami --config apps/autopilot/wrangler.jsonc >/dev/null 2>&1; then
            echo '::error::Wrangler authentication/account verification failed. BLOCKED_HUMAN.'
            exit 1
          fi
          echo 'Wrangler authenticated against the configured Cloudflare account.'

      - name: Verify non-mutating Containers read access
        run: |
          set -euo pipefail
          if ! pnpm dlx wrangler@4.127.1 containers list --config apps/autopilot/wrangler.jsonc >/dev/null 2>&1; then
            echo '::error::Cloudflare Containers read access failed. Check account targeting and Containers Read permission. Deployment additionally requires Containers Write and remains fail-closed on the actual write operation. BLOCKED_HUMAN.'
            exit 1
          fi
          echo 'Cloudflare Containers read access verified. Containers Write is not inferred from this read-only preflight; the exact-main deploy remains the write-authority proof.'

      - name: Require successful exact-main Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CURRENT_MAIN&status=completed&per_page=100" > /tmp/nusa-main-runs.json
          CURRENT_MAIN="$CURRENT_MAIN" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/nusa-main-runs.json', 'utf8'));
          const expected = process.env.CURRENT_MAIN.toLowerCase();
          const runs = (payload.workflow_runs || [])
            .filter((run) => run?.name === 'Autopilot Cloudflare Deploy'
              && run?.path === '.github/workflows/autopilot-cloudflare-deploy.yml'
              && String(run?.head_sha || '').toLowerCase() === expected)
            .sort((a, b) => Number(b?.id || 0) - Number(a?.id || 0));
          if (runs.length === 0) throw new Error(`No completed Cloudflare deploy exists for current main ${expected}`);
          const latest = runs[0];
          if (latest.status !== 'completed' || latest.conclusion !== 'success') {
            throw new Error(`Latest exact-main Cloudflare deploy is not successful: ${latest.id} ${latest.status}/${latest.conclusion}`);
          }
          console.log(`Exact-main Cloudflare deploy PASS: ${latest.id}`);
          NODE

      - name: Require live Worker revision equals exact current main
        env:
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 20 "$NUSA_WORKER_HEALTH_URL" > /tmp/nusa-worker-health.json
          CURRENT_MAIN="$CURRENT_MAIN" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/nusa-worker-health.json', 'utf8'));
          const expected = process.env.CURRENT_MAIN.toLowerCase();
          const deployed = String(health.deploymentRevision || '').toLowerCase();
          if (deployed !== expected) throw new Error(`Worker deploymentRevision mismatch: expected=${expected} actual=${deployed || 'unknown'}`);
          if (health.liveAuthority !== 'NONE' || health.productionMutationAllowed !== false || health.aiAuthority !== 'ZERO_AUTHORITY') {
            throw new Error('Worker safety invariants are not fail-closed');
          }
          console.log(`Worker exact-main runtime baseline PASS: ${deployed}`);
          NODE

      - name: Open or refresh canonical P0 Release blocker on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          marker='<!-- nusa-cloudflare-credential-preflight-p0 -->'
          issue_number="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq ".[] | select((.pull_request|not) and (.body // \"\" | contains(\"$marker\"))) | .number" | head -n 1)"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          $marker
          Refs #903

          Cloudflare deployment/runtime baseline is unhealthy. Release must remain serialized until the trusted preflight proves all of the following on current main:
          - API token exists and is active;
          - configured Cloudflare account identity is accessible and exact;
          - Wrangler authenticates against the configured account;
          - non-mutating Containers Read succeeds;
          - actual exact-main deploy succeeds, which remains the proof for required write authority;
          - canonical Worker /health deploymentRevision equals exact current main;
          - fail-closed authority invariants remain NONE / false / ZERO_AUTHORITY.

          Current-main observation: ${CURRENT_MAIN:-unresolved}
          Classification: BLOCKED_HUMAN when credentials/account permissions are invalid.
          This issue is maintained by the trusted current-main preflight workflow. No PR comment can override it.
          EOF
          if [ -n "$issue_number" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -f state='open' -f title='P0: Cloudflare deployment credential/runtime baseline unhealthy' -F body=@"$body_file" >/dev/null
            echo "Canonical Cloudflare P0 blocker active: #$issue_number"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title='P0: Cloudflare deployment credential/runtime baseline unhealthy' -F body=@"$body_file" >/tmp/nusa-created-blocker.json
            echo "Canonical Cloudflare P0 blocker created: #$(node -p "require('/tmp/nusa-created-blocker.json').number")"
          fi

      - name: Close canonical P0 Release blocker after trusted-main recovery
        if: ${{ success() && github.event_name != 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- nusa-cloudflare-credential-preflight-p0 -->'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select((.pull_request|not) and (.body // \"\" | contains(\"$marker\"))) | .number" | while read -r issue_number; do
            [ -n "$issue_number" ] || continue
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -f state='closed' >/dev/null
            echo "Closed recovered Cloudflare P0 blocker #$issue_number"
          done

      - name: Record fail-closed preflight evidence
        if: always()
        env:
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          echo "currentMain=${CURRENT_MAIN:-unknown}"
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'AI authority=ZERO_AUTHORITY'
