name: WO-0060B Canonical Android RC

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/prepare-mobile-build-config.js"
      - ".github/workflows/wo-0060b-canonical-android-rc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wo-0060b-canonical-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-android-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Generate canonical mobile build configuration
        env:
          NUSA_MOBILE_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/prepare-mobile-build-config.js
      - name: Verify generated origin contains no temporary or loopback host
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'export const CANONICAL_NUSA_ORIGIN = "https://' apps/mobile/src/generatedBuildConfig.ts
          ! grep -E 'localhost|127\.0\.0\.1|trycloudflare\.com' apps/mobile/src/generatedBuildConfig.ts
      - name: Probe canonical NUSA Cloud health
        env:
          NUSA_MOBILE_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: |
          node <<'NODE'
          (async () => {
            const origin = new URL(process.env.NUSA_MOBILE_API_BASE_URL);
            const healthUrl = new URL('/health', origin);
            const response = await fetch(healthUrl, {
              redirect: 'manual',
              signal: AbortSignal.timeout(15000),
              headers: { 'user-agent': 'nusa-wo-0060b-origin-probe' }
            });
            if (response.status !== 200) {
              throw new Error(`canonical NUSA /health expected 200, received ${response.status}`);
            }
            if (new URL(response.url).origin !== origin.origin) {
              throw new Error('canonical NUSA /health changed origin');
            }
            const body = await response.json();
            if (body?.ok !== true) {
              throw new Error('canonical NUSA /health did not report ok=true');
            }
            console.log(`[wo-0060b] canonical NUSA health PASS ${origin.origin}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - name: Assemble canonical exact-head Android RC
        run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
      - name: Seal RC provenance
        shell: bash
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "app-release.apk" > "$OUT/app-release.apk.sha256"
          cat > "$OUT/wo-0060b-provenance.json" <<EOF
          {"sourceSha":"$NUSA_BUILD_SHA","runNumber":"$NUSA_BUILD_NUMBER","runId":"$NUSA_RUN_ID","apkSha256":"$SHA256"}
          EOF
      - name: Upload canonical Android RC
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-wo-0060b-canonical-android-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/mobile/android/app/build/outputs/apk/release/wo-0060b-provenance.json
          if-no-files-found: error
          retention-days: 14
