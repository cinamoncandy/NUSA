name: Health Watch Dead-man

# Design v5, C5: the watch itself is watched. The Health Watch (every 30 minutes) opens an issue when the PAPER host is wrong, but if the watch stops
# running nobody hears anything. This job reads the completion time of the newest finished Health Watch run through the GitHub API and opens or updates ONE
# issue when that run is older than the limit in scripts/health-watch-deadman-decide.js (120 minutes) or when no run exists. Read-only: it changes no
# file, calls no external service, uses no secret and never touches the host. The issue text is fixed; only a short reason code and the run URL reach it.
# Limit of this design: both workflows depend on GitHub's scheduler. It catches a watch that was disabled, broken or starved, not a GitHub-wide outage.
# PAPER only, LIVE NONE, AI ZERO_AUTHORITY.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: health-watch-deadman
  cancel-in-progress: false

jobs:
  deadman:
    name: is the Health Watch still running
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Read the newest finished Health Watch run and decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LAST="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/health-watch.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].updated_at // ""' 2>/dev/null || true)"
          RESULT="$(node scripts/health-watch-deadman-decide.js "$LAST" 2>/dev/null)" || RESULT="CONFIG_INVALID decision_script_failed"
          echo "alert=${RESULT%% *}" >> "$GITHUB_OUTPUT"
          echo "reason=${RESULT#* }" >> "$GITHUB_OUTPUT"
          echo "$RESULT"
      - name: Report one issue
        if: steps.decide.outputs.alert != 'NONE'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ steps.decide.outputs.alert }}
          REASON: ${{ steps.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$ALERT" in
            WATCH_SILENT) TITLE="Health Watch has stopped running (the watch itself is silent)";;
            WATCH_NEVER_RAN) TITLE="Health Watch has no finished run (the watch itself is silent)";;
            *) TITLE="Health Watch dead-man check is misconfigured";;
          esac
          BODY="$(printf 'Dead-man result: %s (%s).\n\nRun: %s\n\nThe Health Watch workflow (every 30 minutes) has not finished a run within the limit, or the check could not read it. Open Actions, Health Watch: is it enabled, failing or starved? This check is read-only and changes nothing. Close this issue when the Health Watch runs again.' "$ALERT" "$REASON" "$RUN_URL")"
          find_existing() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .title == \"$TITLE\") | .number" | awk 'NR == 1'
          }
          EXISTING="$(find_existing)"
          if [ -z "$EXISTING" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="$BODY" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$EXISTING/comments" -f body="$BODY" >/dev/null
          fi
