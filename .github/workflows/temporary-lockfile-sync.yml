name: Temporary Lockfile Sync

on:
  push:
    branches:
      - nusa/provider-neutral-coding-dispatch-v2
    paths:
      - package.json
      - .github/workflows/temporary-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nusa/provider-neutral-coding-dispatch-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "nusa-lockfile-sync"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile"
          git push origin HEAD:nusa/provider-neutral-coding-dispatch-v2
