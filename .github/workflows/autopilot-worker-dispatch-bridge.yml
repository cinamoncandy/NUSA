name: Autopilot Worker Dispatch Bridge

on:
  repository_dispatch:
    types: [nusa_autopilot_execution]

permissions:
  contents: read
  id-token: write

concurrency:
  group: autopilot-worker-bridge-${{ github.event.client_payload.dedupe_key }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.client_payload.kind == 'REPOSITORY_AUTOPILOT' && github.event.client_payload.head_sha == github.sha && !contains(github.event.client_payload.reason, 'gha:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fail-closed payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node - <<'NODE'
          const p = JSON.parse(process.env.PAYLOAD);
          const fail = (m) => { throw new Error(m); };
          if (p.repository !== process.env.GITHUB_REPOSITORY) fail('repository mismatch');
          if (!/^[0-9a-f]{40}$/i.test(p.head_sha || '')) fail('invalid head_sha');
          if (!Number.isSafeInteger(p.workflow_run_id) || p.workflow_run_id <= 0) fail('invalid workflow_run_id');
          if (!/^[A-Za-z0-9_.:-]{1,160}$/.test(p.execution_id || '')) fail('invalid execution_id');
          if (!/^[A-Za-z0-9_.:-]{1,256}$/.test(p.dedupe_key || '')) fail('invalid dedupe_key');
          if (p.live_authority !== 'NONE') fail('live authority forbidden');
          if (p.production_mutation_allowed !== false) fail('production mutation forbidden');
          if (p.ai_authority !== 'ZERO_AUTHORITY') fail('AI authority forbidden');
          NODE

      - name: Verify current main identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested='${{ github.event.client_payload.head_sha }}'
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current" = "$requested"

      - name: Dispatch to Cloudflare Worker with GitHub OIDC
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          NUSA_CODING_RUNNER_URL: https://nusa.desporin12.workers.dev/coding/execute
        run: |
          node - <<'NODE'
          const p = JSON.parse(process.env.PAYLOAD);
          const request = {
            kind: p.kind,
            repository: p.repository,
            headSha: p.head_sha,
            workflowRunId: p.workflow_run_id,
            reason: p.reason,
            executionId: p.execution_id,
            dedupeKey: p.dedupe_key,
            mutationAllowed: false,
            liveAuthority: 'NONE',
            productionMutationAllowed: false,
            aiAuthority: 'ZERO_AUTHORITY',
          };
          (async () => {
            const oidcUrl = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nusa-autopilot`;
            const oidcResponse = await fetch(oidcUrl, { headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
            if (!oidcResponse.ok) throw new Error(`GITHUB_OIDC_HTTP_${oidcResponse.status}`);
            const oidc = await oidcResponse.json();
            if (typeof oidc.value !== 'string' || !oidc.value) throw new Error('GITHUB_OIDC_TOKEN_MISSING');
            const response = await fetch(process.env.NUSA_CODING_RUNNER_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${oidc.value}`,
                'content-type': 'application/json',
                'x-nusa-execution-id': request.executionId,
                'x-nusa-dedupe-key': request.dedupeKey,
              },
              body: JSON.stringify(request),
            });
            const body = await response.text();
            console.log(`worker_http=${response.status}`);
            if (!response.ok) throw new Error(`WORKER_HTTP_${response.status}:${body.slice(0,300)}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
