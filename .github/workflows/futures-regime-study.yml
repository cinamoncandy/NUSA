name: Futures Regime Study

# Evaluation step of the pre-registered futures regime long/short research (docs/RESEARCH_PREREG_2026-10-14_FUTURES_REGIME_LONG_SHORT.md).
# Dispatch by hand only, once, after the history manifest is committed and deployed. It runs the reviewed script
# scripts/run-futures-regime-study.js FROM THE DEPLOYED RELEASE on the PAPER host (no repository checkout, no third-party action, no
# secret): it re-fetches the public history in memory, refuses unless every hash matches the committed manifest, refuses if a holdout
# result is already committed, and prints the report as an annotation. It writes no file, places no order and changes nothing on the
# host. PAPER only, LIVE NONE.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: futures-regime-study
  cancel-in-progress: false

jobs:
  evaluate:
    name: Verify the frozen history and evaluate the pre-registered rule
    runs-on: [self-hosted, Linux, nusa-paper-host]
    timeout-minutes: 20
    steps:
      - name: Re-fetch (public GET only), verify hashes, evaluate, print the report
        shell: bash
        run: |
          set +e
          script=/opt/nusa/current/scripts/run-futures-regime-study.js
          [ -f "$script" ] || { echo "::error::the deployed release does not contain scripts/run-futures-regime-study.js (deploy first)"; exit 1; }
          out="$(ionice -c3 nice -n19 node "$script" 2>&1)"
          status=$?
          printf '%s\n' "$out"
          body="$(printf '%s' "${out:0:3500}" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=futures-regime-study status=${status}::${body}"
          exit "$status"
