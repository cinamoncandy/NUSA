name: Android Touch Visual QA

on:
  push:
    branches:
      - qa/android-touch-visual-20260906
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-touch-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-touch-visual:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip android-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708
      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n nusa_ui_qa -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
      - name: Install dependencies and build exact debug APK
        shell: bash
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node scripts/prepare-mobile-build-config.js
          chmod +x apps/mobile/android/gradlew
          chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          cd apps/mobile/android
          ./gradlew :app:assembleDebug -PnusaEmbedDebugBundle
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.android.bundle'
      - name: Boot native Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chown root:kvm /dev/kvm 2>/dev/null || true
          sudo chmod 660 /dev/kvm 2>/dev/null || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd nusa_ui_qa -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size
          adb shell wm density
          adb shell getprop ro.build.version.release
      - name: Install and launch NUSA
        shell: bash
        run: |
          set -euo pipefail
          adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm clear com.nusa.mobile.preview
          adb shell am start -W -n com.nusa.mobile.preview/com.nusa.mobile.MainActivity
          sleep 4
      - name: Exercise real Android touch targets and capture visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/android-visual
          cat > "$RUNNER_TEMP/android_ui.py" <<'PY'
          import re, subprocess, sys, time, xml.etree.ElementTree as ET
          out = sys.argv[1]
          needle = sys.argv[2] if len(sys.argv) > 2 else ""
          subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(["adb","pull","/sdcard/window.xml",out], check=True, stdout=subprocess.DEVNULL)
          if needle:
              root = ET.parse(out).getroot()
              for n in root.iter("node"):
                  a=n.attrib
                  hay=" | ".join([a.get("text",""),a.get("content-desc",""),a.get("resource-id","")])
                  if needle in hay:
                      m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",a.get("bounds",""))
                      if m:
                          x1,y1,x2,y2=map(int,m.groups())
                          print(f"{(x1+x2)//2} {(y1+y2)//2}")
                          sys.exit(0)
              sys.exit(2)
          PY
          dump_capture() {
            local name="$1"
            adb exec-out screencap -p > "qa/android-visual/${name}.png"
            python3 "$RUNNER_TEMP/android_ui.py" "qa/android-visual/${name}.xml"
          }
          tap_match() {
            local needle="$1"
            local coords=""
            for attempt in 1 2 3; do
              if coords="$(python3 "$RUNNER_TEMP/android_ui.py" "$RUNNER_TEMP/window.xml" "$needle")"; then break; fi
              sleep 1
            done
            test -n "$coords"
            adb shell input tap $coords
            sleep 2
          }
          swipe_up() { adb shell input swipe 540 1800 540 500 450; sleep 1; }

          {
            echo "source_sha=${GITHUB_SHA}"
            echo "device=$(adb shell getprop ro.product.model | tr -d '\r')"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "size=$(adb shell wm size | tr -d '\r')"
            echo "density=$(adb shell wm density | tr -d '\r')"
          } > qa/android-visual/report.txt

          dump_capture 00-entry
          tap_match "Start personal mode"
          dump_capture 01-home
          tap_match "OBSERVE"
          dump_capture 02-markets
          tap_match "PAPER"
          dump_capture 03-paper-top
          swipe_up; swipe_up; swipe_up
          dump_capture 04-paper-lower
          tap_match "최근 사이클과 이벤트 타임라인"
          dump_capture 05-paper-details
          tap_match "SUPERVISE"
          dump_capture 06-portfolio
          tap_match "도구"
          tap_match "설정"
          dump_capture 07-settings-top
          swipe_up; swipe_up
          dump_capture 08-settings-mid
          swipe_up; swipe_up; swipe_up
          dump_capture 09-settings-lower
          tap_match "설정 닫기"
          tap_match "HOME"
          dump_capture 10-home-return

          # Hard touch/navigation assertions from the native accessibility tree.
          grep -q "HOME" qa/android-visual/10-home-return.xml
          grep -q "PAPER" qa/android-visual/03-paper-top.xml
          grep -q "SUPERVISE" qa/android-visual/06-portfolio.xml
          grep -q "설정" qa/android-visual/07-settings-top.xml
          grep -q "PAPER ONLY" qa/android-visual/03-paper-top.xml
          echo "touch_navigation=PASS" >> qa/android-visual/report.txt
          echo "visual_evidence_count=$(find qa/android-visual -name '*.png' | wc -l)" >> qa/android-visual/report.txt
      - name: Upload Android visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-android-touch-visual-${{ github.sha }}
          path: qa/android-visual
          if-no-files-found: error
          retention-days: 7
      - name: Publish screenshots to QA branch for review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nusa-android-qa"
          git config user.email "nusa-android-qa@users.noreply.github.com"
          git add qa/android-visual
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip android-qa] qa(android): capture touch and visual evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
