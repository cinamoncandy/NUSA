name: Autopilot Execution Consumer

# EMERGENCY FAIL-CLOSED PAUSE:
# repository_dispatch is intentionally disabled until the Cloudflare webhook
# recursion guard is confirmed deployed. Manual invocation remains available
# for controlled verification only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: autopilot-execution-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail closed while repository dispatch is paused
        run: |
          echo "Autopilot repository_dispatch consumer is temporarily paused."
          echo "liveAuthority=NONE"
          echo "productionMutationAllowed=false"
          echo "AI authority=ZERO_AUTHORITY"
