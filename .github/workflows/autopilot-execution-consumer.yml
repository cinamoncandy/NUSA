on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: autopilot-execution-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
