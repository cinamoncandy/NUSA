name: Module Modernization Fixup
on:
  pull_request:
    paths:
      - 'apps/mobile/App.tsx'
      - '.github/workflows/module-modernization-fixup.yml'
permissions:
  contents: write
jobs:
  fixup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix React Native 0.87 AppState typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'useState<AppStateStatus>(AppState.currentState)'
          new = 'useState<AppStateStatus>(AppState.currentState as AppStateStatus)'
          if old not in s and new not in s:
              raise SystemExit('AppState target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(mobile): align AppState type with RN 0.87"
          git push
