name: Module Modernization Fixup
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'tests/mobile-native-structure.test.js'
      - '.github/workflows/module-modernization-fixup.yml'
permissions:
  contents: write
jobs:
  fixup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore trusted RN 0.87 modernization set
        run: |
          git fetch origin d602eca1d681edd58589ed4259516dc1e2797865
          git checkout d602eca1d681edd58589ed4259516dc1e2797865 -- \
            apps/mobile/package.json \
            apps/mobile/android/build.gradle \
            apps/mobile/android/gradle.properties \
            pnpm-lock.yaml \
            tests/mobile-native-structure.test.js
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'useState<AppStateStatus>(AppState.currentState)'
          alt = 'useState<AppStateStatus>(AppState.currentState ?? "active")'
          new = 'useState<AppStateStatus>(AppState.currentState as AppStateStatus)'
          if new not in s:
              if old in s:
                  s = s.replace(old, new)
              elif alt in s:
                  s = s.replace(alt, new)
              else:
                  raise SystemExit('AppState target not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit modernization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/App.tsx apps/mobile/package.json apps/mobile/android/build.gradle apps/mobile/android/gradle.properties pnpm-lock.yaml tests/mobile-native-structure.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(mobile): restore trusted latest stable runtime stack"
          git push
