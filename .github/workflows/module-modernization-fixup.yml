name: Module Modernization Fixup
on:
  pull_request:
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/module-modernization-fixup.yml'
permissions:
  contents: write
jobs:
  fixup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Adapt AppState and regenerate lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'useState<AppStateStatus>(AppState.currentState)'
          new = 'useState<AppStateStatus>(AppState.currentState ?? "active")'
          if old not in s and new not in s:
              raise SystemExit('AppState target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          pnpm clean --lockfile
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/App.tsx pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(mobile): complete RN 0.87 compatibility"
          git push
