name: Android Product UX Acceptance

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "tests/mobile-product-v5.test.js"
      - ".github/workflows/android-product-ux-acceptance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-product-ux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  touch-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 11076708
      - name: Prepare Pixel 6 Android 15 emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n nusa_product_qa -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx nusa_product_qa
          test -f "$ANDROID_AVD_HOME/nusa_product_qa.ini"
      - name: Build exact debug APK
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-mobile-build-config.js
          chmod +x apps/mobile/android/gradlew apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          cd apps/mobile/android
          ./gradlew :app:assembleDebug -PnusaEmbedDebugBundle
      - name: Boot and install
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" -avd nusa_product_qa -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          if ! timeout 120 adb wait-for-device; then
            echo "::error::Android emulator did not register with adb within 120 seconds"
            cat "$RUNNER_TEMP/emulator.log" || true
            "$ANDROID_HOME/emulator/emulator" -list-avds || true
            adb devices -l || true
            exit 1
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'; then
            echo "::error::Android emulator did not complete boot within 300 seconds"
            cat "$RUNNER_TEMP/emulator.log" || true
            adb devices -l || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm clear com.nusa.mobile.preview
          adb shell am start -W -n com.nusa.mobile.preview/com.nusa.mobile.MainActivity
          sleep 4
      - name: Touch primary flow and capture frames
        run: |
          set -euo pipefail
          mkdir -p qa/android-product-ux
          cat > "$RUNNER_TEMP/tap.py" <<'PY'
          import re, subprocess, sys, xml.etree.ElementTree as ET
          needle=sys.argv[1]
          subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(["adb","pull","/sdcard/window.xml","/tmp/window.xml"],check=True,stdout=subprocess.DEVNULL)
          for n in ET.parse("/tmp/window.xml").getroot().iter("node"):
              a=n.attrib
              hay=" | ".join((a.get("text",""),a.get("content-desc",""),a.get("resource-id","")))
              if needle in hay:
                  m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",a.get("bounds",""))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups())
                      print((x1+x2)//2,(y1+y2)//2)
                      sys.exit(0)
          print(ET.tostring(ET.parse("/tmp/window.xml").getroot(), encoding="unicode"), file=sys.stderr)
          sys.exit(2)
          PY
          capture(){ adb exec-out screencap -p > "qa/android-product-ux/$1.png"; adb shell uiautomator dump /sdcard/window.xml >/dev/null; adb pull /sdcard/window.xml "qa/android-product-ux/$1.xml" >/dev/null; }
          tap(){ read x y < <(python3 "$RUNNER_TEMP/tap.py" "$1"); adb shell input tap "$x" "$y"; sleep 2; }
          enter_personal(){ if coords="$(python3 "$RUNNER_TEMP/tap.py" "local-entry-submit" 2>/dev/null)"; then read x y <<<"$coords"; adb shell input tap "$x" "$y"; sleep 2; elif python3 "$RUNNER_TEMP/tap.py" "home-screen" >/dev/null 2>&1; then return 0; else python3 "$RUNNER_TEMP/tap.py" "local-entry-submit"; return 2; fi; }
          tap_after_scroll(){ local needle="$1"; local tries=0; while [ "$tries" -lt 5 ]; do if coords="$(python3 "$RUNNER_TEMP/tap.py" "$needle" 2>/dev/null)"; then read x y <<<"$coords"; adb shell input tap "$x" "$y"; sleep 2; return 0; fi; adb shell input swipe 540 1750 540 520 450; sleep 1; tries=$((tries+1)); done; echo "required Android control not reachable: $needle" >&2; return 2; }

          capture 00-entry
          enter_personal; capture 01-home

          tap "tab-Markets"; capture 02-markets-chart
          tap "시장 목록"; capture 03-markets-list
          tap "차트"; capture 04-markets-chart-return

          tap "tab-Paper"; capture 05-paper
          adb shell input swipe 540 1800 540 500 450; sleep 1; capture 06-paper-scroll
          tap_after_scroll "paper-learning-detail-toggle"; capture 07-paper-evidence-open

          tap "tab-Portfolio"; capture 08-portfolio
          tap "header-tools-menu"; tap "header-settings"; capture 09-settings
          adb shell input swipe 540 1800 540 600 450; sleep 1; capture 10-settings-scroll
          tap "utility-close"; capture 11-after-settings-close
          tap "tab-Home"; capture 12-home-return

          grep -q "paper-learning-monitor" qa/android-product-ux/05-paper.xml
          grep -q "MARKETS" qa/android-product-ux/02-markets-chart.xml
          grep -q "PORTFOLIO" qa/android-product-ux/08-portfolio.xml
          grep -q "paper-learning-timeline" qa/android-product-ux/07-paper-evidence-open.xml
          grep -q "home-screen" qa/android-product-ux/12-home-return.xml
          printf 'touch_navigation=PASS\nframes=%s\nevidence_disclosure=PASS\nsettings_close=PASS\nreturn_home=PASS\n' "$(find qa/android-product-ux -name '*.png' | wc -l)" > qa/android-product-ux/report.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-product-ux-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa/android-product-ux
          retention-days: 7
          if-no-files-found: error
