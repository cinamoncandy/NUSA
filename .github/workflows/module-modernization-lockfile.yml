name: Module Modernization Lockfile

on:
  pull_request:
    paths:
      - 'apps/mobile/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/module-modernization-lockfile.yml'

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Rebuild lockfile from a clean resolution
        run: |
          pnpm clean --lockfile
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile for trusted Hermes"
          git push
