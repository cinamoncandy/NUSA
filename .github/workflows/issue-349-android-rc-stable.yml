name: Issue 349 Android RC Stable

on:
  push:
    branches:
      - agent/issue-349-mobile-real-use-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Verify canonical latest-design UI contracts
        run: >-
          node --test
          tests/mobile-design-system.test.js
          tests/mobile-markets-ui.test.js
          tests/mobile-paper-real-use-ui.test.js
          tests/mobile-settings-ui.test.js
          tests/mobile-trading-ui.test.js
          tests/mobile-uiux-v2.test.js
          tests/uiux-002-phase2-visual-foundation.test.js
          tests/uiux-nav-chrome-closeout.test.js

      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_BUILD_CHANNEL: rc

      - name: Seal exact source provenance
        shell: bash
        env:
          NUSA_BUILD_SHA: ${{ github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_BUILD_CHANNEL: rc
          NUSA_RUN_ID: ${{ github.run_id }}
          NUSA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "app-release.apk" > "$OUT/app-release.apk.sha256"
          printf '{\n  "repository": "%s",\n  "sourceSha": "%s",\n  "runNumber": "%s",\n  "runId": "%s",\n  "apk": "app-release.apk",\n  "apkSha256": "%s"\n}\n' "$NUSA_REPOSITORY" "$NUSA_BUILD_SHA" "$NUSA_BUILD_NUMBER" "$NUSA_RUN_ID" "$APK_SHA256" > "$OUT/provenance.json"

      - name: Upload latest-design APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-android-latest-design-stable-${{ github.sha }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/mobile/android/app/build/outputs/apk/release/provenance.json
          if-no-files-found: error
          retention-days: 14
