name: Autopilot Sandbox New-File Guard

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nusa-autopilot-sandbox-new-file-guard
  cancel-in-progress: false

jobs:
  new-file-validation:
    name: Sandbox validator accepts bounded new files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Autopilot
        run: pnpm run build

      - name: Verify Sandbox new-file patch accounting
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdtemp, mkdir, readFile, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { dirname, join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { validatePatchInSandbox } from './dist/apps/autopilot/src/sandboxPatchValidator.js';

          const target = 'apps/autopilot/src/sandboxNewFileDogfoodProbe.ts';
          const patch = [
            `diff --git a/${target} b/${target}`,
            'new file mode 100644',
            '--- /dev/null',
            `+++ b/${target}`,
            '@@ -0,0 +1 @@',
            '+export const sandboxNewFileDogfoodProbe = true;',
            '',
          ].join('\n');

          const run = (cwd, argv) => {
            if (argv[0] === 'pnpm') return { exitCode: 0, stdout: '', stderr: '' };
            const result = spawnSync(argv[0], argv.slice(1), { cwd, encoding: 'utf8' });
            return {
              exitCode: result.status ?? 1,
              stdout: result.stdout ?? '',
              stderr: result.stderr ?? '',
            };
          };

          const backend = {
            name: 'dogfood-local-git',
            async prepare() {
              const workspaceId = await mkdtemp(join(tmpdir(), 'nusa-sandbox-new-file-'));
              const init = run(workspaceId, ['git', 'init', '--quiet']);
              if (init.exitCode !== 0) throw new Error(`DOGFOOD_GIT_INIT_FAILED:${init.stderr}`);
              return { workspaceId };
            },
            async exec(workspaceId, argv) {
              return run(workspaceId, [...argv]);
            },
            async write(workspaceId, path, content) {
              const full = join(workspaceId, path);
              await mkdir(dirname(full), { recursive: true });
              await writeFile(full, content, 'utf8');
            },
            async read(workspaceId, path) {
              return readFile(join(workspaceId, path), 'utf8');
            },
            async checkpoint(workspaceId) {
              return { workspaceId, checkpointId: 'dogfood-new-file' };
            },
            async cleanup(workspaceId) {
              await rm(workspaceId, { recursive: true, force: true });
            },
          };

          const envelope = {
            cycleId: 'dogfood-new-file-cycle',
            workItemId: 'dogfood-new-file-work-item',
            executionId: 'dogfood-new-file-execution',
            dedupeKey: 'dogfood-new-file-dedupe',
            origin: 'AUTO_BACKGROUND',
            repository: 'cinamoncandy/NUSA',
            baseSha: process.env.GITHUB_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            objective: 'Prove the Sandbox validator correctly accounts for a bounded newly-created TypeScript file.',
            acceptanceCriteria: ['A new file patch is counted as exactly one changed file.'],
            evidenceRefs: [`github:workflow-run:${process.env.GITHUB_RUN_ID}`],
            allowedScope: ['apps/autopilot/src/'],
            forbiddenScope: ['.github/', 'live-trading', 'production-authority', 'secrets'],
            maxChangedFiles: 1,
            mutationAllowed: false,
            liveAuthority: 'NONE',
            productionMutationAllowed: false,
            aiAuthority: 'ZERO_AUTHORITY',
          };

          try {
            const result = await validatePatchInSandbox(backend, { envelope, patch });
            if (result.changedFiles.length !== 1 || result.changedFiles[0] !== target) {
              throw new Error(`DOGFOOD_UNEXPECTED_CHANGED_FILES:${JSON.stringify(result.changedFiles)}`);
            }
            console.log('SANDBOX_NEW_FILE_GUARD_PASS');
          } catch (error) {
            console.error('SANDBOX_NEW_FILE_GUARD_FAIL');
            console.error('Expected validatePatchInSandbox to accept one bounded patch that creates a new TypeScript file.');
            console.error('New files are untracked after git apply, while git diff --name-only omits untracked files.');
            console.error('Fix apps/autopilot/src/sandboxPatchValidator.ts so expected newly-created paths are included without counting the temporary .nusa-autopilot.patch file.');
            console.error(error instanceof Error ? error.stack : String(error));
            process.exit(1);
          }
          NODE
