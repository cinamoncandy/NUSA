name: Canonical Research 2000-Day Evidence

on:
  push:
    branches: [evidence/research-2000-e176532]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build exact source
        run: pnpm run build
      - name: Diagnose public daily-history availability
        run: |
          node <<'NODE'
          const markets = ["KRW-BTC", "KRW-ETH", "KRW-XRP", "KRW-SOL", "KRW-DOGE"];
          const DAY = 86400000;
          const completedBy = Date.now();
          const initialBefore = Math.floor(completedBy / DAY) * DAY;
          for (const market of markets) {
            let before = initialBefore;
            let total = 0;
            let pages = 0;
            let oldest = null;
            while (total < 2000 && pages < 10) {
              const count = Math.min(200, 2000 - total);
              const url = `https://api.upbit.com/v1/candles/days?market=${market}&count=${count}&to=${encodeURIComponent(new Date(before).toISOString())}`;
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              if (!response.ok) throw new Error(`${market} HTTP ${response.status}`);
              const rows = await response.json();
              if (!Array.isArray(rows)) throw new Error(`${market} invalid payload`);
              pages += 1;
              total += rows.length;
              if (rows.length > 0) {
                oldest = rows.at(-1)?.candle_date_time_utc ?? oldest;
                before = Date.parse(`${oldest}Z`);
              }
              if (rows.length < count) break;
              await new Promise((resolve) => setTimeout(resolve, 150));
            }
            console.log(`HISTORY_AVAILABILITY market=${market} candles=${total} pages=${pages} oldest=${oldest ?? "NONE"}`);
          }
          NODE
      - name: Run canonical 2000-day public-market Research
        env:
          NUSA_SOURCE_COMMIT_SHA: e17653254ac5114d8cab4f74855abe1837a261d8
          NUSA_RESEARCH_COST_MODEL_VERSION: research-v1-fee5bps-spread5bps-slippage5bps
          NUSA_RESEARCH_CANDLE_COUNT: "2000"
          NUSA_RESEARCH_REPLAY_SNAPSHOT_PATH: ${{ runner.temp }}/research-replay-snapshot.json
        run: |
          set -o pipefail
          pnpm run research:real-run | tee research-2000-e176532.json
      - name: Upload Research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-research-2000-e176532
          path: |
            research-2000-e176532.json
            ${{ runner.temp }}/research-replay-snapshot.json
          if-no-files-found: warn
          retention-days: 14
