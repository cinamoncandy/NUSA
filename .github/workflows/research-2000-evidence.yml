name: Canonical Research 2000-Day Evidence

on:
  push:
    branches: [evidence/research-2000-e176532]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build exact source
        run: pnpm run build
      - name: Run canonical 2000-day public-market Research
        env:
          NUSA_SOURCE_COMMIT_SHA: e17653254ac5114d8cab4f74855abe1837a261d8
          NUSA_RESEARCH_COST_MODEL_VERSION: research-v1-fee5bps-spread5bps-slippage5bps
          NUSA_RESEARCH_CANDLE_COUNT: "2000"
        run: |
          set -o pipefail
          pnpm run research:real-run | tee research-2000-e176532.json
      - name: Upload Research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-research-2000-e176532
          path: research-2000-e176532.json
          if-no-files-found: error
          retention-days: 14
