name: Restricted LIVE Transport Credential Readiness

on:
  push:
    branches: ["agent/restricted-live-transport-credential-readiness"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Transport credential readiness regressions
        run: node --test --test-reporter=spec tests/restricted-live-transport-credential-readiness.test.js
      - name: Transport credential readiness evidence
        run: node scripts/restricted-live-transport-credential-readiness.js --output artifacts/operational-evidence/restricted-live-transport-credential-readiness.json
      - name: Upload transport credential readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restricted-live-transport-credential-readiness-evidence
          path: artifacts/operational-evidence/restricted-live-transport-credential-readiness.json
          if-no-files-found: error
          retention-days: 14
