name: Oracle PAPER Release

# Deploys the Cloud PAPER runtime to the Oracle host by running the procedure that
# docs/operations/oracle-p1-008-runbook.md already defines. Every step it performs already
# existed as a script; what was missing was anything that ran them in order, which is why the
# host drifted behind protected main with no workflow able to observe or correct it (#1816).
#
# Deliberately manual. This is the first automated writer to a production host, so it is
# dispatch-only rather than firing on every merge to main. Nothing here grants LIVE authority:
# the release switch moves a symlink and restarts a service that stays PAPER_ONLY.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to release. Must be current protected main.
        required: true
        type: string
      stage_only:
        description: Stop after staging the release directory (no preflight, no activation). Used to stage a release for the owner's in-place controller upgrade (install.sh --upgrade-controller).
        required: false
        default: false
        type: boolean
      activation:
        description: "helper = the reviewed host helper activates (default, unchanged). controller = the host controller release verb (needs the controller that has the release verb and its runner rule)."
        required: false
        default: helper
        type: choice
        options:
          - helper
          - controller

permissions:
  contents: read

concurrency:
  group: oracle-paper-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build exact-main Cloud PAPER release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    outputs:
      bundle_sha: ${{ steps.bundle.outputs.sha }}
      helper_sha: ${{ steps.bundle.outputs.helper_sha }}
    steps:
      - name: Verify the requested source is exact protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_sha must be a full lowercase commit SHA"; exit 1; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$MAIN_SHA" = "$SOURCE_SHA" ] || { echo "::error::Refusing stale Oracle release: requested $SOURCE_SHA, protected main is $MAIN_SHA"; exit 1; }

      - name: Require successful exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&per_page=100" --jq '.workflow_runs[]' \
            | jq -sr --arg sha "$SOURCE_SHA" '[.[] | select(.path == ".github/workflows/ci.yml" and .head_sha == $sha and .conclusion == "success")][0].conclusion // empty')"
          [ "$conclusion" = "success" ] || { echo "::error::Exact-source $SOURCE_SHA has no successful canonical CI run"; exit 1; }

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enable pnpm via Corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install locked dependencies and build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Seal the built release
        id: bundle
        run: |
          set -euo pipefail
          # The PAPER host runs plain Node from dist/ and scripts/ and loads exactly one runtime package, ws. Sealing the whole
          # workspace node_modules (Electron, React Native, Skia: about 1.5 GB) made the bundle 372 MiB, and the host (about
          # 0.8 MiB/s disk) could not download and unpack it inside the 40-minute release job (run 40697488340, 2026-10-28:
          # cancelled while unpacking, nothing activated). Ship the tree without node_modules plus the ws package.
          STAGE="$RUNNER_TEMP/nusa-release-stage"
          [ ! -e "$STAGE" ] || { echo "::error::Release stage directory already exists"; exit 1; }
          mkdir -p "$STAGE/node_modules"
          tar -cf - --exclude=.git --exclude=node_modules . | tar -xf - -C "$STAGE"
          cp -RL node_modules/ws "$STAGE/node_modules/ws"
          # Fail here, on the fast builder, if the slimmed tree cannot load the host runtime.
          (cd "$STAGE" && node -e 'require("ws"); require("./dist/packages/core/src/upbitWebSocket.js"); require("./dist/apps/cloud/src/runtime.js"); require("./dist/apps/cloud/src/closedLearningProductionRuntime.js"); console.log("slim release tree loads the host runtime")')
          tar -czf "$RUNNER_TEMP/nusa-release.tar.gz" -C "$STAGE" .
          BUNDLE_BYTES="$(stat -c %s "$RUNNER_TEMP/nusa-release.tar.gz")"
          echo "release bundle: $BUNDLE_BYTES bytes"
          [ "$BUNDLE_BYTES" -le 157286400 ] || { echo "::error::Release bundle is larger than 150 MiB ($BUNDLE_BYTES bytes); the PAPER host cannot unpack it in the release budget"; exit 1; }
          echo "sha=$(sha256sum "$RUNNER_TEMP/nusa-release.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "helper_sha=$(sha256sum deploy/oracle/nusa-release-step.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload built release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-paper-release
          path: ${{ runner.temp }}/nusa-release.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact-source backup helper proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-paper-release-helper
          path: deploy/oracle/nusa-release-step.sh
          if-no-files-found: error
          retention-days: 1

  backup:
    name: Back up exact-main Cloud PAPER state
    needs: prepare
    # Backup is isolated from activation so a slow verified backup can fail before any release
    # switch. The step budget is derived from the observed production envelope below; it does not
    # consume the separate 40-minute stage/preflight/activation job budget.
    runs-on: [self-hosted, Linux, nusa-paper-host]
    timeout-minutes: 190
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STEP: /opt/nusa/bin/nusa-release-step
      HELPER_SHA: ${{ needs.prepare.outputs.helper_sha }}
    steps:
      - name: Recheck exact protected main before backup
        id: source_fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPERSEDED: protected main moved after build; stale Oracle backup/release is a non-terminal no-op"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Free disk by pruning superseded releases (bounded)
        if: steps.source_fresh.outputs.fresh == 'true'
        run: sudo "$STEP" prune

      - name: Download exact-source helper proof
        if: steps.source_fresh.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nusa-paper-release-helper
          path: ${{ runner.temp }}/nusa-backup-helper

      - name: Require reviewed root-owned helper exact match before backup
        if: steps.source_fresh.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          [[ "$HELPER_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing helper digest"; exit 1; }
          HELPER_PROOF="$RUNNER_TEMP/nusa-backup-helper/nusa-release-step.sh"
          echo "$HELPER_SHA  $HELPER_PROOF" | sha256sum --check --status
          cmp --silent "$STEP" "$HELPER_PROOF" || {
            echo "::error::Host release helper differs from exact reviewed source. Install the exact reviewed root-owned helper before backup/release."
            exit 1
          }

      - name: Back up persistent state before release mutation
        if: steps.source_fresh.outputs.fresh == 'true'
        # Conservative observed envelope: 957 MiB * six Sunday full-file phases / 0.8 MiB/s
        # = 119.6 min; add 30% variance = 155.5 min, then round up to 180 min. The timeout
        # is local to backup, so it cannot terminate a switched-but-unproven activation.
        timeout-minutes: 180
        run: sudo "$STEP" backup

  release:
    name: Release exact-main Cloud PAPER runtime
    needs: [prepare, backup]
    # Backup has its own bounded job/step above. Keep the release mutation window independently
    # bounded so stage/preflight/activation cannot inherit a long backup timeout.
    runs-on: [self-hosted, Linux, nusa-paper-host]
    timeout-minutes: 40
    # The final verdict job reads this receipt; it never trusts the job conclusion alone (a superseded run ends "success").
    outputs:
      deploymentResult: ${{ steps.record.outputs.deploymentResult }}
      controllerOutcome: ${{ steps.record.outputs.controllerOutcome }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      NUSA_DEPLOY_ROOT: /opt/nusa
      STEP: /opt/nusa/bin/nusa-release-step
      BUNDLE_SHA: ${{ needs.prepare.outputs.bundle_sha }}
    steps:
      - name: Recheck exact protected main before host mutation
        id: source_fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPERSEDED: protected main moved after backup; stale Oracle release is a non-terminal no-op"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Download built release
        if: steps.source_fresh.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nusa-paper-release
          path: ${{ runner.temp }}

      - name: Verify and unpack the exact built release
        if: steps.source_fresh.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing bundle digest"; exit 1; }
          echo "$BUNDLE_SHA  $RUNNER_TEMP/nusa-release.tar.gz" | sha256sum --check --status
          RELEASE_TREE="$RUNNER_TEMP/nusa-release-tree-$GITHUB_RUN_ID"
          mkdir -p "$RELEASE_TREE"
          tar -xzf "$RUNNER_TEMP/nusa-release.tar.gz" -C "$RELEASE_TREE"
          test -f "$RELEASE_TREE/scripts/oracle-validate.js"
          rm -- "$RUNNER_TEMP/nusa-release.tar.gz"
          echo "RELEASE_TREE=$RELEASE_TREE" >> "$GITHUB_ENV"

      - name: Require reviewed host release helper exact match
        if: steps.source_fresh.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          cmp --silent "$STEP" "$RELEASE_TREE/deploy/oracle/nusa-release-step.sh" || {
            echo "::error::Host release helper differs from exact reviewed source. Install the reviewed root-owned helper before releasing."
            exit 1
          }

      - name: Stage the immutable release directory
        if: steps.source_fresh.outputs.fresh == 'true'
        run: sudo "$STEP" stage "$SOURCE_SHA" "$RELEASE_TREE"

      - name: Preflight host and security contract
        if: steps.source_fresh.outputs.fresh == 'true' && !inputs.stage_only
        run: sudo "$STEP" preflight "$SOURCE_SHA"

      - name: Recheck exact protected main immediately before activation
        if: steps.source_fresh.outputs.fresh == 'true' && !inputs.stage_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$MAIN_SHA" = "$SOURCE_SHA" ] || {
            echo "::error::Refusing stale activation: requested $SOURCE_SHA, protected main moved to $MAIN_SHA during host preparation"
            exit 1
          }

      - name: Atomically activate exact release and prove both runtimes (helper)
        if: steps.source_fresh.outputs.fresh == 'true' && !inputs.stage_only && inputs.activation == 'helper'
        run: sudo "$STEP" activate "$SOURCE_SHA"

      # The controller runs the same reviewed helper as a child under its own start gate, verifies the runtime itself and
      # records the build; its one-line result is the outcome (only DEPLOYED is a deployment; the verdict job checks it again).
      - name: Release through the host controller
        id: controller
        if: steps.source_fresh.outputs.fresh == 'true' && !inputs.stage_only && inputs.activation == 'controller'
        run: |
          set -uo pipefail
          OUT="$(sudo /opt/nusa-control/nusa-control.sh release "$SOURCE_SHA")"; RC=$?
          printf '%s\n' "$OUT"
          OUTCOME="$(printf '%s\n' "$OUT" | tail -n 1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);process.stdout.write(typeof o.outcome==="string"&&/^[A-Z_]{3,30}$/.test(o.outcome)?o.outcome:"")}catch{}})')"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          if [ "$OUTCOME" != DEPLOYED ] || [ "$RC" != 0 ]; then echo "::error::controller release outcome: ${OUTCOME:-none} (exit $RC)"; exit 1; fi

      - name: Record deployed identity and fail-closed authority
        id: record
        if: always()
        env:
          SOURCE_FRESH: ${{ steps.source_fresh.outputs.fresh }}
          JOB_STATUS: ${{ job.status }}
          STAGE_ONLY: ${{ inputs.stage_only }}
          CONTROLLER_OUTCOME: ${{ steps.controller.outputs.outcome }}
        run: |
          set -euo pipefail
          CURRENT_RELEASE="$(readlink -f "$NUSA_DEPLOY_ROOT/current" || echo UNKNOWN)"
          echo "requestedSource=$SOURCE_SHA"
          echo "currentRelease=$CURRENT_RELEASE"
          if [ "$SOURCE_FRESH" != "true" ]; then
            RESULT=SKIPPED_MAIN_MOVED
          elif [ "$JOB_STATUS" != "success" ]; then
            RESULT=FAILED
          elif [ "$STAGE_ONLY" = "true" ]; then
            RESULT=STAGED_ONLY
          elif [ "$(basename "$CURRENT_RELEASE")" = "$SOURCE_SHA" ]; then
            RESULT=DEPLOYED
          else
            RESULT=FAILED_ACTIVATION_IDENTITY
          fi
          echo "deploymentResult=$RESULT"
          echo "deploymentResult=$RESULT" >> "$GITHUB_OUTPUT"
          echo "controllerOutcome=$CONTROLLER_OUTCOME" >> "$GITHUB_OUTPUT"
          echo "::notice::deploymentResult=$RESULT source=$SOURCE_SHA"
          printf '### Oracle PAPER release\n\n| deploymentResult | requestedSource | currentRelease |\n| --- | --- | --- |\n| %s | %s | %s |\n' "$RESULT" "$SOURCE_SHA" "$CURRENT_RELEASE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" = "FAILED_ACTIVATION_IDENTITY" ]; then echo "::error::activation reported success but current does not resolve to $SOURCE_SHA"; exit 1; fi
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'

  # The only place a run is called a deployment. It runs even when an earlier job failed or was skipped, reads the receipt and the
  # public /health, and fails the run with "NOT DEPLOYED: ..." for anything but a verified deployment (design C4 3.3).
  verdict:
    name: Verdict (a run is a deployment only when every fact agrees)
    needs: [backup, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BACKUP_JOB: ${{ needs.backup.result }}
      RELEASE_JOB: ${{ needs.release.result }}
      DEPLOYMENT_RESULT: ${{ needs.release.outputs.deploymentResult }}
      CONTROLLER_OUTCOME: ${{ needs.release.outputs.controllerOutcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Read the public health (read-only, only when the receipt says DEPLOYED)
        id: health
        run: |
          set -uo pipefail
          HEALTH_SHA=""
          if [ "$DEPLOYMENT_RESULT" = "DEPLOYED" ]; then
            URL="$(node -e 'const u=JSON.parse(require("fs").readFileSync("deploy/health-watch.json","utf8")).healthUrl;if(typeof u!=="string"||!/^https:\/\/[a-z0-9.-]+\/health$/.test(u))process.exit(1);process.stdout.write(u)' 2>/dev/null)" || URL=""
            if [ -n "$URL" ]; then
              for n in 1 2 3 4 5 6; do
                curl -sS -m 20 -o /tmp/health.json "$URL" 2>/dev/null || true
                HEALTH_SHA="$(node -e 'try{const h=JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8"));process.stdout.write(String(h.runtime&&h.runtime.sourceCommitSha||""))}catch{}' 2>/dev/null)" || HEALTH_SHA=""
                [ "$HEALTH_SHA" = "$SOURCE_SHA" ] && break
                [ "$n" = 6 ] || sleep 10
              done
            fi
          fi
          echo "sha=$HEALTH_SHA" >> "$GITHUB_OUTPUT"
      - name: Decide
        env:
          HEALTH_SHA: ${{ steps.health.outputs.sha }}
        run: |
          set -uo pipefail
          node scripts/release-verdict.js | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
