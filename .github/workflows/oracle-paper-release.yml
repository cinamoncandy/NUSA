name: Oracle PAPER Release

# Deploys the Cloud PAPER runtime to the Oracle host by running the procedure that
# docs/operations/oracle-p1-008-runbook.md already defines. Every step it performs already
# existed as a script; what was missing was anything that ran them in order, which is why the
# host drifted behind protected main with no workflow able to observe or correct it (#1816).
#
# Deliberately manual. This is the first automated writer to a production host, so it is
# dispatch-only rather than firing on every merge to main. Nothing here grants LIVE authority:
# the release switch moves a symlink and restarts a service that stays PAPER_ONLY.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to release. Must be current protected main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-paper-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build exact-main Cloud PAPER release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    outputs:
      bundle_sha: ${{ steps.bundle.outputs.sha }}
      helper_sha: ${{ steps.bundle.outputs.helper_sha }}
    steps:
      - name: Verify the requested source is exact protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::source_sha must be a full lowercase commit SHA"; exit 1; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$MAIN_SHA" = "$SOURCE_SHA" ] || { echo "::error::Refusing stale Oracle release: requested $SOURCE_SHA, protected main is $MAIN_SHA"; exit 1; }

      - name: Require successful exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" --jq '.workflow_runs[]' \
            | jq -sr --arg sha "$SOURCE_SHA" '[.[] | select(.path == ".github/workflows/ci.yml" and .head_sha == $sha and .conclusion == "success")][0].conclusion // empty')"
          [ "$conclusion" = "success" ] || { echo "::error::Exact-source $SOURCE_SHA has no successful canonical CI run"; exit 1; }

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enable pnpm via Corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install locked dependencies and build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Seal the built release
        id: bundle
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/nusa-release.tar.gz" --exclude=.git .
          echo "sha=$(sha256sum "$RUNNER_TEMP/nusa-release.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "helper_sha=$(sha256sum deploy/oracle/nusa-release-step.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload built release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-paper-release
          path: ${{ runner.temp }}/nusa-release.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact-source backup helper proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-paper-release-helper
          path: deploy/oracle/nusa-release-step.sh
          if-no-files-found: error
          retention-days: 1

  backup:
    name: Back up exact-main Cloud PAPER state
    needs: prepare
    # Backup is isolated from activation so a slow verified backup can fail before any release
    # switch. The job budget includes up to 60 minutes for source recheck, bounded prune, artifact
    # download/unpack, and helper identity proof before the independently capped backup step.
    # Run 40198892768 consumed 42m33s before backup began; the previous 190m job budget therefore
    # cancelled its 180m backup step after only ~149m. The release mutation job remains separate.
    runs-on: [self-hosted, Linux, nusa-paper-host]
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STEP: /opt/nusa/bin/nusa-release-step
      HELPER_SHA: ${{ needs.prepare.outputs.helper_sha }}
    steps:
      - name: Recheck exact protected main before backup
        id: source_fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPERSEDED: protected main moved after build; stale Oracle backup/release is a non-terminal no-op"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Free disk by pruning superseded releases (bounded)
        if: steps.source_fresh.outputs.fresh == 'true'
        run: sudo "$STEP" prune

      - name: Download exact-source helper proof
        if: steps.source_fresh.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nusa-paper-release-helper
          path: ${{ runner.temp }}/nusa-backup-helper

      - name: Require reviewed root-owned helper exact match before backup
        if: steps.source_fresh.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          [[ "$HELPER_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing helper digest"; exit 1; }
          HELPER_PROOF="$RUNNER_TEMP/nusa-backup-helper/nusa-release-step.sh"
          echo "$HELPER_SHA  $HELPER_PROOF" | sha256sum --check --status
          cmp --silent "$STEP" "$HELPER_PROOF" || {
            echo "::error::Host release helper differs from exact reviewed source. Install the exact reviewed root-owned helper before backup/release."
            exit 1
          }

      - name: Back up persistent state before release mutation
        if: steps.source_fresh.outputs.fresh == 'true'
        # Conservative observed envelope: 957 MiB * six Sunday full-file phases / 0.8 MiB/s
        # = 119.6 min; add 30% variance = 155.5 min, then round up to 180 min. The timeout
        # is local to backup, so it cannot terminate a switched-but-unproven activation.
        timeout-minutes: 180
        run: sudo "$STEP" backup

  release:
    name: Release exact-main Cloud PAPER runtime
    needs: [prepare, backup]
    # Backup has its own bounded job/step above. Keep the release mutation window independently
    # bounded so stage/preflight/activation cannot inherit a long backup timeout.
    runs-on: [self-hosted, Linux, nusa-paper-host]
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      NUSA_DEPLOY_ROOT: /opt/nusa
      STEP: /opt/nusa/bin/nusa-release-step
      BUNDLE_SHA: ${{ needs.prepare.outputs.bundle_sha }}
    steps:
      - name: Recheck exact protected main before host mutation
        id: source_fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPERSEDED: protected main moved after backup; stale Oracle release is a non-terminal no-op"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Download built release
        if: steps.source_fresh.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nusa-paper-release
          path: ${{ runner.temp }}

      - name: Verify and unpack the exact built release
        if: steps.source_fresh.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing bundle digest"; exit 1; }
          echo "$BUNDLE_SHA  $RUNNER_TEMP/nusa-release.tar.gz" | sha256sum --check --status
          RELEASE_TREE="$RUNNER_TEMP/nusa-release-tree-$GITHUB_RUN_ID"
          mkdir -p "$RELEASE_TREE"
          tar -xzf "$RUNNER_TEMP/nusa-release.tar.gz" -C "$RELEASE_TREE"
          test -f "$RELEASE_TREE/scripts/oracle-validate.js"
          rm -- "$RUNNER_TEMP/nusa-release.tar.gz"
          echo "RELEASE_TREE=$RELEASE_TREE" >> "$GITHUB_ENV"

      - name: Require reviewed host release helper exact match
        if: steps.source_fresh.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          cmp --silent "$STEP" "$RELEASE_TREE/deploy/oracle/nusa-release-step.sh" || {
            echo "::error::Host release helper differs from exact reviewed source. Install the reviewed root-owned helper before releasing."
            exit 1
          }

      - name: Stage the immutable release directory
        if: steps.source_fresh.outputs.fresh == 'true'
        run: sudo "$STEP" stage "$SOURCE_SHA" "$RELEASE_TREE"

      - name: Preflight host and security contract
        if: steps.source_fresh.outputs.fresh == 'true'
        run: sudo "$STEP" preflight "$SOURCE_SHA"

      - name: Recheck exact protected main immediately before activation
        if: steps.source_fresh.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$MAIN_SHA" = "$SOURCE_SHA" ] || {
            echo "::error::Refusing stale activation: requested $SOURCE_SHA, protected main moved to $MAIN_SHA during host preparation"
            exit 1
          }

      - name: Atomically activate exact release and prove both runtimes
        if: steps.source_fresh.outputs.fresh == 'true'
        run: sudo "$STEP" activate "$SOURCE_SHA"

      - name: Record deployed identity and fail-closed authority
        if: always()
        env:
          SOURCE_FRESH: ${{ steps.source_fresh.outputs.fresh }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          CURRENT_RELEASE="$(readlink -f "$NUSA_DEPLOY_ROOT/current" || echo UNKNOWN)"
          echo "requestedSource=$SOURCE_SHA"
          echo "currentRelease=$CURRENT_RELEASE"
          if [ "$SOURCE_FRESH" != "true" ]; then
            RESULT=SKIPPED_MAIN_MOVED
          elif [ "$JOB_STATUS" != "success" ]; then
            RESULT=FAILED
          elif [ "$(basename "$CURRENT_RELEASE")" = "$SOURCE_SHA" ]; then
            RESULT=DEPLOYED
          else
            RESULT=FAILED_ACTIVATION_IDENTITY
          fi
          echo "deploymentResult=$RESULT"
          echo "::notice::deploymentResult=$RESULT source=$SOURCE_SHA"
          printf '### Oracle PAPER release\n\n| deploymentResult | requestedSource | currentRelease |\n| --- | --- | --- |\n| %s | %s | %s |\n' "$RESULT" "$SOURCE_SHA" "$CURRENT_RELEASE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" = "FAILED_ACTIVATION_IDENTITY" ]; then echo "::error::activation reported success but current does not resolve to $SOURCE_SHA"; exit 1; fi
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'
