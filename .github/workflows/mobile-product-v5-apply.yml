name: Mobile Product V5 Apply

on:
  push:
    branches:
      - design/mobile-product-v5-20260906

permissions:
  contents: write

concurrency:
  group: mobile-product-v5-apply
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[product-v5-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: design/mobile-product-v5-20260906
          fetch-depth: 0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply product v5 convergence
        run: |
          node scripts/mobile-product-v5-apply.mjs
          node scripts/mobile-product-v5-repair.mjs
      - name: Verify TypeScript build and focused UX contracts
        run: |
          pnpm run build
          node --test tests/mobile-uiux-v3-canonical.test.js tests/mobile-settings-ui.test.js tests/mobile-product-v5.test.js tests/mobile-paper-real-use-ui.test.js tests/uiux-nav-chrome-closeout.test.js
      - name: Commit verified product UX
        run: |
          git config user.name "nusa-mobile-design"
          git config user.email "nusa-mobile-design@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[product-v5-applied] design(mobile): converge product UX v5"
          git push origin HEAD:design/mobile-product-v5-20260906
