name: Sandbox Lockfile Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Generate Sandbox dependency and lockfile
        run: pnpm add @cloudflare/sandbox@next --lockfile-only
      - name: Upload generated dependency files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-lockfile-bootstrap
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
