name: Apply anonymous PAPER observation wiring

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-anonymous-paper-observation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/mobile-anonymous-paper-observation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-anonymous-paper-observation
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable package manager
        run: corepack enable
      - name: Apply deterministic wiring
        run: node scripts/wire-anonymous-paper-observation.mjs
      - name: Verify wiring contract
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          node --test tests/cloud-anonymous-observation-scope-contract.test.js tests/mobile-anonymous-observation-client.test.js tests/anonymous-paper-observation-wiring.test.js tests/anonymous-paper-observation-helper.test.js
      - name: Commit exact generated wiring
        run: |
          git config user.name "nusa-development[bot]"
          git config user.email "noreply@nusa.local"
          git add apps/cloud/src/server.ts apps/mobile/App.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "fix(paper): wire anonymous PAPER observation"
          git push origin HEAD:fix/mobile-anonymous-paper-observation
