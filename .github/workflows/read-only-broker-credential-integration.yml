name: Read-only Broker Credential Integration

on:
  push:
    branches: ["agent/read-only-broker-credential-integration"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Read-only broker credential regressions
        run: node --test --test-reporter=spec tests/read-only-broker-credential-integration.test.js
      - name: Capability surface guard
        run: node scripts/validate-restricted-live-capability-surface.js
      - name: Read-only broker integration evidence
        run: node scripts/validate-read-only-broker-credential-integration.js --output artifacts/operational-evidence/read-only-broker-credential-integration.json
      - name: Upload read-only broker integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: read-only-broker-credential-integration-evidence
          path: artifacts/operational-evidence/read-only-broker-credential-integration.json
          if-no-files-found: error
          retention-days: 14
