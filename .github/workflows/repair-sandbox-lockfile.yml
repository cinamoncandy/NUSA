name: Repair Sandbox Lockfile

on:
  push:
    branches:
      - nusa/provider-neutral-coding-dispatch-v2
    paths:
      - .github/workflows/repair-sandbox-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nusa/provider-neutral-coding-dispatch-v2
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): sync Cloudflare Sandbox lockfile"
          git push origin HEAD:nusa/provider-neutral-coding-dispatch-v2
