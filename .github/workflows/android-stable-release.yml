name: Android Stable Release

on:
  push:
    branches: [main]
    paths:
      - ".github/android-release-source.txt"
      - ".github/android-release-version.txt"
      - ".github/workflows/android-stable-release.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit SHA to release (blank = pointer file)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-stable-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve exact release source and version
        id: release
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA:-}"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(tr -d '[:space:]' < .github/android-release-source.txt)"
          fi
          RELEASE_VERSION="$(tr -d '[:space:]' < .github/android-release-version.txt)"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+$'
          test "$RELEASE_VERSION" -ge 102
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Prepare canonical mobile build configuration
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test -f scripts/prepare-mobile-build-config.js
          node scripts/prepare-mobile-build-config.js
          test -f apps/mobile/src/generatedBuildConfig.ts
          test -n "${EXPO_PUBLIC_NUSA_API_BASE_URL}"
          grep -F "export const CANONICAL_NUSA_ORIGIN = \"${EXPO_PUBLIC_NUSA_API_BASE_URL}\";" apps/mobile/src/generatedBuildConfig.ts
          grep -F "${NUSA_BUILD_SHA}" apps/mobile/src/generatedBuildConfig.ts
          ! grep -E 'localhost|127\.0\.0\.1|trycloudflare\.com' apps/mobile/src/generatedBuildConfig.ts

      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: Build stable release APK from clean source
        env:
          NUSA_BUILD_SHA: ${{ steps.release.outputs.sha }}
          NUSA_BUILD_NUMBER: ${{ steps.release.outputs.version }}
          NUSA_CANONICAL_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: ./gradlew clean :app:assembleRelease --no-build-cache
        working-directory: apps/mobile/android

      - name: Verify stable APK provenance and PAPER safety markers
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SHORT_SHA="${EXPECTED_SHA:0:8}"
          EXPECTED_VERSION_NAME="1.0.${EXPECTED_VERSION}-${SHORT_SHA}"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "versionCode='${EXPECTED_VERSION}'"
          printf '%s\n' "$BADGING" | grep -F "versionName='${EXPECTED_VERSION_NAME}'"
          "$AAPT" dump --values resources "$APK" | grep -F "$EXPECTED_SHA"
          "$AAPT" dump --values resources "$APK" | grep -F "$EXPECTED_ORIGIN"
          BUNDLE_PATH="$(unzip -Z1 "$APK" | grep -E '(^|/)index\.android\.bundle$' | head -n 1)"
          test -n "$BUNDLE_PATH"
          BUNDLE_FILE="$RUNNER_TEMP/index.android.bundle"
          unzip -p "$APK" "$BUNDLE_PATH" > "$BUNDLE_FILE"
          for UI_MARKER in home-paper-learning trade-paper-learning portfolio-paper-learning paper-learning-monitor; do
            strings "$BUNDLE_FILE" | grep -F "$UI_MARKER"
          done
          printf 'source_sha=%s\ncanonical_origin=%s\nconfig_mode=sealed\nversion_name=%s\nversion_code=%s\nui_marker=paper-learning-present\n' \
            "$EXPECTED_SHA" "$EXPECTED_ORIGIN" "$EXPECTED_VERSION_NAME" "$EXPECTED_VERSION" \
            > NUSA-Android.provenance.txt

      - name: Prepare stable APK assets
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk NUSA-Android.apk
          sha256sum NUSA-Android.apk > NUSA-Android.apk.sha256

      - name: Create or update stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="NUSA Android stable 1.0.${RELEASE_VERSION} from exact source ${SHORT_SHA}. PAPER/SHADOW only; LIVE authority NONE; AI ZERO_AUTHORITY."
          if gh release view nusa-android >/dev/null 2>&1; then
            gh release upload nusa-android NUSA-Android.apk NUSA-Android.apk.sha256 NUSA-Android.provenance.txt --clobber
            gh release edit nusa-android --target "$TARGET_SHA" --title "NUSA Android 1.0.${RELEASE_VERSION}" --notes "$NOTES"
          else
            gh release create nusa-android NUSA-Android.apk NUSA-Android.apk.sha256 NUSA-Android.provenance.txt --target "$TARGET_SHA" --title "NUSA Android 1.0.${RELEASE_VERSION}" --notes "$NOTES"
          fi

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute stable APK to Firebase App Distribution
        id: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          firebase appdistribution:distribute NUSA-Android.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "desporin12@gmail.com" \
            --release-notes "NUSA Android stable 1.0.${RELEASE_VERSION} from exact source ${SHORT_SHA}"

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Publish stable deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          FIREBASE_OUTCOME: ${{ steps.firebase.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          SOURCE="${SOURCE_SHA:-unresolved}"
          APK_SHA="unavailable"
          VERSION_NAME="unavailable"
          if [ -f NUSA-Android.apk.sha256 ]; then
            APK_SHA="$(awk '{print $1}' NUSA-Android.apk.sha256)"
          fi
          if [ -f NUSA-Android.provenance.txt ]; then
            VERSION_NAME="$(sed -n 's/^version_name=//p' NUSA-Android.provenance.txt)"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Android stable deployment receipt

          - job_status: ${JOB_STATUS}
          - firebase_outcome: ${FIREBASE_OUTCOME:-not_run}
          - source_sha: ${SOURCE}
          - version_name: ${VERSION_NAME}
          - version_code: ${RELEASE_VERSION:-unavailable}
          - apk_sha256: ${APK_SHA}
          - run: ${RUN_URL}
          EOF
          )
          gh issue comment 558 --body "$BODY"
