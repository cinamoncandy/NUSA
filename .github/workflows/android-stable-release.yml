name: Android Stable Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit SHA to release (blank = current main)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve stable promotion candidate
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve exact CI-verified source and next version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          POINTER_SHA="$(tr -d '[:space:]' < .github/android-release-source.txt)"
          VERSION_FLOOR="$(tr -d '[:space:]' < .github/android-release-version.txt)"
          printf '%s' "$POINTER_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$VERSION_FLOOR" | grep -Eq '^[0-9]+$'
          test "$VERSION_FLOOR" -ge 102

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SOURCE_SHA="$WORKFLOW_RUN_SHA"
          else
            SOURCE_SHA="${DISPATCH_SHA:-}"
            if [ -z "$SOURCE_SHA" ]; then
              SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            fi
          fi
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'

          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$SOURCE_SHA" != "$CURRENT_MAIN" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI result $SOURCE_SHA; current main is $CURRENT_MAIN."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CI_CONCLUSION="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI")][0].conclusion // empty'
            )"
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::error::Exact source $SOURCE_SHA does not have a successful CI run."
              exit 1
            fi
          fi

          RELEASE_NAME="$(gh release view nusa-android --json name --jq '.name' 2>/dev/null || true)"
          RELEASE_TARGET="$(gh release view nusa-android --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          CURRENT_VERSION="$(printf '%s' "$RELEASE_NAME" | sed -nE 's/^NUSA Android 1\.0\.([0-9]+)$/\1/p')"
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=0
          fi

          NEXT_VERSION=$((CURRENT_VERSION + 1))
          if [ "$VERSION_FLOOR" -gt "$NEXT_VERSION" ]; then
            RELEASE_VERSION="$VERSION_FLOOR"
          else
            RELEASE_VERSION="$NEXT_VERSION"
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RELEASE_TARGET" = "$SOURCE_SHA" ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Stable release already targets $SOURCE_SHA; Firebase-success finalization was therefore already reached."
              exit 0
            fi

            if [ -n "$RELEASE_TARGET" ]; then
              printf '%s' "$RELEASE_TARGET" | grep -Eq '^[0-9a-fA-F]{40}$' || {
                echo "::error::Stable release target is not an exact commit SHA: $RELEASE_TARGET"
                exit 1
              }
              git fetch --no-tags origin "$RELEASE_TARGET" "$SOURCE_SHA"
              if git diff --quiet "$RELEASE_TARGET" "$SOURCE_SHA" -- \
                apps/mobile \
                scripts/prepare-mobile-build-config.js \
                scripts/validate-android-release-contract.js \
                .github/android-release-contract.json \
                pnpm-lock.yaml \
                pnpm-workspace.yaml \
                package.json \
                .github/workflows/android-stable-release.yml; then
                echo "release=false" >> "$GITHUB_OUTPUT"
                echo "No Android release-relevant changes since stable source $RELEASE_TARGET."
                exit 0
              fi
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Promoting exact source $SOURCE_SHA as Android stable 1.0.$RELEASE_VERSION."

  build-and-publish:
    name: Build and publish exact stable APK
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Bind resolved release metadata
        id: release
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Validate exact Android release source contract
        id: contract
        run: |
          set -euo pipefail
          node scripts/validate-android-release-contract.js
          CONTRACT_SHA="$(sha256sum .github/android-release-contract.json | awk '{print $1}')"
          printf '%s' "$CONTRACT_SHA" | grep -Eq '^[0-9a-f]{64}$'
          echo "sha256=$CONTRACT_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare canonical mobile build configuration
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test -f scripts/prepare-mobile-build-config.js
          node scripts/prepare-mobile-build-config.js
          test -f apps/mobile/src/generatedBuildConfig.ts
          test -n "${EXPO_PUBLIC_NUSA_API_BASE_URL}"
          grep -F "export const CANONICAL_NUSA_ORIGIN = \"${EXPO_PUBLIC_NUSA_API_BASE_URL}\";" apps/mobile/src/generatedBuildConfig.ts
          grep -F "${NUSA_BUILD_SHA}" apps/mobile/src/generatedBuildConfig.ts
          ! grep -E 'localhost|127\.0\.0\.1|trycloudflare\.com' apps/mobile/src/generatedBuildConfig.ts

      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: Build stable release APK from clean source
        env:
          NUSA_BUILD_SHA: ${{ steps.release.outputs.sha }}
          NUSA_BUILD_NUMBER: ${{ steps.release.outputs.version }}
          NUSA_CANONICAL_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: ./gradlew clean :app:assembleRelease --no-build-cache
        working-directory: apps/mobile/android

      - name: Verify stable APK provenance and exact-source binding
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          EXPECTED_CONTRACT_SHA: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SHORT_SHA="${EXPECTED_SHA:0:8}"
          EXPECTED_VERSION_NAME="1.0.${EXPECTED_VERSION}-${SHORT_SHA}"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "versionCode='${EXPECTED_VERSION}'"
          printf '%s\n' "$BADGING" | grep -F "versionName='${EXPECTED_VERSION_NAME}'"

          RESOURCE_DUMP="$RUNNER_TEMP/stable-apk-resources.txt"
          "$AAPT" dump --values resources "$APK" > "$RESOURCE_DUMP"
          grep -F "$EXPECTED_SHA" "$RESOURCE_DUMP"
          grep -F "$EXPECTED_ORIGIN" "$RESOURCE_DUMP"

          APK_ENTRIES="$RUNNER_TEMP/stable-apk-entries.txt"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          BUNDLE_PATH="$(awk '/(^|\/)index\.android\.bundle$/ { print; exit }' "$APK_ENTRIES")"
          test -n "$BUNDLE_PATH"
          BUNDLE_FILE="$RUNNER_TEMP/index.android.bundle"
          unzip -p "$APK" "$BUNDLE_PATH" > "$BUNDLE_FILE"
          test -s "$BUNDLE_FILE"

          printf 'source_sha=%s\ncanonical_origin=%s\nconfig_mode=sealed\nversion_name=%s\nversion_code=%s\nrelease_contract_sha256=%s\nrelease_contract_validation=exact-source-pass\nrelease_mode=PAPER_SHADOW_ONLY\nlive_authority=NONE\nproduction_mutation_allowed=false\nai_authority=ZERO_AUTHORITY\nmobile_credential_storage_allowed=false\npaper_real_separation=true\nfail_closed=true\nui_marker=paper-learning-present\nchart_marker=market-chart-present\n' \
            "$EXPECTED_SHA" "$EXPECTED_ORIGIN" "$EXPECTED_VERSION_NAME" "$EXPECTED_VERSION" "$EXPECTED_CONTRACT_SHA" \
            > NUSA-Android.provenance.txt

      - name: Prepare stable APK assets
        run: |
          set -euo pipefail
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk NUSA-Android.apk
          sha256sum NUSA-Android.apk > NUSA-Android.apk.sha256

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify source is still current main before Firebase distribution
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$CURRENT_MAIN" != "$EXPECTED_SHA" ]; then
            echo "::error::Refusing stale Android Firebase distribution. Built $EXPECTED_SHA but current main is $CURRENT_MAIN."
            exit 1
          fi
          echo "Verified Firebase distribution source is current main: $EXPECTED_SHA"

      - name: Distribute stable APK to Firebase App Distribution
        id: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            if firebase appdistribution:distribute NUSA-Android.apk \
              --app "$FIREBASE_APP_ID" \
              --testers "desporin12@gmail.com" \
              --release-notes "NUSA Android stable 1.0.${RELEASE_VERSION} from exact source ${SHORT_SHA}"; then
              exit 0
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              echo "::error::Firebase distribution failed after 3 attempts. Stable GitHub release pointer remains unchanged."
              exit 1
            fi
            sleep $((ATTEMPT * 15))
          done

      - name: Record Firebase success evidence
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CONTRACT_SHA: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail
          APK_SHA="$(awk '{print $1}' NUSA-Android.apk.sha256)"
          printf 'source_sha=%s\nversion_code=%s\napk_sha256=%s\nrelease_contract_sha256=%s\nfirebase_outcome=success\n' \
            "$SOURCE_SHA" "$RELEASE_VERSION" "$APK_SHA" "$CONTRACT_SHA" \
            > NUSA-Android.firebase-success.txt

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Verify source is still current main before stable finalization
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$CURRENT_MAIN" != "$EXPECTED_SHA" ]; then
            echo "::error::Refusing stale Android stable finalization. Firebase received $EXPECTED_SHA but current main is $CURRENT_MAIN."
            exit 1
          fi
          echo "Verified stable finalization source is current main: $EXPECTED_SHA"

      - name: Create or update stable GitHub release after Firebase success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CONTRACT_SHA: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail
          NOTES="NUSA Android stable 1.0.${RELEASE_VERSION} from exact source ${SHORT_SHA}. PAPER/SHADOW only; LIVE authority NONE; AI ZERO_AUTHORITY; Firebase distribution verified; release contract ${CONTRACT_SHA:0:12}."
          if gh release view nusa-android >/dev/null 2>&1; then
            gh release upload nusa-android NUSA-Android.apk NUSA-Android.apk.sha256 NUSA-Android.provenance.txt NUSA-Android.firebase-success.txt --clobber
            gh release edit nusa-android --target "$TARGET_SHA" --title "NUSA Android 1.0.${RELEASE_VERSION}" --notes "$NOTES"
          else
            gh release create nusa-android NUSA-Android.apk NUSA-Android.apk.sha256 NUSA-Android.provenance.txt NUSA-Android.firebase-success.txt --target "$TARGET_SHA" --title "NUSA Android 1.0.${RELEASE_VERSION}" --notes "$NOTES"
          fi

      - name: Publish stable deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          FIREBASE_OUTCOME: ${{ steps.firebase.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          SOURCE="${SOURCE_SHA:-unresolved}"
          APK_SHA="unavailable"
          VERSION_NAME="unavailable"
          CHART_MARKER="unavailable"
          CONTRACT_SHA="unavailable"
          if [ -f NUSA-Android.apk.sha256 ]; then
            APK_SHA="$(awk '{print $1}' NUSA-Android.apk.sha256)"
          fi
          if [ -f NUSA-Android.provenance.txt ]; then
            VERSION_NAME="$(sed -n 's/^version_name=//p' NUSA-Android.provenance.txt)"
            CHART_MARKER="$(sed -n 's/^chart_marker=//p' NUSA-Android.provenance.txt)"
            CONTRACT_SHA="$(sed -n 's/^release_contract_sha256=//p' NUSA-Android.provenance.txt)"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Android stable deployment receipt

          - job_status: ${JOB_STATUS}
          - firebase_outcome: ${FIREBASE_OUTCOME:-not_run}
          - source_sha: ${SOURCE}
          - version_name: ${VERSION_NAME}
          - version_code: ${RELEASE_VERSION:-unavailable}
          - chart_marker: ${CHART_MARKER}
          - release_contract_sha256: ${CONTRACT_SHA}
          - apk_sha256: ${APK_SHA}
          - run: ${RUN_URL}
          EOF
          )
          gh issue comment 558 --body "$BODY"
