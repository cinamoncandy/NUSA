name: Android Stable Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit SHA to release (blank = current main)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve stable promotion candidate
    if: >-
      ${{
        (
          github.event_name != 'workflow_dispatch' ||
          github.ref == 'refs/heads/main'
        ) &&
        (
          github.event_name != 'workflow_run' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve exact CI-verified source and next version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          POINTER_SHA="$(tr -d '[:space:]' < .github/android-release-source.txt)"
          VERSION_FLOOR="$(tr -d '[:space:]' < .github/android-release-version.txt)"
          printf '%s' "$POINTER_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$VERSION_FLOOR" | grep -Eq '^[0-9]+$'
          test "$VERSION_FLOOR" -ge 102

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SOURCE_SHA="$WORKFLOW_RUN_SHA"
          else
            SOURCE_SHA="${DISPATCH_SHA:-}"
            if [ -z "$SOURCE_SHA" ]; then
              SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            fi
          fi
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'

          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$SOURCE_SHA" != "$CURRENT_MAIN" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI result $SOURCE_SHA; current main is $CURRENT_MAIN."
            exit 0
          fi
          if [ "$SOURCE_SHA" != "$CURRENT_MAIN" ]; then
            echo "::error::Refusing stale manual Android release source $SOURCE_SHA; current main is $CURRENT_MAIN."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CI_CONCLUSION="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_sha == "'"$SOURCE_SHA"'")][0].conclusion // empty'
            )"
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::error::Exact source $SOURCE_SHA does not have a successful CI run."
              exit 1
            fi
          fi

          RELEASE_NAME="$(gh release view nusa-android --json name --jq '.name' 2>/dev/null || true)"
          RELEASE_TARGET="$(gh release view nusa-android --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          CURRENT_VERSION="$(printf '%s' "$RELEASE_NAME" | sed -nE 's/^NUSA Android 1\.0\.([0-9]+)$/\1/p')"
          [ -n "$CURRENT_VERSION" ] || CURRENT_VERSION=0
          NEXT_VERSION=$((CURRENT_VERSION + 1))
          if [ "$VERSION_FLOOR" -gt "$NEXT_VERSION" ]; then RELEASE_VERSION="$VERSION_FLOOR"; else RELEASE_VERSION="$NEXT_VERSION"; fi

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$RELEASE_TARGET" = "$SOURCE_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Stable release already targets $SOURCE_SHA."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$RELEASE_TARGET" ]; then
            printf '%s' "$RELEASE_TARGET" | grep -Eq '^[0-9a-fA-F]{40}$'
            git fetch --no-tags origin "$RELEASE_TARGET" "$SOURCE_SHA"
            if git diff --quiet "$RELEASE_TARGET" "$SOURCE_SHA" -- \
              apps/mobile \
              scripts/prepare-mobile-build-config.js \
              scripts/validate-android-release-contract.js \
              .github/android-release-contract.json \
              pnpm-lock.yaml pnpm-workspace.yaml package.json \
              .github/workflows/android-stable-release.yml; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "No Android release-relevant changes since stable source $RELEASE_TARGET."
              exit 0
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  signing-readiness:
    name: Android release signing readiness
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      reason: ${{ steps.readiness.outputs.reason }}
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate protected signing configuration before build
        id: readiness
        env:
          KEYSTORE_B64: ${{ secrets.NUSA_ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NUSA_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -u
          block() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::error::ANDROID_RELEASE_SIGNING_CONFIGURATION_BLOCKED:$1"
            {
              echo "### Android release signing blocked"
              echo
              echo "- reason: \`$1\`"
              echo "- deployment_started: \`false\`"
              echo "- liveAuthority: \`NONE\`"
              echo "- productionMutationAllowed: \`false\`"
              echo "- aiAuthority: \`ZERO_AUTHORITY\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          KEYSTORE_B64="$(printf '%s' "${KEYSTORE_B64:-}" | tr -d '[:space:]')"
          STORE_PASSWORD="$(printf '%s' "${STORE_PASSWORD:-}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "${KEY_ALIAS:-}" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD:-}" | tr -d '\r\n')"
          EXPECTED_CERT_SHA256="$(printf '%s' "${CERT_SHA256:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          MISSING=()
          [ -n "$KEYSTORE_B64" ] || MISSING+=("NUSA_ANDROID_RELEASE_KEYSTORE_B64")
          [ -n "$STORE_PASSWORD" ] || MISSING+=("NUSA_ANDROID_RELEASE_STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || MISSING+=("NUSA_ANDROID_RELEASE_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || MISSING+=("NUSA_ANDROID_RELEASE_KEY_PASSWORD")
          [ -n "$EXPECTED_CERT_SHA256" ] || MISSING+=("NUSA_ANDROID_RELEASE_CERT_SHA256")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            block "missing:${MISSING[*]}"
          fi

          printf '%s' "$EXPECTED_CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$' || block "invalid:certificate-sha256"

          KEYSTORE_PATH="$RUNNER_TEMP/nusa-android-release-preflight.jks"
          VERIFY_PATH="$RUNNER_TEMP/nusa-android-release-preflight.p12"
          trap 'rm -f "$KEYSTORE_PATH" "$VERIFY_PATH"' EXIT

          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"; then
            block "invalid:keystore-base64"
          fi
          [ -s "$KEYSTORE_PATH" ] || block "invalid:keystore-empty"
          chmod 600 "$KEYSTORE_PATH"

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            block "invalid:keystore-or-store-password"
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            block "invalid:key-alias"
          fi

          if ! keytool -importkeystore -noprompt \
            -srckeystore "$KEYSTORE_PATH" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$VERIFY_PATH" \
            -deststoretype PKCS12 \
            -deststorepass "nusa-preflight-verification" >/dev/null 2>&1; then
            block "invalid:key-password"
          fi

          ACTUAL_CERT_SHA256="$(
            keytool -exportcert -rfc \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
              | openssl x509 -noout -fingerprint -sha256 \
              | sed 's/^.*=//' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          [ "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" ] || block "invalid:certificate-mismatch"

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"
          {
            echo "### Android release signing ready"
            echo
            echo "- protected signing inputs: normalized and verified"
            echo "- dedicated protected signing key: verified"
            echo "- signing certificate SHA-256: verified"
            echo "- deployment may proceed: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    name: Build and publish exact stable APK
    needs: [resolve, signing-readiness]
    if: needs.resolve.outputs.release == 'true' && needs.signing-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Bind resolved release metadata
        id: release
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify source is still current main before build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$CURRENT_MAIN" != "$EXPECTED_SHA" ]; then
            echo "::error::Refusing to build stale Android release source. Requested $EXPECTED_SHA but current main is $CURRENT_MAIN."
            exit 1
          fi
          echo "Verified build source is current main: $EXPECTED_SHA"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Validate exact Android release source contract
        id: contract
        run: |
          set -euo pipefail
          node scripts/validate-android-release-contract.js
          CONTRACT_SHA="$(sha256sum .github/android-release-contract.json | awk '{print $1}')"
          printf '%s' "$CONTRACT_SHA" | grep -Eq '^[0-9a-f]{64}$'
          echo "sha256=$CONTRACT_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare canonical mobile build configuration
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/prepare-mobile-build-config.js
          test -f apps/mobile/src/generatedBuildConfig.ts
          test -n "${EXPO_PUBLIC_NUSA_API_BASE_URL}"
          grep -F "export const CANONICAL_NUSA_ORIGIN = \"${EXPO_PUBLIC_NUSA_API_BASE_URL}\";" apps/mobile/src/generatedBuildConfig.ts
          grep -F "${NUSA_BUILD_SHA}" apps/mobile/src/generatedBuildConfig.ts
          ! grep -E 'localhost|127\.0\.0\.1|trycloudflare\.com' apps/mobile/src/generatedBuildConfig.ts

      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: Prepare protected Android release signing material
        env:
          KEYSTORE_B64: ${{ secrets.NUSA_ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NUSA_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="$(printf '%s' "${KEYSTORE_B64:-}" | tr -d '[:space:]')"
          STORE_PASSWORD="$(printf '%s' "${STORE_PASSWORD:-}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "${KEY_ALIAS:-}" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD:-}" | tr -d '\r\n')"
          CERT_SHA256="$(printf '%s' "${CERT_SHA256:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          test -n "$KEYSTORE_B64" || { echo '::error::NUSA_ANDROID_RELEASE_KEYSTORE_B64 missing'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo '::error::NUSA_ANDROID_RELEASE_STORE_PASSWORD missing'; exit 1; }
          test -n "$KEY_ALIAS" || { echo '::error::NUSA_ANDROID_RELEASE_KEY_ALIAS missing'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo '::error::NUSA_ANDROID_RELEASE_KEY_PASSWORD missing'; exit 1; }
          printf '%s' "$CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo '::error::NUSA_ANDROID_RELEASE_CERT_SHA256 must be 64 hex characters'; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/nusa-android-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" >/dev/null 2>&1 || { echo '::error::Android release keystore/store password validation failed'; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1 || { echo '::error::Android release key alias validation failed'; exit 1; }

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "NUSA_ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "NUSA_ANDROID_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSA_ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NUSA_ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NUSA_ANDROID_RELEASE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Build stable release APK from clean source
        env:
          NUSA_BUILD_SHA: ${{ steps.release.outputs.sha }}
          NUSA_BUILD_NUMBER: ${{ steps.release.outputs.version }}
          NUSA_CANONICAL_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: ./gradlew clean :app:assembleRelease --no-build-cache
        working-directory: apps/mobile/android

      - name: Verify stable APK provenance, signature, and exact-source binding
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          EXPECTED_CONTRACT_SHA: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SHORT_SHA="${EXPECTED_SHA:0:8}"
          EXPECTED_VERSION_NAME="1.0.${EXPECTED_VERSION}-${SHORT_SHA}"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "versionCode='${EXPECTED_VERSION}'"
          printf '%s\n' "$BADGING" | grep -F "versionName='${EXPECTED_VERSION_NAME}'"

          "$APKSIGNER" verify --verbose "$APK"
          CERT_DUMP="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_DUMP" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$NUSA_ANDROID_RELEASE_CERT_SHA256" || {
            echo "::error::Android release signing certificate mismatch"
            exit 1
          }

          RESOURCE_DUMP="$RUNNER_TEMP/stable-apk-resources.txt"
          "$AAPT" dump --values resources "$APK" > "$RESOURCE_DUMP"
          grep -F "$EXPECTED_SHA" "$RESOURCE_DUMP"
          grep -F "$EXPECTED_ORIGIN" "$RESOURCE_DUMP"

          APK_ENTRIES="$RUNNER_TEMP/stable-apk-entries.txt"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          BUNDLE_PATH="$(awk '/(^|\/)index\.android\.bundle$/ { print; exit }' "$APK_ENTRIES")"
          test -n "$BUNDLE_PATH"
          BUNDLE_FILE="$RUNNER_TEMP/index.android.bundle"
          unzip -p "$APK" "$BUNDLE_PATH" > "$BUNDLE_FILE"
          test -s "$BUNDLE_FILE"

          printf 'source_sha=%s\ncanonical_origin=%s\nconfig_mode=sealed\nversion_name=%s\nversion_code=%s\nrelease_contract_sha256=%s\nrelease_contract_validation=exact-source-pass\nrelease_signing=dedicated_protected_key\nrelease_cert_sha256=%s\nrelease_mode=PAPER_SHADOW_ONLY\nlive_authority=NONE\nproduction_mutation_allowed=false\nai_authority=ZERO_AUTHORITY\nmobile_credential_storage_allowed=false\npaper_real_separation=true\nfail_closed=true\nui_marker=paper-learning-present\nchart_marker=market-chart-present\n' \
            "$EXPECTED_SHA" "$EXPECTED_ORIGIN" "$EXPECTED_VERSION_NAME" "$EXPECTED_VERSION" "$EXPECTED_CONTRACT_SHA" "$ACTUAL_CERT_SHA256" \
            > NUSA-Android.provenance.txt

      - name: Prepare stable APK assets
        run: |
          set -euo pipefail
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk NUSA-Android.apk
          sha256sum NUSA-Android.apk > NUSA-Android.apk.sha256

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify source is still current main before Firebase distribution
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN" = "$EXPECTED_SHA" || { echo "::error::Refusing stale Android Firebase distribution"; exit 1; }

      - name: Distribute stable APK to Firebase App Distribution
        id: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            if firebase appdistribution:distribute NUSA-Android.apk --app "$FIREBASE_APP_ID" --testers "desporin12@gmail.com" --release-notes "NUSA Android stable 1.0.${RELEASE_VERSION} from exact source ${SHORT_SHA}"; then exit 0; fi
            [ "$ATTEMPT" -lt 3 ] || { echo "::error::Firebase distribution failed after 3 attempts"; exit 1; }
            sleep $((ATTEMPT * 15))
          done

      - name: Record Firebase success evidence
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CONTRACT_SHA: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail
          APK_SHA="$(awk '{print $1}' NUSA-Android.apk.sha256)"
          printf 'source_sha=%s\nversion_code=%s\napk_sha256=%s\nrelease_contract_sha256=%s\nrelease_cert_sha256=%s\nfirebase_outcome=success\n' \
            "$SOURCE_SHA" "$RELEASE_VERSION" "$APK_SHA" "$CONTRACT_SHA" "$NUSA_ANDROID_RELEASE_CERT_SHA256" > NUSA-Android.firebase-success.txt

      - name: Remove sensitive release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/nusa-android-release.jks"

      - name: Verify source is still current main before stable finalization
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN" = "$EXPECTED_SHA" || { echo "::error::Refusing stale Android stable finalization"; exit 1; }

      - name: Create or update stable GitHub release after Firebase success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CONTRACT_SHA: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail
          NOTES="NUSA Android stable 1.0.${RELEASE_VERSION} from exact source ${SHORT_SHA}. Dedicated protected release signing verified. PAPER/SHADOW only; LIVE authority NONE; AI ZERO_AUTHORITY; Firebase distribution verified; release contract ${CONTRACT_SHA:0:12}."
          if gh release view nusa-android >/dev/null 2>&1; then
            gh release upload nusa-android NUSA-Android.apk NUSA-Android.apk.sha256 NUSA-Android.provenance.txt NUSA-Android.firebase-success.txt --clobber
            gh release edit nusa-android --target "$TARGET_SHA" --title "NUSA Android 1.0.${RELEASE_VERSION}" --notes "$NOTES"
          else
            gh release create nusa-android NUSA-Android.apk NUSA-Android.apk.sha256 NUSA-Android.provenance.txt NUSA-Android.firebase-success.txt --target "$TARGET_SHA" --title "NUSA Android 1.0.${RELEASE_VERSION}" --notes "$NOTES"
          fi

      - name: Verify stable GitHub asset download integrity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256_FILE: NUSA-Android.apk.sha256
        run: |
          set -euo pipefail
          asset_metadata="$(mktemp)"
          headers_file="$(mktemp)"
          downloaded_apk="$(mktemp --suffix=.apk)"
          trap 'rm -f "$asset_metadata" "$headers_file" "$downloaded_apk"' EXIT

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/nusa-android" > "$asset_metadata"
          ASSET_METADATA="$asset_metadata" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.ASSET_METADATA, 'utf8'));
          const matches = (payload.assets || []).filter((asset) => asset?.name === 'NUSA-Android.apk');
          if (matches.length !== 1 || typeof matches[0].browser_download_url !== 'string') {
            throw new Error('Stable GitHub release must contain exactly one downloadable NUSA-Android.apk asset.');
          }
          const expectedUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/nusa-android/NUSA-Android.apk`;
          if (matches[0].browser_download_url !== expectedUrl) {
            throw new Error('Stable Android asset URL is outside the canonical GitHub release path.');
          }
          NODE

          asset_url="$(ASSET_METADATA="$asset_metadata" node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.ASSET_METADATA,'utf8')); const a=(p.assets||[]).find(x=>x?.name==='NUSA-Android.apk'); process.stdout.write(a.browser_download_url)")"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 \
            -D "$headers_file" -o "$downloaded_apk" "$asset_url"

          test -s "$downloaded_apk"
          content_type="$(awk 'BEGIN { IGNORECASE=1 } /^Content-Type:/ { gsub("\r", ""); value=$0; sub(/^[^:]*:[[:space:]]*/, "", value) } END { print value }' "$headers_file")"
          if [[ "$content_type" == text/html* || "$content_type" == application/xhtml* ]]; then
            echo '::error::Stable GitHub asset download returned HTML instead of an APK.'
            exit 1
          fi
          content_length="$(awk 'BEGIN { IGNORECASE=1 } /^Content-Length:/ { gsub("\r", ""); value=$2 } END { print value }' "$headers_file")"
          downloaded_size="$(wc -c < "$downloaded_apk" | tr -d '[:space:]')"
          if [[ -n "$content_length" && "$content_length" != "$downloaded_size" ]]; then
            echo "::error::Stable GitHub asset Content-Length mismatch: header=$content_length downloaded=$downloaded_size."
            exit 1
          fi
          apk_magic="$(od -An -tx1 -N2 "$downloaded_apk" | tr -d '[:space:]')"
          test "$apk_magic" = '504b' || { echo '::error::Stable GitHub asset is not a ZIP/APK.'; exit 1; }
          declared_sha="$(awk 'NR == 1 { print tolower($1) }' "$EXPECTED_SHA256_FILE")"
          downloaded_sha="$(sha256sum "$downloaded_apk" | awk '{ print tolower($1) }')"
          test "$declared_sha" = "$downloaded_sha" || {
            echo "::error::Stable GitHub asset SHA-256 mismatch: declared=$declared_sha downloaded=$downloaded_sha."
            exit 1
          }
          echo "Stable GitHub asset download integrity PASS: ${downloaded_size} bytes, sha256=${downloaded_sha}."

      - name: Publish stable deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          FIREBASE_OUTCOME: ${{ steps.firebase.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          APK_SHA="unavailable"
          VERSION_NAME="unavailable"
          CERT_SHA="unavailable"
          [ ! -f NUSA-Android.apk.sha256 ] || APK_SHA="$(awk '{print $1}' NUSA-Android.apk.sha256)"
          if [ -f NUSA-Android.provenance.txt ]; then
            VERSION_NAME="$(sed -n 's/^version_name=//p' NUSA-Android.provenance.txt)"
            CERT_SHA="$(sed -n 's/^release_cert_sha256=//p' NUSA-Android.provenance.txt)"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Android stable deployment receipt

          - job_status: ${JOB_STATUS}
          - firebase_outcome: ${FIREBASE_OUTCOME:-not_run}
          - source_sha: ${SOURCE_SHA:-unresolved}
          - version_name: ${VERSION_NAME}
          - version_code: ${RELEASE_VERSION:-unavailable}
          - release_cert_sha256: ${CERT_SHA}
          - apk_sha256: ${APK_SHA}
          - run: ${RUN_URL}
          EOF
          )
          gh issue comment 558 --body "$BODY"
