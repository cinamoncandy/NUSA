name: Autopilot Cloudflare Deploy

# Deploys the exact CI-verified Autopilot Worker revision. Autonomous coding validation runs on
# the canonical GitHub Actions execution consumer, so the Cloudflare deployment has no paid
# Containers dependency.

on:
  push:
    branches: [main]
    paths:
      - "apps/autopilot/**"
      - ".github/workflows/autopilot-cloudflare-deploy.yml"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact main revision to deploy (used when GITHUB_TOKEN-dispatched CI completion cannot fire workflow_run)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: nusa-autopilot-cloudflare-deploy
  cancel-in-progress: false

env:
  NUSA_WORKER_HEALTH_URL: https://nusa-autopilot.desporin12.workers.dev/health

jobs:
  deploy:
    name: Deploy exact CI-verified Worker revision
    if: >-
      ${{ github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CI-verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 1

      - name: Wait for exact-head CI success before deploying
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == env.HEAD_SHA)][0].conclusion // empty')"
            if [ "$conclusion" = "success" ]; then
              echo "Exact-head CI verified: $HEAD_SHA"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "Exact-head CI did not succeed for $HEAD_SHA: $conclusion"
              exit 1
            fi
            echo "Waiting for exact-head CI on $HEAD_SHA (attempt $attempt/30)..."
            sleep 20
          done
          echo "Timed out waiting for exact-head CI on $HEAD_SHA"
          exit 1

      - name: Verify exact current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale push ${HEAD_SHA}; current main is ${current}. A newer run will deploy it."
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo "Verified pushed revision is current main: $HEAD_SHA"

      - name: Enable pnpm via Corepack
        if: steps.revision.outputs.current == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        if: steps.revision.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare deployment credentials and account access
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured. HUMAN_ONLY blocker.'
            exit 1
          fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing or malformed. HUMAN_ONLY blocker.'
            exit 1
          fi
          if ! pnpm dlx wrangler@4.127.1 whoami --config apps/autopilot/wrangler.jsonc >/tmp/nusa-wrangler-whoami.log 2>&1; then
            cat /tmp/nusa-wrangler-whoami.log
            echo '::error::Cloudflare authentication/account preflight failed.'
            exit 1
          fi
          echo 'Cloudflare token/account preflight passed.'

      - name: Deploy exact CI-verified revision to Cloudflare Workers Free-compatible runtime
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.127.1 deploy \
            --config apps/autopilot/wrangler.jsonc \
            --var "NUSA_DEPLOYMENT_REVISION:${HEAD_SHA}"

      - name: Verify deployed Worker reports the exact-head revision and fail-closed authority
        if: steps.revision.outputs.current == 'true'
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            health="$(curl -sS --fail-with-body --max-time 20 "$NUSA_WORKER_HEALTH_URL" || true)"
            revision="$(printf '%s' "$health" | jq -r '.deploymentRevision // empty' 2>/dev/null || true)"
            live="$(printf '%s' "$health" | jq -r '.liveAuthority // empty' 2>/dev/null || true)"
            mutation="$(printf '%s' "$health" | jq -r 'if has("productionMutationAllowed") then (.productionMutationAllowed | tostring) else empty end' 2>/dev/null || true)"
            ai="$(printf '%s' "$health" | jq -r '.aiAuthority // empty' 2>/dev/null || true)"
            if [ "$revision" = "$HEAD_SHA" ] && [ "$live" = "NONE" ] && [ "$mutation" = "false" ] && [ "$ai" = "ZERO_AUTHORITY" ]; then
              echo "Verified deployed Worker revision and safety invariants: $revision"
              exit 0
            fi
            echo "Waiting for exact safe Worker revision ${HEAD_SHA} (currently ${revision:-unknown}), attempt $attempt/15..."
            sleep 10
          done
          echo "::error::Worker health never reported the exact safe deployed revision ${HEAD_SHA}. Failing closed."
          exit 1

      - name: Dispatch Runtime Proof directly for fresh observability
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job itself may have been started via a GITHUB_TOKEN-authenticated
          # workflow_dispatch call (see the Release workflow), whose completion does not fire workflow_run listeners on other workflows.
          # Autopilot Cloudflare Runtime Proof depends on exactly that workflow_run:[Autopilot Cloudflare Deploy]
          # chain for its post-deploy freshness check, so dispatch it directly instead
          # of relying on the chain (same pattern as the CI -> Deploy fix).
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-runtime-proof.yml/dispatches" -f ref=main
          echo "Dispatched Autopilot Cloudflare Runtime Proof for exact-main deploy verification."

      - name: Record fail-closed authority invariants
        if: always()
        run: |
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'AI authority=ZERO_AUTHORITY'