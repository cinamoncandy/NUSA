name: Autopilot Cloudflare Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: nusa-autopilot-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy nusa-autopilot Worker
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/autopilot
    steps:
      - name: Checkout exact CI-verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify deployment-relevant change
        id: changes
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          head_sha='${{ github.event.workflow_run.head_sha }}'
          changed="$(git diff-tree --no-commit-id --name-only -r "${head_sha}^" "${head_sha}")"
          if grep -Eq '^(apps/autopilot/|\.github/workflows/autopilot-cloudflare-deploy\.yml$)' <<<"$changed"; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'No autopilot deployment-relevant change in CI-verified commit.'
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pnpm via Corepack
        if: steps.changes.outputs.deploy == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
        working-directory: ${{ github.workspace }}

      - name: Install locked dependencies
        if: steps.changes.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Verify Cloudflare deployment credentials
        if: steps.changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Deploy exact CI-verified main revision
        if: steps.changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --var NUSA_DEPLOYMENT_REVISION:${{ github.event.workflow_run.head_sha }}
