name: Mobile Native

# Historical contract retained for older repository-only assertions; the active
# concurrency group below is event-independent.
# group: mobile-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
# Registration recovery keeps this workflow's trigger syntax canonical.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "apps/desktop/src/upbitRestAdapter*"
      - "apps/desktop/src/upbitWebSocket*"
      - "apps/desktop/src/liveTradingAdapter*"
      - "tests/mobile-native-structure.test.js"
      - "tests/mobile-uiux-v3-canonical.test.js"
      - "tests/mobile-cash-allocation-uiux-v3.test.js"
      - "scripts/security-backports.js"
      - "scripts/apply-security-backports.js"
      - ".github/workflows/mobile-native.yml"
      - "pnpm-lock.yaml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/mobile/**"
      - "apps/desktop/src/exchange/upbitRestAdapter*"
      - "apps/desktop/src/exchange/upbitWebSocket*"
      - "apps/desktop/src/exchange/liveTradingAdapter*"
      - "tests/mobile-native-structure.test.js"
      - "tests/mobile-uiux-v3-canonical.test.js"
      - "tests/mobile-cash-allocation-uiux-v3.test.js"
      - "scripts/security-backports.js"
      - "scripts/apply-security-backports.js"
      - ".github/workflows/mobile-native.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/mobile-native-structure.test.js

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Generate canonical mobile build configuration
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/prepare-mobile-build-config.js
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - run: |
          realpath apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          file apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          test -x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -help >/dev/null
      - run: ./gradlew :app:assembleDebug -PnusaEmbedDebugBundle
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
      - name: Verify the debug APK actually contains the JS bundle
        run: unzip -l apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.android.bundle'
      - name: Generate Android debug APK checksum
        run: sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-android-debug-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  ios-debug:
    if: ${{ false }}
    runs-on: macos-15
    steps:
      - run: 'echo "iOS skipped: NUSA mobile delivery is Android-only"'

  android-release-candidate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release-candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source identity and base ancestry
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git merge-base --is-ancestor "origin/$BASE_REF" HEAD
          fi
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Generate canonical mobile build configuration
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/prepare-mobile-build-config.js
      - name: Build TypeScript output for UI contract tests
        run: pnpm run build
      - name: Verify canonical mobile UI contracts before RC packaging
        run: >-
          node --test
          tests/mobile-design-system.test.js
          tests/mobile-markets-ui.test.js
          tests/mobile-paper-real-use-ui.test.js
          tests/mobile-settings-ui.test.js
          tests/mobile-trading-ui.test.js
          tests/mobile-uiux-v2.test.js
          tests/mobile-uiux-v3-canonical.test.js
          tests/mobile-cash-allocation-uiux-v3.test.js
          tests/uiux-002-phase2-visual-foundation.test.js
          tests/uiux-nav-chrome-closeout.test.js
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - run: |
          realpath apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          file apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          test -x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -help >/dev/null
      - name: Prepare protected Android release-candidate signing material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NUSA_ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NUSA_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="$(printf '%s' "${KEYSTORE_B64:-}" | tr -d '[:space:]')"
          STORE_PASSWORD="$(printf '%s' "${STORE_PASSWORD:-}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "${KEY_ALIAS:-}" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD:-}" | tr -d '\r\n')"
          EXPECTED_CERT_SHA256="$(printf '%s' "${CERT_SHA256:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [ -n "$KEYSTORE_B64" ] || { echo "::error::NUSA_ANDROID_RELEASE_SIGNING_REQUIRED:missing keystore"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "::error::NUSA_ANDROID_RELEASE_SIGNING_REQUIRED:missing store password"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::NUSA_ANDROID_RELEASE_SIGNING_REQUIRED:missing key alias"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::NUSA_ANDROID_RELEASE_SIGNING_REQUIRED:missing key password"; exit 1; }
          printf '%s' "$EXPECTED_CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::NUSA_ANDROID_RELEASE_SIGNING_REQUIRED:invalid certificate pin"; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/nusa-android-release-candidate.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ]
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_CERT_SHA256="$(
            keytool -exportcert -rfc \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
              | openssl x509 -noout -fingerprint -sha256 \
              | sed 's/^.*=//' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          [ "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::NUSA_ANDROID_RELEASE_SIGNING_REQUIRED:certificate mismatch"; exit 1; }
          echo "NUSA_ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Assemble exact-head Android release candidate
        run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_STORE_PASSWORD }}
          NUSA_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_ALIAS }}
          NUSA_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.NUSA_ANDROID_RELEASE_KEY_PASSWORD }}
      - name: Seal Android release candidate provenance
        shell: bash
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_RUN_ID: ${{ github.run_id }}
          NUSA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "app-release.apk" > "$OUT/app-release.apk.sha256"
          cat > "$OUT/provenance.json" <<EOF
          {
            "repository": "$NUSA_REPOSITORY",
            "sourceSha": "$NUSA_BUILD_SHA",
            "runNumber": "$NUSA_BUILD_NUMBER",
            "runId": "$NUSA_RUN_ID",
            "apk": "app-release.apk",
            "apkSha256": "$APK_SHA256"
          }
          EOF
          grep -F "\"sourceSha\": \"$NUSA_BUILD_SHA\"" "$OUT/provenance.json"
          grep -F "\"apkSha256\": \"$APK_SHA256\"" "$OUT/provenance.json"
      - name: Upload exact-head Android release candidate APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-android-rc-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/mobile/android/app/build/outputs/apk/release/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove protected Android release-candidate signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "${NUSA_ANDROID_RELEASE_KEYSTORE_PATH:-}"

  ios-release-candidate:
    if: ${{ false }}
    runs-on: macos-15
    steps:
      - run: 'echo "iOS release candidate skipped: NUSA mobile delivery is Android-only"'
