name: Mobile Native

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/mobile/**"
      - "apps/desktop/src/upbitRestAdapter*"
      - "apps/desktop/src/upbitWebSocket*"
      - "apps/desktop/src/liveTradingAdapter*"
      - "tests/mobile-native-structure.test.js"
      - "scripts/security-backports.js"
      - "scripts/apply-security-backports.js"
      - ".github/workflows/mobile-native.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/mobile-native-structure.test.js

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - run: |
          realpath apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          file apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          test -x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -help >/dev/null
      - run: ./gradlew :app:assembleDebug
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
      - name: Generate Android debug APK checksum
        run: sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-android-debug-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  ios-debug:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pod install
        working-directory: apps/mobile/ios
      - run: xcodebuild -workspace NusaMobile.xcworkspace -scheme NusaMobile -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/mobile/ios

  android-release-candidate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release-candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source identity and base ancestry
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git merge-base --is-ancestor "origin/$BASE_REF" HEAD
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical mobile UI contracts before RC packaging
        run: >-
          node --test
          tests/mobile-design-system.test.js
          tests/mobile-markets-ui.test.js
          tests/mobile-paper-real-use-ui.test.js
          tests/mobile-settings-ui.test.js
          tests/mobile-trading-ui.test.js
          tests/mobile-uiux-v2.test.js
          tests/uiux-002-phase2-visual-foundation.test.js
          tests/uiux-nav-chrome-closeout.test.js
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - run: |
          realpath apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          file apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          test -x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
          apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -help >/dev/null
      - name: Assemble exact-head Android release candidate
        run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
      - name: Seal Android release candidate provenance
        shell: bash
        env:
          NUSA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_RUN_ID: ${{ github.run_id }}
          NUSA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "app-release.apk" > "$OUT/app-release.apk.sha256"
          cat > "$OUT/provenance.json" <<EOF
          {
            "repository": "$NUSA_REPOSITORY",
            "sourceSha": "$NUSA_BUILD_SHA",
            "runNumber": "$NUSA_BUILD_NUMBER",
            "runId": "$NUSA_RUN_ID",
            "apk": "app-release.apk",
            "apkSha256": "$APK_SHA256"
          }
          EOF
          grep -F "\"sourceSha\": \"$NUSA_BUILD_SHA\"" "$OUT/provenance.json"
          grep -F "\"apkSha256\": \"$APK_SHA256\"" "$OUT/provenance.json"
      - name: Upload exact-head Android release candidate APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-android-rc-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/mobile/android/app/build/outputs/apk/release/provenance.json
          if-no-files-found: error
          retention-days: 14

  ios-release-candidate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pod install
        working-directory: apps/mobile/ios
      - run: xcodebuild -workspace NusaMobile.xcworkspace -scheme NusaMobile -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/mobile/ios
