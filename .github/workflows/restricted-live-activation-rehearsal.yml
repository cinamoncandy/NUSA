name: Restricted LIVE Activation Rehearsal

on:
  push:
    branches: ["agent/restricted-live-activation-gate-rehearsal"]
  pull_request:
    branches: [main]

concurrency:
  group: restricted-live-activation-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Activation gate rehearsal regressions
        run: node --test --test-reporter=spec tests/restricted-live-activation-rehearsal.test.js
      - name: Activation gate rehearsal evidence
        run: node scripts/restricted-live-activation-rehearsal.js --output artifacts/operational-evidence/restricted-live-activation-rehearsal.json
      - name: Upload activation rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restricted-live-activation-gate-rehearsal-evidence
          path: artifacts/operational-evidence/restricted-live-activation-rehearsal.json
          if-no-files-found: error
          retention-days: 14
