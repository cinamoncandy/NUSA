name: Autopilot Deterministic Audit Release

on:
  repository_dispatch:
    types: [nusa_autopilot_audit]

permissions: {}

concurrency:
  group: deterministic-audit-release-${{ github.event.client_payload.dedupe_key }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event.client_payload.kind == 'AUDIT_REQUEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      applicable: ${{ steps.audit.outputs.applicable }}
      authority: ${{ steps.audit.outputs.authority }}
      audited_base: ${{ steps.audit.outputs.audited_base }}
    steps:
      - name: Validate and bind deterministic Audit authority
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nusa-deterministic-audit"

          node - <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const p = event.client_payload || {};
          const fail = (m) => { console.error(m); process.exit(1); };
          if (p.kind !== 'AUDIT_REQUEST') fail('unexpected Audit request kind');
          if (p.repository !== process.env.GITHUB_REPOSITORY) fail('repository mismatch');
          if (!Number.isSafeInteger(p.pr_number) || p.pr_number <= 0) fail('invalid PR number');
          if (!/^[0-9a-f]{40}$/i.test(p.head_sha || '')) fail('invalid exact head SHA');
          if (!Number.isSafeInteger(p.workflow_run_id) || p.workflow_run_id <= 0) fail('invalid CI run id');
          if (p.live_authority !== 'NONE') fail('liveAuthority must remain NONE');
          if (p.production_mutation_allowed !== false) fail('productionMutationAllowed must remain false');
          if (p.ai_authority !== 'ZERO_AUTHORITY') fail('aiAuthority must remain ZERO_AUTHORITY');
          NODE

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/nusa-deterministic-audit/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/nusa-deterministic-audit/main.json"

          current_state="$(jq -r '.state' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_draft="$(jq -r '.draft // false' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_head="$(jq -r '.head.sha // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_base="$(jq -r '.base.sha // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          base_ref="$(jq -r '.base.ref // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          base_repo="$(jq -r '.base.repo.full_name // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_main="$(jq -r '.commit.sha // empty' "$RUNNER_TEMP/nusa-deterministic-audit/main.json")"

          if [ "$current_state" != "open" ] || [ "$current_draft" = "true" ] || [ "$current_head" != "$REQUESTED_HEAD" ] || [ "$base_ref" != "main" ] || [ "$base_repo" != "$GITHUB_REPOSITORY" ] || [ "$current_base" != "$current_main" ]; then
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
            echo 'authority=NONE' >> "$GITHUB_OUTPUT"
            echo "audited_base=$current_main" >> "$GITHUB_OUTPUT"
            echo "NO_ACTION stale/non-releasable Audit request: state=$current_state draft=$current_draft requested_head=$REQUESTED_HEAD current_head=$current_head base=$current_base main=$current_main"
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" > "$RUNNER_TEMP/nusa-deterministic-audit/ci.json"
          jq -e --arg head "$REQUESTED_HEAD" --arg repo "$GITHUB_REPOSITORY" '
            .name == "CI" and
            .path == ".github/workflows/ci.yml" and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $head and
            .repository.full_name == $repo
          ' "$RUNNER_TEMP/nusa-deterministic-audit/ci.json" >/dev/null

          required_workflows=(
            "CI"
            "Actual PAPER Public-Market Runtime Evidence"
            "Read-only Broker Credential Integration"
            "Restricted LIVE Capability Surface Guard"
            "Restricted LIVE Transport Credential Readiness"
            "Restricted LIVE Activation Rehearsal"
          )

          required_ready=false
          for poll in $(seq 1 30); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REQUESTED_HEAD&event=pull_request&per_page=100" > "$RUNNER_TEMP/nusa-deterministic-audit/exact-head-runs.json"
            required_ready=true
            for required in "${required_workflows[@]}"; do
              conclusion="$(jq -r --arg name "$required" --arg head "$REQUESTED_HEAD" '
                [.workflow_runs[] | select(.name == $name and .head_sha == $head)]
                | sort_by(.updated_at) | reverse | .[0].conclusion // empty
              ' "$RUNNER_TEMP/nusa-deterministic-audit/exact-head-runs.json")"
              if [ "$conclusion" != "success" ]; then
                required_ready=false
                echo "Waiting for exact-head workflow: $required (conclusion=${conclusion:-pending}, poll $poll/30)"
              fi
            done
            if [ "$required_ready" = "true" ]; then break; fi
            sleep 10
          done
          if [ "$required_ready" != "true" ]; then
            echo "Required exact-head workflows did not converge to success before the bounded Audit deadline." >&2
            exit 1
          fi

          # Workflow SUCCESS is transport-level only. Release remains bound to immutable
          # exact-head PAPER safety/provenance evidence; stochastic order/fill/PnL completion
          # remains a separate readiness certification and is never manufactured here.
          paper_run_id="$(jq -r --arg head "$REQUESTED_HEAD" '
            [.workflow_runs[] | select(
              .name == "Actual PAPER Public-Market Runtime Evidence" and
              .path == ".github/workflows/wo-0059-actual-paper-runtime.yml" and
              .head_sha == $head and
              .event == "pull_request" and
              .status == "completed" and
              .conclusion == "success"
            )] | sort_by(.updated_at) | reverse | .[0].id // empty
          ' "$RUNNER_TEMP/nusa-deterministic-audit/exact-head-runs.json")"
          test -n "$paper_run_id"

          paper_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$paper_run_id")"
          jq -e --arg head "$REQUESTED_HEAD" --arg repo "$GITHUB_REPOSITORY" '
            .name == "Actual PAPER Public-Market Runtime Evidence" and
            .path == ".github/workflows/wo-0059-actual-paper-runtime.yml" and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $head and
            .repository.full_name == $repo
          ' <<<"$paper_run" >/dev/null

          paper_artifact_name="wo-0059-actual-paper-runtime-evidence-$REQUESTED_HEAD"
          paper_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$paper_run_id/artifacts?per_page=100")"
          paper_artifact="$(jq -c --arg name "$paper_artifact_name" --arg head "$REQUESTED_HEAD" '
            [.artifacts[] | select(
              .name == $name and
              .expired == false and
              .workflow_run.head_sha == $head and
              (.digest | type == "string" and test("^sha256:[a-fA-F0-9]{64}$"))
            )] | sort_by(.updated_at) | reverse | .[0] // empty
          ' <<<"$paper_artifacts")"
          test -n "$paper_artifact"
          paper_artifact_id="$(jq -r '.id' <<<"$paper_artifact")"
          paper_artifact_digest="$(jq -r '.digest' <<<"$paper_artifact")"

          mkdir -p "$RUNNER_TEMP/nusa-deterministic-audit/paper"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$paper_artifact_id/zip" > "$RUNNER_TEMP/nusa-deterministic-audit/paper.zip"
          unzip -q "$RUNNER_TEMP/nusa-deterministic-audit/paper.zip" -d "$RUNNER_TEMP/nusa-deterministic-audit/paper"
          paper_evidence="$(find "$RUNNER_TEMP/nusa-deterministic-audit/paper" -type f -name 'actual-paper-runtime-e2e.json' -print -quit)"
          test -n "$paper_evidence"

          # Validator is always fetched from the already-bound audited main base. PR-head
          # code can never weaken this validation and self-authorize Release.
          paper_validator="$RUNNER_TEMP/nusa-deterministic-audit/validate-deterministic-paper-audit-evidence.js"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/validate-deterministic-paper-audit-evidence.js?ref=$current_main" --jq '.content' | base64 --decode > "$paper_validator"
          node "$paper_validator" "$paper_evidence" "$REQUESTED_HEAD" "$paper_run_id" "$paper_artifact_id" "$paper_artifact_name" "$paper_artifact_digest"

          final_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          final_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$(jq -r '.state' <<<"$final_pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$final_pr")" = "false"
          test "$(jq -r '.head.sha' <<<"$final_pr")" = "$REQUESTED_HEAD"
          test "$(jq -r '.base.sha' <<<"$final_pr")" = "$current_main"
          test "$final_main" = "$current_main"

          echo 'applicable=true' >> "$GITHUB_OUTPUT"
          echo 'authority=DETERMINISTIC_AUDIT_PASS' >> "$GITHUB_OUTPUT"
          echo "audited_base=$current_main" >> "$GITHUB_OUTPUT"
          echo "Deterministic Audit PASS: pr=$PR_NUMBER head=$REQUESTED_HEAD base=$current_main ci=$WORKFLOW_RUN_ID paper_run=$paper_run_id paper_artifact=$paper_artifact_id"
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'

  release:
    needs: audit
    if: ${{ needs.audit.result == 'success' && needs.audit.outputs.applicable == 'true' && needs.audit.outputs.authority == 'DETERMINISTIC_AUDIT_PASS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nusa-release-authority
    concurrency:
      group: deterministic-release-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      EXPECTED_HEAD: ${{ github.event.client_payload.head_sha }}
      AUDITED_BASE: ${{ needs.audit.outputs.audited_base }}
      NUSA_RELEASE_AUTHORITY_APP_ID: ${{ secrets.NUSA_RELEASE_AUTHORITY_APP_ID }}
      NUSA_RELEASE_AUTHORITY_PRIVATE_KEY: ${{ secrets.NUSA_RELEASE_AUTHORITY_PRIVATE_KEY }}
      RELEASE_AUTHORITY_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Re-verify expected head and audited base
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$pr")" = "false"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
          test "$main" = "$AUDITED_BASE"

      - name: Publish dedicated-App exact-head merge authorization
        id: release_authority
        run: |
          set -euo pipefail
          app_id="$(printf '%s' "${NUSA_RELEASE_AUTHORITY_APP_ID:-}" | tr -d '[:space:]')"
          private_key="${NUSA_RELEASE_AUTHORITY_PRIVATE_KEY:-}"
          if [ -z "$app_id" ] && [ -z "$private_key" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Release authority App is not configured yet; canonical Release continues in bootstrap mode.'
            exit 0
          fi
          if [ -z "$app_id" ] || [ -z "$private_key" ]; then
            echo '::error::Release authority GitHub App configuration is partial.'
            exit 1
          fi

          # Recheck immediately before issuing the status that repository protection will trust.
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$pr")" = "false"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
          test "$main" = "$AUDITED_BASE"

          helper="$RUNNER_TEMP/publish-release-authority-status.js"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/publish-release-authority-status.js?ref=$AUDITED_BASE" --jq '.content' | base64 --decode > "$helper"
          node "$helper" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$EXPECTED_HEAD" \
            --state success \
            --audited-base "$AUDITED_BASE" \
            --pr "$PR_NUMBER" \
            --target-url "$RELEASE_AUTHORITY_TARGET_URL"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo "Dedicated release authority published for exact head $EXPECTED_HEAD and audited base $AUDITED_BASE."

      - name: Canonical expected-head merge
        id: merge
        run: |
          set -euo pipefail

          # One final no-stale-head/no-stale-base recheck closes the race between status
          # publication and the SHA-bound merge API call.
          premerge_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          premerge_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$(jq -r '.state' <<<"$premerge_pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$premerge_pr")" = "false"
          test "$(jq -r '.head.sha' <<<"$premerge_pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$premerge_pr")" = "main"
          test "$(jq -r '.base.sha' <<<"$premerge_pr")" = "$AUDITED_BASE"
          test "$premerge_main" = "$AUDITED_BASE"

          merge_api_ok=false
          if result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$EXPECTED_HEAD" -f merge_method=merge)"; then
            if jq -e '.merged == true' <<<"$result" >/dev/null; then
              merge_api_ok=true
            else
              echo "Merge API returned without merged=true; verifying fail-closed whether an equivalent exact-head merge completed concurrently."
            fi
          else
            echo "Merge API failed; verifying fail-closed whether an equivalent exact-head merge completed concurrently."
          fi

          verified_merge_sha=''
          for poll in $(seq 1 5); do
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            merged="$(jq -r '.merged // false' <<<"$pr")"
            head="$(jq -r '.head.sha // empty' <<<"$pr")"
            base_ref="$(jq -r '.base.ref // empty' <<<"$pr")"
            base="$(jq -r '.base.sha // empty' <<<"$pr")"
            merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr")"

            if [ "$merged" = "true" ] && [ "$head" = "$EXPECTED_HEAD" ] && [ "$base_ref" = "main" ] && [ "$base" = "$AUDITED_BASE" ] && [[ "$merge_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              merge_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha")"
              parent_count="$(jq -r '.parents | length' <<<"$merge_commit")"
              parent_base="$(jq -r '.parents[0].sha // empty' <<<"$merge_commit")"
              parent_head="$(jq -r '.parents[1].sha // empty' <<<"$merge_commit")"
              if [ "$parent_count" = "2" ] && [ "$parent_base" = "$AUDITED_BASE" ] && [ "$parent_head" = "$EXPECTED_HEAD" ]; then
                current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
                if [ "$current_main" = "$merge_sha" ]; then
                  verified_merge_sha="$merge_sha"
                  break
                fi
                ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$merge_sha...$current_main" --jq '.status' 2>/dev/null || true)"
                if [ "$ancestry" = "ahead" ]; then
                  verified_merge_sha="$merge_sha"
                  break
                fi
              fi
            fi
            echo "Waiting for exact-head merge race to settle (poll $poll/5)..."
            sleep 1
          done

          if [ -z "$verified_merge_sha" ]; then
            if [ "$merge_api_ok" = "true" ]; then
              echo "::error::Merge API reported success, but the resulting merge could not be bound to audited base $AUDITED_BASE and exact head $EXPECTED_HEAD."
            else
              echo "::error::Merge API failed and no equivalent audited exact-head merge could be proven."
            fi
            exit 1
          fi

          echo "merged_main=$verified_merge_sha" >> "$GITHUB_OUTPUT"
          echo "Canonical deterministic Release bound PR #$PR_NUMBER to merge $verified_merge_sha at exact head $EXPECTED_HEAD and audited base $AUDITED_BASE"
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'

      - name: Revoke dedicated-App authorization if canonical merge failed
        if: ${{ failure() && steps.release_authority.outputs.configured == 'true' && steps.merge.outcome == 'failure' }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/publish-release-authority-status.js"
          if [ ! -f "$helper" ]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/scripts/publish-release-authority-status.js?ref=$AUDITED_BASE" --jq '.content' | base64 --decode > "$helper"
          fi
          node "$helper" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$EXPECTED_HEAD" \
            --state error \
            --audited-base "$AUDITED_BASE" \
            --pr "$PR_NUMBER" \
            --target-url "$RELEASE_AUTHORITY_TARGET_URL"
          echo "Revoked dedicated release authorization after canonical merge failure."

      - name: Start canonical post-merge main CI
        id: ci
        env:
          MERGED_MAIN: ${{ steps.merge.outputs.merged_main }}
        run: |
          set -euo pipefail
          test -n "$MERGED_MAIN"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          echo "merged_main=$MERGED_MAIN" >> "$GITHUB_OUTPUT"
          if [ "$current_main" != "$MERGED_MAIN" ]; then
            echo "Main advanced from audited merge $MERGED_MAIN to $current_main; newer Release/watchdog owns convergence."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Dispatched canonical main CI for merged revision $MERGED_MAIN"

      - name: Recover post-merge CI retries and dispatch Cloudflare Deploy
        env:
          MERGED_MAIN: ${{ steps.ci.outputs.merged_main }}
        run: |
          set -euo pipefail
          success=false
          for poll in $(seq 1 40); do
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [ "$current_main" != "$MERGED_MAIN" ]; then
              echo "Main advanced from $MERGED_MAIN to $current_main; newer Release/watchdog owns convergence."
              exit 0
            fi

            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGED_MAIN&per_page=100")"
            successful_run="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and .conclusion == "success")][0].id // empty' <<<"$runs")"
            if [ -n "$successful_run" ]; then
              echo "Post-merge CI SUCCESS recovered for $MERGED_MAIN via run $successful_run."
              success=true
              break
            fi

            active_count="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "pending"))] | length' <<<"$runs")"
            if [ "$active_count" -gt 0 ]; then
              echo "Waiting for active post-merge CI on $MERGED_MAIN (poll $poll/40)..."
              sleep 20
              continue
            fi

            failed_run_id="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | sort_by(.updated_at) | reverse | .[0].id // empty' <<<"$runs")"
            failed_attempt="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | sort_by(.updated_at) | reverse | .[0].run_attempt // 0' <<<"$runs")"
            if [ -n "$failed_run_id" ]; then
              if [ "$failed_attempt" -ge 3 ]; then
                echo "::error::Post-merge CI retry budget exhausted for $MERGED_MAIN after attempt $failed_attempt."
                exit 1
              fi
              echo "Post-merge CI attempt $failed_attempt failed; requesting bounded rerun for run $failed_run_id."
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id/rerun-failed-jobs" >/dev/null; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id/rerun" >/dev/null
              fi
              sleep 20
              continue
            fi
            echo "Waiting for post-merge CI run creation on $MERGED_MAIN (poll $poll/40)..."
            sleep 20
          done

          if [ "$success" != "true" ]; then
            echo "::error::Post-merge CI for $MERGED_MAIN produced no successful attempt before timeout."
            exit 1
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$MERGED_MAIN" ]; then
            echo "Main advanced after CI recovery; newer convergence chain owns deployment."
            exit 0
          fi
          echo "Post-merge CI verified for $MERGED_MAIN; dispatching Cloudflare Deploy directly."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-deploy.yml/dispatches" -f ref=main -f "inputs[head_sha]=$MERGED_MAIN"

      - name: Dispatch exact-main runtime evidence and CI-gated downstream workflows directly
        env:
          MERGED_MAIN: ${{ steps.ci.outputs.merged_main }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$CURRENT_MAIN" != "$MERGED_MAIN" ]; then
            echo "Main advanced from $MERGED_MAIN to $CURRENT_MAIN; newer Release chain owns post-merge evidence."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/wo-0059-actual-paper-runtime.yml/dispatches" -f ref=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-promote.yml/dispatches" -f ref=main -f "inputs[head_sha]=$MERGED_MAIN"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-stable-release-trigger.yml/dispatches" -f ref=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/windows-desktop-stable-release.yml/dispatches" -f ref=main
          echo "Dispatched Actual PAPER runtime evidence, Cloudflare Promote, Android stable trigger, and Windows Desktop Stable Release for $MERGED_MAIN."
