name: Research Alpha Lab cohort 1 recorder

# Daily forward recorder for docs/RESEARCH_PREREG_2026-11-28_ALPHA_LAB_COHORT1.md. GitHub-hosted, public Upbit daily candles only,
# no secret, no host access, no order path. Writes append-only rows to the branch alpha-lab-records (cohort1/).

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-alpha-lab-cohort1
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Self-test
        run: node scripts/alpha-lab/cohort1.js self-test
      - name: Check out the records branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin alpha-lab-records >/dev/null; then
            git fetch --depth 1 origin alpha-lab-records
            git worktree add "$RUNNER_TEMP/records" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/records"
            (cd "$RUNNER_TEMP/records" && git checkout --orphan alpha-lab-records && git rm -rq . || true)
          fi
      - name: Record
        run: node scripts/alpha-lab/cohort1.js record "$RUNNER_TEMP/records/cohort1"
      - name: Commit the rows
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/records"
          [ -d cohort1 ] || { echo "nothing recorded yet"; exit 0; }
          git add cohort1
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="nusa-alpha-lab-recorder" -c user.email="nusa-alpha-lab-recorder@users.noreply.github.com" commit -q -m "alpha-lab cohort1: rows through $(date -u -d yesterday +%F)"
          git push origin HEAD:alpha-lab-records
