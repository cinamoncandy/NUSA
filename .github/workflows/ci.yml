name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Control audit ledger tests
        run: node --test --test-reporter=spec tests/control-audit-ledger.test.js
      - name: Control command processor tests
        run: node --test --test-reporter=spec tests/control-command-processor.test.js
      - name: Transactional control service tests
        run: node --test --test-reporter=spec tests/transactional-control-command-service.test.js
      - name: Full test suite
        run: node --test --test-reporter=spec tests/*.test.js
