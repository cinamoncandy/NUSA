name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/android-preview-source.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Workflow action supply-chain pins
        run: node scripts/validate-workflow-action-pins.js
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm run preflight
      - name: Safety input literals (capability gates must not be handed constants)
        run: pnpm run safety:inputs
      - name: Security gate
        run: pnpm run security:gate
      - name: Release artifact security gate
        if: hashFiles('release/build-manifest.json') != ''
        run: pnpm run security:artifacts
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            docs/audits/dependency-audit-*.md
            docs/audits/secret-scan-*.md
            docs/audits/security-hardening-*.md
            docs/audits/sbom-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Read-only MCP gateway regression
        run: node --test --test-reporter=spec tests/nusa-mcp-gateway.test.js
      - name: Backend hardening regression (WO-0053)
        run: >-
          node --test --test-reporter=spec
          tests/cloud-paper-trading-execution-loop.test.js
          tests/cloud-dashboard-persistence.test.js
          tests/cloud-dashboard-server.test.js
          tests/cloud-rate-limit.test.js
          tests/firebase-config.test.js
          tests/operator-user-access.test.js
          tests/storage-migrations.test.js
          tests/recovery-reconciliation.test.js
      - name: Firebase readiness configuration
        run: pnpm run firebase:validate
      - name: High-signal regression fast gate
        run: node --test --test-reporter=spec tests/mobile-order-history.test.js tests/mobile-watchlist.test.js tests/p8-private-readonly-runtime-session.test.js tests/p8-open-representative-position.test.js
      - name: Architecture validation
        run: pnpm run architecture:check
      - name: Repository architecture truth validation
        run: pnpm run architecture:truth
      - name: AI zero-authority architecture validation
        run: pnpm run ai:architecture
      - name: AI zero-authority focused regression tests
        run: node --test --test-reporter=spec tests/ai-inference.test.js tests/ai-orchestrator.test.js tests/ai-zero-authority-guard.test.js
      - name: Architecture change lifecycle validation
        run: pnpm run architecture:lifecycle
      - name: Architecture change lifecycle regression tests
        run: node --test --test-reporter=spec tests/architecture-change-lifecycle.test.js
      - name: Architecture/AIPOS drift validation
        run: pnpm run aipos:drift
      - name: AIPOS verified-state evidence integrity
        run: node scripts/validate-aipos-evidence.js
      - name: AIPOS regression tests
        run: node --test --test-reporter=spec tests/aipos-evidence-integrity.test.js tests/aipos-work-order-provenance.test.js tests/aipos-cross-ai-conformance.test.js
      - name: AIPOS work-order provenance reconciliation
        run: pnpm run aipos:provenance
      - name: AIPOS cross-AI handoff conformance
        run: pnpm run aipos:conformance
      - name: Capability contract registry validation
        run: pnpm run capability:check
      - name: Capability contract registry regression tests
        run: node --test --test-reporter=spec tests/capability-contract-registry.test.js
      - name: Champion/Challenger governance validation
        run: pnpm run research:champion-challenger
      - name: Champion/Challenger governance regression tests
        run: node --test --test-reporter=spec tests/champion-challenger-governance.test.js
      - name: Data & Strategy Identity validation
        run: pnpm run identity:check
      - name: Data & Strategy Identity regression tests
        run: node --test --test-reporter=spec tests/data-strategy-identity.test.js
      - name: Deployment bundle validation
        run: pnpm run deployment:check
      - name: Deployment / Rollback regression tests
        run: node --test --test-reporter=spec tests/deployment-rollback-governance.test.js
      - name: Safety Architecture validation
        run: pnpm run safety:architecture
      - name: Safety Architecture regression tests
        run: node --test --test-reporter=spec tests/safety-architecture.test.js
      - name: Shadow governance validation
        run: pnpm run shadow:check
      - name: Shadow governance regression tests
        run: node --test --test-reporter=spec tests/shadow-governance.test.js
      - name: Restricted LIVE governance validation
        run: pnpm run restricted-live:check
      - name: Restricted LIVE regression tests
        run: node --test --test-reporter=spec tests/restricted-live-governance.test.js tests/restricted-live-operational-readiness.test.js
      - name: Restricted LIVE operational readiness verification
        run: pnpm run restricted-live:readiness -- --output artifacts/operational-evidence/restricted-live-readiness.json
      - name: Upload Restricted LIVE readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restricted-live-operational-readiness-evidence
          path: artifacts/operational-evidence/restricted-live-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Operational evidence harness regression tests
        run: node --test --test-reporter=spec tests/operational-evidence-harness.test.js
      - name: PAPER runtime operational verification
        run: pnpm run verify:paper-runtime -- --output artifacts/operational-evidence/paper-runtime.json
      - name: Upload PAPER runtime operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-runtime-operational-evidence
          path: artifacts/operational-evidence/paper-runtime.json
          if-no-files-found: error
          retention-days: 14
      - name: Lint
        run: pnpm run lint
      - name: Package validation
        run: pnpm run package:validate
      - name: Release validation
        run: pnpm run release:check:prepared
      - name: Deployment capability scan (live trading / credential storage must be absent)
        run: node scripts/build-deployment-descriptor.js --dist dist --output deployment-descriptor.json
      - name: Risk safety drills
        run: node scripts/run-risk-safety-drills.js
      - name: Paper pilot promotion gate (prohibited capabilities must be absent)
        run: node scripts/verify-paper-pilot-evidence.js
      - name: Shadow pilot verification (no real broker mutation)
        run: node scripts/run-shadow-paper-pilot.js --dry-run
      - name: Runtime/control/research persistence regression tests
        run: >-
          node --test --test-reporter=spec
          tests/runtime-command-service.test.js
          tests/control-audit-ledger.test.js
          tests/transactional-control-command-service.test.js
          tests/funding-carry-engine.test.js
          tests/strategy-governance.test.js
          tests/investment-committee.test.js
          tests/research-memory.test.js
      - name: AI CIO dashboard read-only tests
        run: node --test --test-reporter=spec tests/ai-cio-dashboard.test.js tests/ai-cio-paper-projection.test.js tests/ai-cio-dashboard-ipc.test.js tests/ai-cio-ipc-bridge.test.js tests/ai-cio-renderer.test.js
      - name: Operational completion policy tests
        run: node --test --test-reporter=spec tests/scenario-paper-validation.test.js tests/scenario-evidence-bundle.test.js tests/operational-completion-gate.test.js tests/profitability-claim-gate.test.js tests/release-readiness-audit.test.js
      - name: Repository-wide security and readiness audit tests
        run: node --test --test-reporter=spec tests/repository-hardening.test.js tests/architecture-audit.test.js tests/desktop-sqlite-safety.test.js tests/storage-migrations.test.js tests/sqlite-recovery-drill.test.js tests/research-dataset.test.js tests/backtest-analytics.test.js tests/release-readiness-audit.test.js
      - name: Upload isolated test failure
        if: failure() && hashFiles('isolated-test-failure.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-test-failure
          path: isolated-test-failure.txt
          if-no-files-found: error
          retention-days: 7

  coverage-core:
    name: coverage-core-${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Workflow action supply-chain pins
        run: node scripts/validate-workflow-action-pins.js
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm run preflight
      - name: Build for core coverage
        run: pnpm run build
      - name: Prepare core V8 coverage directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/nusa-v8-core" | Out-Null
      - name: Core isolated coverage shard
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/nusa-v8-core
          NUSA_TEST_SHARD_COUNT: 4
          NUSA_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/run-tests-isolated.js
      - name: Upload core V8 coverage shard
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-v8-core-${{ matrix.shard }}
          path: ${{ runner.temp }}/nusa-v8-core
          if-no-files-found: error
          retention-days: 1
      - name: Upload isolated shard failure
        if: failure() && hashFiles('isolated-test-failure.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-isolated-test-failure-${{ matrix.shard }}
          path: isolated-test-failure.txt
          if-no-files-found: error
          retention-days: 7

  coverage-ui-e2e:
    name: coverage-ui-e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Workflow action supply-chain pins
        run: node scripts/validate-workflow-action-pins.js
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm run preflight
      - name: Build for UI and E2E coverage
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Produce UI and E2E coverage in parallel with core shards
        env:
          NUSA_COVERAGE_E2E_V8_DIR: ${{ runner.temp }}/nusa-v8-e2e
        run: node scripts/run-coverage.js --prepared --produce-ui-e2e
      - name: Upload UI coverage
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ui-precomputed
          path: coverage/ui
          if-no-files-found: error
          retention-days: 1
      - name: Upload E2E V8 coverage
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-v8-e2e
          path: ${{ runner.temp }}/nusa-v8-e2e
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    needs: [coverage-core, coverage-ui-e2e]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Workflow action supply-chain pins
        run: node scripts/validate-workflow-action-pins.js
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm run preflight
      - name: Download precomputed V8 coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-v8-*
          path: .coverage-v8-all
          merge-multiple: true
      - name: Download precomputed UI coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-ui-precomputed
          path: coverage/ui
      - name: Merge coverage baseline
        env:
          NUSA_COVERAGE_COMBINED_V8_DIR: .coverage-v8-all
        run: node scripts/run-coverage.js --prepared --merge-precomputed
      - name: Enforce coverage floors
        run: node scripts/check-coverage-floor.js
      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-baseline
          path: coverage
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated test failure
        if: failure() && hashFiles('isolated-test-failure.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-isolated-test-failure
          path: isolated-test-failure.txt
          if-no-files-found: error
          retention-days: 7

  test:
    name: test
    needs: [validation, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and coverage
        shell: bash
        run: |
          [ "${{ needs.validation.result }}" = "success" ]
          [ "${{ needs.coverage.result }}" = "success" ]
