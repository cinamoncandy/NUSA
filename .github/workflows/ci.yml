name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Control audit ledger tests
        run: node --test --test-reporter=spec tests/control-audit-ledger.test.js
      - name: Transactional control service tests
        run: node --test --test-reporter=spec tests/transactional-control-command-service.test.js
      - name: Funding carry safety tests
        run: node --test --test-reporter=spec tests/funding-carry-engine.test.js
      - name: Strategy governance tests
        run: node --test --test-reporter=spec tests/strategy-governance.test.js
      - name: Investment committee tests
        run: node --test --test-reporter=spec tests/investment-committee.test.js
      - name: Research persistence tests
        run: node --test --test-reporter=spec tests/research-memory.test.js
      - name: AI CIO dashboard read-only tests
        run: node --test --test-reporter=spec tests/ai-cio-dashboard.test.js tests/ai-cio-dashboard-ipc.test.js tests/ai-cio-ipc-bridge.test.js tests/ai-cio-renderer.test.js
      - name: Full isolated test suite
        run: node scripts/run-tests-isolated.js
      - name: Upload isolated test failure
        if: failure() && hashFiles('isolated-test-failure.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: isolated-test-failure
          path: isolated-test-failure.txt
          if-no-files-found: error
          retention-days: 7
