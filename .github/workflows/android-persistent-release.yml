name: Android Persistent Preview Release

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-persistent-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-persistent-preview-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/android
      - name: Prepare persistent APK assets
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk NUSA-Android.apk
          sha256sum NUSA-Android.apk > NUSA-Android.apk.sha256
      - name: Create or update persistent preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nusa-android-preview >/dev/null 2>&1; then
            gh release upload nusa-android-preview NUSA-Android.apk NUSA-Android.apk.sha256 --clobber
            gh release edit nusa-android-preview --target "$GITHUB_SHA" --title "NUSA Android Preview" --notes "Standalone Android preview build from main. PAPER/read-only safety boundaries remain unchanged." --prerelease
          else
            gh release create nusa-android-preview NUSA-Android.apk NUSA-Android.apk.sha256 --target "$GITHUB_SHA" --title "NUSA Android Preview" --notes "Standalone Android preview build from main. PAPER/read-only safety boundaries remain unchanged." --prerelease
          fi
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute NUSA-Android.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "desporin12@gmail.com" \
            --release-notes "NUSA Android preview from main ${GITHUB_SHA::8}"

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
