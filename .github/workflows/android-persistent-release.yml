name: Android Persistent Preview Release

on:
  push:
    branches: [main]
    paths:
      - ".github/android-preview-source.txt"
      - ".github/workflows/android-persistent-release.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit SHA to deploy (blank = pointer file)"
        required: false
        type: string
      release_tag:
        description: "Unique prerelease tag (blank = persistent preview)"
        required: false
        type: string
      asset_prefix:
        description: "Unique APK asset filename prefix (blank = persistent preview)"
        required: false
        type: string
      version_code:
        description: "Optional Android version code for exact preview provenance"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-persistent-preview-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and checkout exact preview source
        id: source
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA:-}"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(tr -d '[:space:]' < .github/android-preview-source.txt)"
          fi
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid source SHA: $SOURCE_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Resolve preview delivery parameters
        id: delivery
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_ASSET_PREFIX: ${{ inputs.asset_prefix }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_RELEASE_TAG:-nusa-android-preview}"
          ASSET_PREFIX="${INPUT_ASSET_PREFIX:-NUSA-Android}"
          VERSION_CODE="${INPUT_VERSION_CODE:-${GITHUB_RUN_NUMBER}}"
          printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
          printf '%s' "$ASSET_PREFIX" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
          printf '%s' "$VERSION_CODE" | grep -Eq '^[1-9][0-9]{0,9}$'
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=$ASSET_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Prepare optional canonical mobile build configuration
        id: canonical_config
        env:
          EXPO_PUBLIC_NUSA_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          NUSA_BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -f scripts/prepare-mobile-build-config.js ]; then
            node scripts/prepare-mobile-build-config.js
            test -f apps/mobile/src/generatedBuildConfig.ts
            echo "mode=sealed" >> "$GITHUB_OUTPUT"
            echo "[android-preview] canonical build config generated by target source"
          else
            echo "mode=legacy-exact-source" >> "$GITHUB_OUTPUT"
            echo "[android-preview] legacy exact source has no canonical build-config helper; LOCAL PAPER does not require Cloud bootstrap"
          fi

      - name: Verify canonical config when supported by target source
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          CONFIG_MODE: ${{ steps.canonical_config.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$CONFIG_MODE" = "sealed" ]; then
            test -n "$EXPECTED_ORIGIN"
            grep -F "export const CANONICAL_NUSA_ORIGIN = \"$EXPECTED_ORIGIN\";" apps/mobile/src/generatedBuildConfig.ts
            grep -F "$EXPECTED_SHA" apps/mobile/src/generatedBuildConfig.ts
            ! grep -E 'localhost|127\.0\.0\.1|trycloudflare\.com' apps/mobile/src/generatedBuildConfig.ts
          else
            test "$CONFIG_MODE" = "legacy-exact-source"
            test ! -f scripts/prepare-mobile-build-config.js
          fi

      - name: Probe canonical NUSA Cloud health (advisory)
        env:
          NUSA_MOBILE_API_BASE_URL: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: |
          node <<'NODE'
          (async () => {
            const origin = new URL(process.env.NUSA_MOBILE_API_BASE_URL);
            if (origin.protocol !== 'https:' || origin.username || origin.password || origin.search || origin.hash) {
              throw new Error('canonical NUSA origin must remain credential-free HTTPS');
            }

            let response;
            try {
              response = await fetch(new URL('/health', origin), {
                redirect: 'manual',
                signal: AbortSignal.timeout(15000),
                headers: { 'user-agent': 'nusa-android-persistent-preview-origin-probe' }
              });
            } catch (error) {
              console.warn(`::warning title=NUSA Cloud health unavailable::${error instanceof Error ? error.message : String(error)}`);
              console.log(`[android-preview] canonical NUSA health unavailable; continuing standalone LOCAL PAPER/native public-quotation preview for ${origin.origin}`);
              return;
            }

            if (new URL(response.url).origin !== origin.origin) {
              throw new Error('canonical NUSA /health changed origin');
            }
            if (response.status !== 200) {
              console.warn(`::warning title=NUSA Cloud health unavailable::canonical NUSA /health returned ${response.status}`);
              console.log(`[android-preview] canonical NUSA health unavailable; continuing standalone LOCAL PAPER/native public-quotation preview for ${origin.origin}`);
              return;
            }

            let body;
            try {
              body = await response.json();
            } catch {
              console.warn('::warning title=NUSA Cloud health unavailable::canonical NUSA /health did not return JSON');
              return;
            }
            if (body?.ok !== true) {
              console.warn('::warning title=NUSA Cloud health unavailable::canonical NUSA /health did not report ok=true');
              return;
            }
            console.log(`[android-preview] canonical NUSA health PASS ${origin.origin}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: Build exact-source release APK from a clean JS/native output tree
        env:
          NUSA_BUILD_SHA: ${{ steps.source.outputs.sha }}
          NUSA_BUILD_NUMBER: ${{ steps.delivery.outputs.version_code }}
          NUSA_CANONICAL_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
        run: ./gradlew clean :app:assembleRelease --no-build-cache
        working-directory: apps/mobile/android

      - name: Verify APK exact-source provenance and bundled PAPER learning UI
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_RUN_NUMBER: ${{ steps.delivery.outputs.version_code }}
          EXPECTED_ORIGIN: ${{ vars.NUSA_MOBILE_API_BASE_URL }}
          CONFIG_MODE: ${{ steps.canonical_config.outputs.mode }}
          ASSET_PREFIX: ${{ steps.delivery.outputs.asset_prefix }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          EXPECTED_SHORT_SHA="${EXPECTED_SHA:0:8}"
          EXPECTED_VERSION_NAME="1.0.${EXPECTED_RUN_NUMBER}-${EXPECTED_SHORT_SHA}"
          EXPECTED_VERSION_CODE="$EXPECTED_RUN_NUMBER"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$PACKAGE_NAME" = "com.nusa.mobile"
          printf '%s\n' "$BADGING" | grep -F "versionCode='${EXPECTED_VERSION_CODE}'"
          printf '%s\n' "$BADGING" | grep -F "versionName='${EXPECTED_VERSION_NAME}'"
          "$AAPT" dump --values resources "$APK" | grep -F "$EXPECTED_SHA"
          BUNDLE_PATH="$(unzip -Z1 "$APK" | grep -E '(^|/)index\.android\.bundle$' | head -n 1)"
          test -n "$BUNDLE_PATH"
          BUNDLE_FILE="$RUNNER_TEMP/index.android.bundle"
          unzip -p "$APK" "$BUNDLE_PATH" > "$BUNDLE_FILE"
          for UI_MARKER in home-paper-learning trade-paper-learning portfolio-paper-learning paper-learning-monitor; do
            strings "$BUNDLE_FILE" | grep -F "$UI_MARKER"
          done
          SEALED_ORIGIN="legacy-source-not-embedded"
          if [ "$CONFIG_MODE" = "sealed" ]; then
            "$AAPT" dump --values resources "$APK" | grep -F "$EXPECTED_ORIGIN"
            SEALED_ORIGIN="$EXPECTED_ORIGIN"
          fi
          printf 'source_sha=%s\ncanonical_origin=%s\nconfig_mode=%s\npackage=%s\nversion_name=%s\nversion_code=%s\nbuild_variant=release\nworkflow_run=%s\nui_marker=paper-learning-present\n' \
            "$EXPECTED_SHA" "$SEALED_ORIGIN" "$CONFIG_MODE" "$PACKAGE_NAME" "$EXPECTED_VERSION_NAME" "$EXPECTED_VERSION_CODE" "$GITHUB_RUN_ID" \
            > "${ASSET_PREFIX}.provenance.txt"

      - name: Prepare persistent APK assets
        env:
          ASSET_PREFIX: ${{ steps.delivery.outputs.asset_prefix }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "${ASSET_PREFIX}.apk"
          sha256sum "${ASSET_PREFIX}.apk" > "${ASSET_PREFIX}.apk.sha256"
          APK_SHA="$(awk '{print $1}' "${ASSET_PREFIX}.apk.sha256")"
          printf 'apk_sha256=%s\n' "$APK_SHA" >> "${ASSET_PREFIX}.provenance.txt"

      - name: Create unique preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          RELEASE_TAG: ${{ steps.delivery.outputs.release_tag }}
          ASSET_PREFIX: ${{ steps.delivery.outputs.asset_prefix }}
        run: |
          NOTES="Standalone Android preview from exact source $SHORT_SHA. Exact source provenance and PAPER learning UI bundle marker verified. LOCAL PAPER remains usable without Cloud bootstrap; LIVE/withdraw/transfer safety boundaries remain unchanged."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" "${ASSET_PREFIX}.apk" "${ASSET_PREFIX}.apk.sha256" "${ASSET_PREFIX}.provenance.txt" --target "$TARGET_SHA" --title "NUSA Android Preview $SHORT_SHA" --notes "$NOTES" --prerelease
          fi

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        continue-on-error: true
        run: npm install --global firebase-tools

      - name: Distribute APK to Firebase App Distribution
        id: firebase
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          ASSET_PREFIX: ${{ steps.delivery.outputs.asset_prefix }}
        run: |
          firebase appdistribution:distribute "${ASSET_PREFIX}.apk" \
            --app "$FIREBASE_APP_ID" \
            --testers "desporin12@gmail.com" \
            --release-notes "NUSA Android LOCAL PAPER preview from exact source $SHORT_SHA; fresh bundle + PAPER learning marker verified"

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Publish deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          FIREBASE_OUTCOME: ${{ steps.firebase.outcome }}
          JOB_STATUS: ${{ job.status }}
          ASSET_PREFIX: ${{ steps.delivery.outputs.asset_prefix }}
        run: |
          set -u
          SOURCE="${SOURCE_SHA:-unresolved}"
          APK_SHA="unavailable"
          VERSION_NAME="unavailable"
          VERSION_CODE="unavailable"
          PACKAGE_NAME="unavailable"
          BUILD_VARIANT="unavailable"
          WORKFLOW_RUN="${GITHUB_RUN_ID}"
          SEALED_ORIGIN="unavailable"
          CONFIG_MODE="unavailable"
          UI_MARKER="unavailable"
          if [ -f "${ASSET_PREFIX}.apk.sha256" ]; then
            APK_SHA="$(awk '{print $1}' "${ASSET_PREFIX}.apk.sha256")"
          fi
          if [ -f "${ASSET_PREFIX}.provenance.txt" ]; then
            SEALED_ORIGIN="$(sed -n 's/^canonical_origin=//p' "${ASSET_PREFIX}.provenance.txt")"
            CONFIG_MODE="$(sed -n 's/^config_mode=//p' "${ASSET_PREFIX}.provenance.txt")"
            VERSION_NAME="$(sed -n 's/^version_name=//p' "${ASSET_PREFIX}.provenance.txt")"
            VERSION_CODE="$(sed -n 's/^version_code=//p' "${ASSET_PREFIX}.provenance.txt")"
            PACKAGE_NAME="$(sed -n 's/^package=//p' "${ASSET_PREFIX}.provenance.txt")"
            BUILD_VARIANT="$(sed -n 's/^build_variant=//p' "${ASSET_PREFIX}.provenance.txt")"
            WORKFLOW_RUN="$(sed -n 's/^workflow_run=//p' "${ASSET_PREFIX}.provenance.txt")"
            UI_MARKER="$(sed -n 's/^ui_marker=//p' "${ASSET_PREFIX}.provenance.txt")"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Android preview deployment receipt

          - job_status: ${JOB_STATUS}
          - firebase_outcome: ${FIREBASE_OUTCOME:-not_run}
          - source_sha: ${SOURCE}
          - canonical_origin: ${SEALED_ORIGIN}
          - config_mode: ${CONFIG_MODE}
          - package: ${PACKAGE_NAME}
          - version_name: ${VERSION_NAME}
          - version_code: ${VERSION_CODE}
          - build_variant: ${BUILD_VARIANT}
          - workflow_run: ${WORKFLOW_RUN}
          - ui_marker: ${UI_MARKER}
          - apk_sha256: ${APK_SHA}
          - run: ${RUN_URL}
          EOF
          )
          gh issue comment 558 --body "$BODY"
