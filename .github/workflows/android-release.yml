name: Android RC and Release

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit SHA to package (blank = current workflow SHA)"
        required: false
        type: string
      channel:
        description: "Package channel"
        required: true
        default: rc
        type: choice
        options:
          - rc
          - release
      physical_acceptance_evidence:
        description: "Required evidence reference for a final release; unused for RC"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-rc-release
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and checkout requested source
        id: source
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA:-${GITHUB_SHA}}"
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid source SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Resolve channel
        id: channel
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'rc' }}
          ACCEPTANCE_EVIDENCE: ${{ inputs.physical_acceptance_evidence }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="$REQUESTED_CHANNEL"
          case "$CHANNEL" in
            rc|release) ;;
            *) echo "Unsupported channel" >&2; exit 1 ;;
          esac
          if [ "$CHANNEL" = "release" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Final release packaging is manual-only" >&2
            exit 1
          fi
          if [ "$CHANNEL" = "release" ] && [ -z "$ACCEPTANCE_EVIDENCE" ]; then
            echo "Final release requires a physical-device acceptance evidence reference" >&2
            exit 1
          fi
          echo "value=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 11076708

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run android:release-model:check
      - run: chmod +x apps/mobile/android/gradlew
      - run: chmod +x apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc

      - name: Resolve product version
        id: product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_VERSION="$(node -p "require('./apps/mobile/package.json').version")"
          printf '%s\n' "$PRODUCT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$PRODUCT_VERSION" = "1.0.101"
          echo "value=$PRODUCT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble exact-source Android package
        run: ./gradlew :app:assembleRelease
        working-directory: apps/mobile/android
        env:
          NUSA_BUILD_SHA: ${{ steps.source.outputs.sha }}
          NUSA_BUILD_NUMBER: ${{ github.run_number }}
          NUSA_BUILD_CHANNEL: ${{ steps.channel.outputs.value }}

      - name: Validate Android package metadata and provenance
        id: package
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          PRODUCT_VERSION: ${{ steps.product.outputs.value }}
          CHANNEL: ${{ steps.channel.outputs.value }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/35.0.0/zipalign"
          test -f "$APK"
          test -x "$AAPT" && test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          BADGING="$($AAPT dump badging "$APK")"
          VERSION_NAME="$PRODUCT_VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$PRODUCT_VERSION"
          VERSION_CODE_BASE=$((MAJOR * 10000000 + MINOR * 100000 + PATCH * 10))
          VERSION_CODE="$VERSION_CODE_BASE"
          if [ "$CHANNEL" = "rc" ]; then VERSION_NAME="${PRODUCT_VERSION}-rc.${RUN_NUMBER}"; VERSION_CODE=$((VERSION_CODE_BASE + 1)); fi
          if [ "$CHANNEL" = "release" ]; then VERSION_CODE=$((VERSION_CODE_BASE + 2)); fi
          printf '%s\n' "$BADGING" | grep -F "package: name='com.nusa.mobile'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION_NAME'"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          SHORT_SHA="${EXPECTED_SHA:0:8}"
          APK_NAME="NUSA-Android-${PRODUCT_VERSION}-${CHANNEL}-${SHORT_SHA}.apk"
          cp "$APK" "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$APK_NAME" > "$APK_NAME.sha256"
          cat > "$APK_NAME.provenance.txt" <<EOF
          source_sha=$EXPECTED_SHA
          product_version=$PRODUCT_VERSION
          version_name=$VERSION_NAME
          version_code=$VERSION_CODE
          channel=$CHANNEL
          build_number=$RUN_NUMBER
          package=com.nusa.mobile
          signing_config=debug
          apk_sha256=$SHA256
          physical_acceptance_required=true
          EOF
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create immutable RC or final release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          PRODUCT_VERSION: ${{ steps.product.outputs.value }}
          CHANNEL: ${{ steps.channel.outputs.value }}
          ACCEPTANCE_EVIDENCE: ${{ inputs.physical_acceptance_evidence }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "release" ]; then
            TAG="nusa-android-v${PRODUCT_VERSION}"
            TITLE="NUSA Android ${PRODUCT_VERSION}"
            NOTES="Final Android release ${PRODUCT_VERSION}. Source: ${TARGET_SHA}. Physical-device acceptance evidence: ${ACCEPTANCE_EVIDENCE}."
            gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" "$APK_NAME.provenance.txt" --target "$TARGET_SHA" --title "$TITLE" --notes "$NOTES"
          else
            TAG="nusa-android-rc-${PRODUCT_VERSION}-${SHORT_SHA}"
            TITLE="NUSA Android ${PRODUCT_VERSION} RC"
            NOTES="Installable Android release candidate for Galaxy physical-device acceptance. Source: ${TARGET_SHA}. LIVE and production mutation remain disabled."
            gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" "$APK_NAME.provenance.txt" --target "$TARGET_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi

      - name: Optional Firebase secondary distribution
        if: ${{ steps.channel.outputs.value == 'rc' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          PRODUCT_VERSION: ${{ steps.product.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "Firebase secondary distribution not configured; GitHub release remains canonical."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-service-account.json"' EXIT
          npm install --global firebase-tools
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" firebase appdistribution:distribute "$APK_NAME" --app "$FIREBASE_APP_ID" --testers "desporin12@gmail.com" --release-notes "NUSA Android ${PRODUCT_VERSION:-1.0.101} RC from ${SHORT_SHA}; GitHub release is canonical."

      - name: Publish deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CHANNEL: ${{ steps.channel.outputs.value }}
          APK_SHA: ${{ steps.package.outputs.sha256 }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          gh issue comment 558 --body "Android ${CHANNEL:-rc} deployment receipt\n\n- job_status: ${JOB_STATUS}\n- source_sha: ${SOURCE_SHA:-unresolved}\n- apk_sha256: ${APK_SHA:-unavailable}\n- physical_device_acceptance: required before final release"
