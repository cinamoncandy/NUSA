# Installed with the controller (C3). The host mode is MANDATORY from then on: the unit refuses to start when the mode file is
# missing (no "-" prefix on EnvironmentFile=), and the runtime is told to treat a missing NUSA_RUN_MODE as "no order path".
# The legacy switch is removed from the unit's environment (and from the env files it reads) so that only the controller's
# mode file can name a mode; PAPER_ORDERS stays unavailable in this version because the controller can only write COLLECT_ONLY.
[Service]
EnvironmentFile=/etc/nusa/run-mode.env
Environment=NUSA_REQUIRE_RUN_MODE=1
UnsetEnvironment=NUSA_PAPER_ORDER_PATH
