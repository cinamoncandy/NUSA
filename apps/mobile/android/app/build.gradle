apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")

    def hermesBinDir = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "win64-bin" : (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "osx-bin" : "linux64-bin")
    hermesCommand = "${rootDir}/../node_modules/hermes-compiler/hermesc/${hermesBinDir}/hermesc"

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Every installable build carries its source identity. CI supplies the exact
// PR head SHA and run number; local builds intentionally fall back to a clear
// development identity instead of pretending to be a release candidate.
def nusaBuildSha = (System.getenv("NUSA_BUILD_SHA") ?: "dev").trim()
def nusaBuildNumberRaw = (System.getenv("NUSA_BUILD_NUMBER") ?: "0").replaceAll("[^0-9]", "")
def nusaBuildNumber = nusaBuildNumberRaw ? nusaBuildNumberRaw.toLong() : 0L
def nusaVersionCode = Math.max(1L, Math.min(nusaBuildNumber, 2100000000L)).intValue()
def nusaShortSha = nusaBuildSha.length() > 8 ? nusaBuildSha.substring(0, 8) : nusaBuildSha
def nusaVersionName = "1.0.${nusaBuildNumber}-${nusaShortSha}"
def nusaCanonicalOrigin = (System.getenv("NUSA_CANONICAL_ORIGIN") ?: "").trim()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nusa.mobile"
    defaultConfig {
        applicationId "com.nusa.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nusaVersionCode
        versionName nusaVersionName
        buildConfigField "String", "NUSA_BUILD_SHA", "\"${nusaBuildSha}\""
        buildConfigField "String", "NUSA_BUILD_NUMBER", "\"${nusaBuildNumber}\""
        // Keep the complete source commit and non-secret canonical Cloud origin
        // in packaged Android resources as independent RC provenance anchors.
        resValue "string", "nusa_build_sha", nusaBuildSha
        resValue "string", "nusa_canonical_origin", nusaCanonicalOrigin
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
