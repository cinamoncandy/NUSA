apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")

    def hermesBinDir = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "win64-bin" : (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "osx-bin" : "linux64-bin")
    hermesCommand = "${rootDir}/../node_modules/hermes-compiler/hermesc/${hermesBinDir}/hermesc"

    debuggableVariants = project.hasProperty("nusaEmbedDebugBundle") ? [] : ["debug"]

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def nusaBuildSha = (System.getenv("NUSA_BUILD_SHA") ?: "dev").trim()
def nusaBuildNumberRaw = (System.getenv("NUSA_BUILD_NUMBER") ?: "0").replaceAll("[^0-9]", "")
def nusaBuildNumber = nusaBuildNumberRaw ? nusaBuildNumberRaw.toLong() : 0L
def nusaVersionCode = Math.max(1L, Math.min(nusaBuildNumber, 2100000000L)).intValue()
def nusaShortSha = nusaBuildSha.length() > 8 ? nusaBuildSha.substring(0, 8) : nusaBuildSha
def nusaVersionName = "1.0.${nusaBuildNumber}-${nusaShortSha}"
def nusaCanonicalOrigin = (System.getenv("NUSA_CANONICAL_ORIGIN") ?: "").trim()

// Stable Android builds must never fall back to the repository debug key.
// Release signing material is supplied only at build time through protected CI secrets.
def nusaReleaseKeystorePath = (System.getenv("NUSA_ANDROID_RELEASE_KEYSTORE_PATH") ?: "").trim()
def nusaReleaseStorePassword = (System.getenv("NUSA_ANDROID_RELEASE_STORE_PASSWORD") ?: "").trim()
def nusaReleaseKeyAlias = (System.getenv("NUSA_ANDROID_RELEASE_KEY_ALIAS") ?: "").trim()
def nusaReleaseKeyPassword = (System.getenv("NUSA_ANDROID_RELEASE_KEY_PASSWORD") ?: "").trim()
def nusaReleaseSigningReady = nusaReleaseKeystorePath && nusaReleaseStorePassword && nusaReleaseKeyAlias && nusaReleaseKeyPassword && file(nusaReleaseKeystorePath).isFile()
def nusaReleaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (nusaReleaseTaskRequested && !nusaReleaseSigningReady) {
    throw new GradleException("NUSA_ANDROID_RELEASE_SIGNING_REQUIRED: release builds require a dedicated protected signing key")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nusa.mobile"
    defaultConfig {
        applicationId "com.nusa.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nusaVersionCode
        versionName nusaVersionName
        buildConfigField "String", "NUSA_BUILD_SHA", "\"${nusaBuildSha}\""
        buildConfigField "String", "NUSA_BUILD_NUMBER", "\"${nusaBuildNumber}\""
        resValue "string", "nusa_build_sha", nusaBuildSha
        if (nusaCanonicalOrigin) resValue "string", "nusa_canonical_origin", nusaCanonicalOrigin
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (nusaReleaseSigningReady) {
            release {
                storeFile file(nusaReleaseKeystorePath)
                storePassword nusaReleaseStorePassword
                keyAlias nusaReleaseKeyAlias
                keyPassword nusaReleaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
        }
        release {
            if (nusaReleaseSigningReady) signingConfig signingConfigs.release
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
