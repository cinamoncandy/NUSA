apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")

    def hermesBinDir = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "win64-bin" : (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "osx-bin" : "linux64-bin")
    hermesCommand = "${rootDir}/../node_modules/hermes-compiler/hermesc/${hermesBinDir}/hermesc"

    // Variants listed here are built WITHOUT an embedded JS bundle and load their
    // JavaScript from a Metro dev server instead. That is what you want while
    // developing locally (fast refresh), and exactly what you do not want for an
    // APK a human installs on a device: such a build ships zero application code,
    // so it renders whatever stale JS the device or Metro happens to serve and
    // appears frozen at an old UI no matter what has been merged.
    //
    // Pass -PnusaEmbedDebugBundle (CI does) to bundle the debug variant too, so the
    // uploaded debug APK is genuinely self-contained and installable.
    debuggableVariants = project.hasProperty("nusaEmbedDebugBundle") ? [] : ["debug"]

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Product version comes from the mobile package metadata. The CI run number is
// provenance only; it must never become the product patch version or Android
// versionCode.
def nusaMobilePackage = new groovy.json.JsonSlurper().parse(file("../../package.json"))
def nusaProductVersion = (nusaMobilePackage.version ?: "").toString().trim()
def nusaProductParts = nusaProductVersion.tokenize(".")
if (nusaProductParts.size() != 3 || !nusaProductParts.every { it ==~ /[0-9]+/ }) {
    throw new GradleException("Invalid mobile product version: ${nusaProductVersion}")
}
def nusaProductMajor = nusaProductParts[0].toInteger()
def nusaProductMinor = nusaProductParts[1].toInteger()
def nusaProductPatch = nusaProductParts[2].toInteger()
// Keep versionCode above historical run-number builds while making every
// semver/channel pair unique and monotonically ordered. The final digit is
// reserved for the channel slot: debug=0, RC=1, release=2.
def nusaProductVersionCodeBase = (nusaProductMajor * 10000000) + (nusaProductMinor * 100000) + (nusaProductPatch * 10)

// Every installable build carries its source identity. CI supplies the exact
// source SHA and run number; the channel controls only the human-facing RC
// identity. No channel can grant execution or production authority.
def nusaBuildSha = (System.getenv("NUSA_BUILD_SHA") ?: "dev").trim()
def nusaBuildNumberRaw = (System.getenv("NUSA_BUILD_NUMBER") ?: "0").replaceAll("[^0-9]", "")
def nusaBuildNumber = nusaBuildNumberRaw ? nusaBuildNumberRaw.toLong() : 0L
def nusaBuildChannel = (System.getenv("NUSA_BUILD_CHANNEL") ?: "debug").trim().toLowerCase()
if (!(nusaBuildChannel in ["debug", "rc", "release"])) {
    throw new GradleException("Unsupported Android build channel: ${nusaBuildChannel}")
}
def nusaVersionCode = nusaProductVersionCodeBase + (nusaBuildChannel == "rc" ? 1 : nusaBuildChannel == "release" ? 2 : 0)
if (nusaVersionCode < 1 || nusaVersionCode > 2100000000) {
    throw new GradleException("Invalid Android versionCode derived from ${nusaProductVersion}/${nusaBuildChannel}: ${nusaVersionCode}")
}
def nusaShortSha = nusaBuildSha.length() > 8 ? nusaBuildSha.substring(0, 8) : nusaBuildSha
def nusaVersionName = nusaBuildChannel == "rc" ? "${nusaProductVersion}-rc.${nusaBuildNumber}" : nusaProductVersion
def nusaCanonicalOrigin = (System.getenv("NUSA_CANONICAL_ORIGIN") ?: "").trim()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.nusa.mobile"
    defaultConfig {
        applicationId "com.nusa.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nusaVersionCode
        versionName nusaVersionName
        buildConfigField "String", "NUSA_PRODUCT_VERSION", "\"${nusaProductVersion}\""
        buildConfigField "String", "NUSA_BUILD_CHANNEL", "\"${nusaBuildChannel}\""
        buildConfigField "String", "NUSA_BUILD_SHA", "\"${nusaBuildSha}\""
        buildConfigField "String", "NUSA_BUILD_NUMBER", "\"${nusaBuildNumber}\""
        // Keep the complete source commit in the packaged Android resources as
        // well as BuildConfig so exact-source provenance remains independently
        // visible.
        resValue "string", "nusa_build_sha", nusaBuildSha
        // The HTTPS origin is non-secret deployment metadata. The release workflow
        // supplies it only after the canonical-origin helper validates it.
        if (nusaCanonicalOrigin) resValue "string", "nusa_canonical_origin", nusaCanonicalOrigin
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Keep Metro development installs isolated from the installable
            // com.nusa.mobile RC/release identity without reusing the retired
            // installable artifact identity.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
